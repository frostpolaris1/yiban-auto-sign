# deploy/docker/docker-compose.yml — Go 服务端＋React 前端的单机编排。
#
# 一步装成（在仓库根）：
#   cp deploy/container/compose.env.example deploy/container/compose.env
#   chmod 600 deploy/container/compose.env
#   # 填 POSTGRES_PASSWORD / YIBAN_HASH_PEPPER / YIBAN_CREDENTIAL_KEY
#   docker compose --env-file deploy/container/compose.env \
#     -f deploy/docker/docker-compose.yml up -d --build
#   curl http://127.0.0.1:8080/healthz   # 期望 {"status":"ok"}
#   curl http://127.0.0.1:8080/          # 期望前端首页 HTML
#
# 运行配置只来自 deploy/container/compose.env（0600 宿主）：本文件用
# env_file 注入 app，并用 --env-file 供 db 的服务口令插值。
# 不读取仓库根 .env：Compose 的隐式 .env 自动加载被显式 --env-file 取代，
# 旧 Python 栈的 .env 因此不可能泄漏进 Go 容器。
# 缺失 POSTGRES_PASSWORD 即拒绝启动（:? 语法），不静默用缺省口令上生产。
#
# 页面由 app 镜像内的 Go 进程托管（YIBAN_UI_DIR=/srv/ui），没有第二个代理。
# TLS 终结应放在容器外的反向代理：production 拒绝不安全 cookie，
# 明文 HTTP 下登录不可用是预期行为。外部 TLS 终结时，外层代理传
# X-Forwarded-Proto；compose.env 默认信任 Docker 网桥网关与回环。

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: yiban
      POSTGRES_USER: yiban
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/container/compose.env}
    # postgres:18 镜像改用 pg_ctlcluster 兼容布局：
    # 数据落在 /var/lib/postgresql/<主版本>/ 子目录，卷挂 /var/lib/postgresql。
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yiban -d yiban"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  app:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      # 受限网络覆盖点：不设即用官方源。
      # 这两个是构建参数，不是运行配置：不进 Go 配置名册。
      args:
        GOPROXY: ${BUILD_GOPROXY:-}
        NPM_CONFIG_REGISTRY: ${BUILD_NPM_REGISTRY:-}
    image: yiban-server:local
    # 运行配置全部来自这一份 0600 宿主文件（模板：compose.env.example）。
    # 缺省路径相对本文件：deploy/container/compose.env。
    # YIBAN_COMPOSE_ENV_FILE 只给 e2e 换到隔离目录用，生产不必设置。
    env_file:
      - ${YIBAN_COMPOSE_ENV_FILE:-../container/compose.env}
    environment:
      # DSN 由数据库口令派生：口令只保留一处来源（compose.env 的
      # POSTGRES_PASSWORD），不在 env_file 里再抄一遍。
      YIBAN_DATABASE_URL: postgres://yiban:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/container/compose.env}@db:5432/yiban?sslmode=disable
    volumes:
      - photos:/data/photos
    ports:
      # 只绑回环：对外暴露走宿主反向代理 + TLS。
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # distroless 里没有 shell 与 curl：探活由 yiban-cli healthcheck 承担，
      # 打的就是 /healthz（HTTP 200 即健康）。
      test: ["CMD", "/usr/local/bin/yiban-cli", "healthcheck",
             "--addr=127.0.0.1:8080", "--timeout=2s"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
    restart: unless-stopped
    # 停机宽限期必须大于进程内 shutdownBudget（10s）：先停 worker 领取、
    # 等在飞结算，再停 HTTP。给到 30s 留余量；否则 SIGKILL 打断收尾，
    # 残余 running 行只能靠下次启动的 Recover 回收。
    stop_grace_period: 30s

volumes:
  pgdata:
  photos:
