# deploy/docker/docker-compose.yml — Go 服务端的单机编排。
#
# 一步装成（在仓库根，先 export 三个必需变量）：
#   export YIBAN_HASH_PEPPER=$(openssl rand -hex 32)
#   export YIBAN_CREDENTIAL_KEY=$(openssl rand -base64 32)
#   export YIBAN_PG_PASSWORD=$(openssl rand -hex 16)
#   docker compose -f deploy/docker/docker-compose.yml up -d
#   curl http://127.0.0.1:8080/healthz   # 期望 {"status":"ok"}
#
# 密钥只从部署环境注入，不写进本文件。三个变量缺失即拒绝启动（:? 语法），
# 不静默用缺省密钥上生产。TLS 终结应放在容器外的反向代理：
# production 拒绝不安全 cookie，明文 HTTP 下登录不可用是预期行为。

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: yiban
      POSTGRES_USER: yiban
      POSTGRES_PASSWORD: ${YIBAN_PG_PASSWORD:?set YIBAN_PG_PASSWORD}
    # postgres:18 镜像改用 pg_ctlcluster 兼容布局：
    # 数据落在 /var/lib/postgresql/<主版本>/ 子目录，卷挂 /var/lib/postgresql。
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yiban -d yiban"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  app:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: yiban-server:local
    environment:
      YIBAN_ENV: production
      YIBAN_DATABASE_URL: postgres://yiban:${YIBAN_PG_PASSWORD}@db:5432/yiban?sslmode=disable
      YIBAN_HASH_PEPPER: ${YIBAN_HASH_PEPPER:?set YIBAN_HASH_PEPPER}
      YIBAN_CREDENTIAL_KEY: ${YIBAN_CREDENTIAL_KEY:?set YIBAN_CREDENTIAL_KEY}
      YIBAN_HTTP_ADDR: 0.0.0.0:8080
      YIBAN_TZ: Asia/Shanghai
      YIBAN_PHOTO_DIR: /data/photos
    volumes:
      - photos:/data/photos
    ports:
      # 只绑回环：对外暴露走宿主反向代理 + TLS。
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # distroless 里没有 shell 与 curl：探活由 yiban-cli healthcheck 承担，
      # 打的就是 /healthz（HTTP 200 即健康）。
      test: ["CMD", "/usr/local/bin/yiban-cli", "healthcheck",
             "--addr=127.0.0.1:8080", "--timeout=2s"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
    restart: unless-stopped

volumes:
  pgdata:
  photos:
