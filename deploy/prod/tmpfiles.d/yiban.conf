# /etc/tmpfiles.d/yiban.conf —— 锁目录与哨兵私有状态目录的属主/模式（systemd-tmpfiles）
#
# 仓库源：deploy/prod/tmpfiles.d/yiban.conf（install.sh 装到 /etc/tmpfiles.d/，0644 root:root）
#
# 两条声明：
#   1. /run/lock/yiban —— 签到锁目录，属主 yiban:yiban、模式 0700。
#      为什么需要：run.sh / run_probe.sh 与兜底执行体都要求锁目录"属主为本用户且 0700"
#      （M07 硬检查），非本用户属主即拒绝运行，不静默降级。而 /run 是 tmpfs，重启即空；
#      缺本件时锁目录只能靠脚本自建，首个以非 yiban 身份（或手工 root）触发时会把属主定错，
#      此后签到长期被拒。web/deploy/yiban-web.service 的 ReadWritePaths 也含 /var/lock/yiban
#      （/var/lock 是 /run/lock 的符号链接，故本件声明 /run/lock/yiban）。
#   2. /var/lib/yiban-backup-sentinel —— 备份哨兵的私有状态目录，属主 root:root、模式 0700。
#      为什么需要：哨兵以 root 跑，其节流表落 $YIBAN_STATE_DIR（见
#      deploy/prod/cron.d/yiban-backup-sentinel 的 YIBAN_STATE_DIR=）。若沿用 yiban 属主的
#      共享状态目录，以 root 首建即留下 root 属主文件，yiban 侧（web/signin）随即拿不到
#      跨进程锁、节流表被判损坏。独立目录 = 哨兵不碰 yiban 属主的共享件。
#
# 语法：d <路径> <模式> <用户> <组> <age>（systemd-tmpfiles 标准；age 用 - 表示不自动清理）
# 锁目录属主取服务账号（web/deploy/yiban-web.service 的 User=/Group=）；模式 0700 取自
# run.sh 的 `chmod 700 "$LOCK_DIR"` 与 README 的 `chmod 700 /var/lock/yiban`。
d /run/lock/yiban 0700 yiban yiban -
d /var/lib/yiban-backup-sentinel 0700 root root -
