# 不泄露 nginx 精确版本号
server_tokens off;

# 文本资产压缩（2026-09-14 性能审计补）。应用自身不做 gzip（Flask/gunicorn 直出明文），
# 前端样式与脚本均为文本，未压缩时单页首访要传 ~470KB（app.css 167KB + notosanssc.css
# 121KB + adminator.css 69KB + core.js 53KB + chartjs 191KB）；开启后实测可降到 ~122KB
# （app.css→52.6KB / notosanssc.css→39.5KB / adminator.css→12.7KB / core.js→17KB /
# chartjs→66KB），约降 74%。woff2 已是 brotli 压缩格式，不列入 gzip_types（避免二次压缩）。
# gzip_types 依据上游 Content-Type 匹配；此处不依赖 mime.types（静态资源仍由应用直出类型）。
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types text/plain text/css text/xml application/json application/javascript
           application/xml image/svg+xml;

# 边缘限速——应用内限速仅覆盖登录/注册等端点，慢速泛洪
# 可占满 gunicorn 单 worker 8 线程池；管理后台正常使用远低于此阈值。
# 2026-09-16 放宽为 50r/s + burst 100：生产实测从未触发过限速（error.log 零条
# "limiting requests"），但校园网等共享出口在早高峰集中开站时可能被误伤（NAT 下多人
# 共用一个额度）。放宽后仍远低于单 worker 承载上限（页面渲染实测 ~195 rps），
# 敏感端点另有应用内限速（登录 10 次/60s/纯 IP、注册 5 次/600s、校验配额与冷却）。
limit_req_zone $binary_remote_addr zone=yiban_perip:10m rate=50r/s;

server {
    listen 80;
    listen [::]:80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    # 证书由 compose 将宿主 ./certs 挂载到 /etc/yiban/certs
    ssl_certificate     /etc/yiban/certs/fullchain.pem;
    ssl_certificate_key /etc/yiban/certs/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 管理后台仅一人使用，64KB 与应用 MAX_CONTENT_LENGTH 对齐
    client_max_body_size 64k;

    location / {
        limit_req zone=yiban_perip burst=100 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:17892;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # 覆盖式 XFF（丢弃客户端自报值），应用据此取真实客户端 IP
        proxy_set_header X-Forwarded-For $remote_addr;
        # 应用据 X-Forwarded-Proto 判定 HTTPS（Secure Cookie / HSTS 场景）
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }
}