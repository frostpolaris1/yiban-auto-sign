# ============================================================
# 易班自动签到 - Docker nginx 反代
# 本容器与应用容器(yiban)【共享网络命名空间】(network_mode: service:yiban)，
# 因此应用对 nginx 来说就是回环 127.0.0.1:17892。
# ------------------------------------------------------------
# ⚠️ 安全契约（务必保持与 web/deploy/nginx.conf.example 一致）：
#   X-Forwarded-For 必须用【覆盖式】$remote_addr，绝不能写成网上常见的
#   追加式 $proxy_add_x_forwarded_for——那会让客户端自报的伪造 IP 留在首位，
#   登录锁定 / API 限速 / 注册限速将全部失效（按伪造 IP 分桶）。
# ============================================================

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    # 证书由 compose 将宿主 ./certs 挂载到 /etc/yiban/certs
    ssl_certificate     /etc/yiban/certs/fullchain.pem;
    ssl_certificate_key /etc/yiban/certs/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 管理后台仅一人使用，64KB 与应用 MAX_CONTENT_LENGTH 对齐
    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:17892;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # 覆盖式 XFF（丢弃客户端自报值），应用据此取真实客户端 IP
        proxy_set_header X-Forwarded-For $remote_addr;
        # 应用据 X-Forwarded-Proto 判定 HTTPS（Secure Cookie / HSTS 场景）
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }
}