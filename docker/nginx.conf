# 批次7 P4-7：不泄露 nginx 精确版本号
server_tokens off;

# 批次7 P3-20：边缘限速——应用内限速仅覆盖登录/注册等端点，慢速泛洪
# 可占满 gunicorn 单 worker 8 线程池；管理后台正常使用远低于此阈值
limit_req_zone $binary_remote_addr zone=yiban_perip:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    # 证书由 compose 将宿主 ./certs 挂载到 /etc/yiban/certs
    ssl_certificate     /etc/yiban/certs/fullchain.pem;
    ssl_certificate_key /etc/yiban/certs/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 管理后台仅一人使用，64KB 与应用 MAX_CONTENT_LENGTH 对齐
    client_max_body_size 64k;

    location / {
        limit_req zone=yiban_perip burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:17892;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # 覆盖式 XFF（丢弃客户端自报值），应用据此取真实客户端 IP
        proxy_set_header X-Forwarded-For $remote_addr;
        # 应用据 X-Forwarded-Proto 判定 HTTPS（Secure Cookie / HSTS 场景）
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }
}