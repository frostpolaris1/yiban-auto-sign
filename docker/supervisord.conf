; ============================================================
; 易班自动签到 - 容器内进程管理
; 与现有 systemd 部署保持相同安全语义（单 worker、无控制 socket）
; ============================================================
[supervisord]
nodaemon=true
; 对齐 systemd 部署 UMask=0077——日志/状态文件 0600
umask=077
; supervisord 自身日志轮转（_cleanup_logs 只清 sign-*.log）
logfile_maxbytes=10MB
logfile_backups=3
logfile=/data/logs/supervisord.log
pidfile=/data/logs/supervisord.pid

; ---- Web 管理端 ----
; 必须保持 -w 1（单 worker 多线程）：限速/爆破锁定/签到防抖等状态存于进程内存，
; 多 worker 各自持有独立副本会导致阈值被轮换请求绕过（安全审查 S2）。
; 命令与 web/deploy/yiban-web.service 模板一致。
[program:web]
command=/usr/local/bin/gunicorn -w 1 --threads 8 --timeout 60 --no-control-socket -b 127.0.0.1:17892 "web.app:create_app()"
directory=/app
user=yiban
autorestart=true
stdout_logfile=/data/logs/web.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/data/logs/web.log
stopwaitsecs=5

; ---- 签到调度 ----
; 复刻宿主 cron：06:31 首签 + 07:10 补签 + 23:55 探针入口 + 每日 03:00 清理
[program:sched]
command=/usr/local/bin/python3 scripts/container_scheduler.py
directory=/app
user=yiban
autorestart=true
; 探活参数（默认值即失效形态 startsecs=1 + startretries=3）：sched 若在启动
; 头 1 秒内崩溃（重启后第一个判定就炸的形态），三次尝试都不到 startsecs ⇒
; 秒级三连进 FATAL，全天无人再拉起。startsecs=5：调度 tick 周期 1 秒，活过
; 约 5 拍才算"启动成功"——此后崩溃走 RUNNING→BACKOFF 重启链且失败计数清零，
; 等于无限重拉；startretries=10：真·启动即崩也重试 10 次（带退避间隔）才定
; FATAL，足够跨过 /data 卷未就绪、解释器暂不可达这类分钟级抖动。
; 容器内整链生效待生产演练（本机无 supervisord）。
startsecs=5
startretries=10
stdout_logfile=/data/logs/sched.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/data/logs/sched.log
stopwaitsecs=5