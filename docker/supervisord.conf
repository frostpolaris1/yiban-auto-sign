; ============================================================
; 易班自动签到 - 容器内进程管理
; 与现有 systemd 部署保持相同安全语义（单 worker、无控制 socket）
; ============================================================
[supervisord]
nodaemon=true
; 批次7 P3-15：对齐 systemd 部署 UMask=0077——日志/状态文件 0600
umask=077
; 批次7 P4-17：supervisord 自身日志轮转（_cleanup_logs 只清 sign-*.log）
logfile_maxbytes=10MB
logfile_backups=3
logfile=/data/logs/supervisord.log
pidfile=/data/logs/supervisord.pid

; ---- Web 管理端 ----
; 必须保持 -w 1（单 worker 多线程）：限速/爆破锁定/签到防抖等状态存于进程内存，
; 多 worker 各自持有独立副本会导致阈值被轮换请求绕过（安全审查 S2）。
; 命令与 web/deploy/yiban-web.service 模板一致。
[program:web]
command=/usr/local/bin/gunicorn -w 1 --threads 8 --no-control-socket -b 127.0.0.1:17892 "web.app:create_app()"
directory=/app
user=yiban
autorestart=true
stdout_logfile=/data/logs/web.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/data/logs/web.log
stopwaitsecs=5

; ---- 签到调度 ----
; 复刻宿主 cron：06:31 首签 + 07:10 补签 + 23:55 探针入口 + 每日 03:00 清理
[program:sched]
command=/usr/local/bin/python3 scripts/container_scheduler.py
directory=/app
user=yiban
autorestart=true
stdout_logfile=/data/logs/sched.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/data/logs/sched.log
stopwaitsecs=5