# ============================================================
# 易班自动签到 - Docker 部署编排
# 用法：docker compose up -d --build
# ------------------------------------------------------------
# 服务组成：
#   yiban        应用容器（supervisor 常驻：gunicorn Web + 签到调度）
#   yiban-nginx  反代容器（共享 yiban 网络栈，对外 80/443 HTTPS）
# 数据：./data 目录 bind mount 到 /data（SQLite/.env/日志/加密密钥）
# ============================================================
name: yiban-auto-sign

services:
  yiban:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: yiban
    restart: unless-stopped

    # 运行时加固（2026-08-27 审查 P2-11）：入口做卷准备后按 yiban 用户拉起
    # 业务进程；禁新特权并收敛 capabilities 至 supervisord 所需最小集。
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN        # 入口脚本调整 /data 卷属主
      - DAC_OVERRIDE # 宿主卷属主受限时兜底读写
      - FOWNER       # 应用 0600 敏感文件写入语义
      - SETGID
      - SETUID       # supervisord 切换到 yiban 用户
      - KILL         # supervisord 停止子进程

    # yiban-nginx 会共享本容器的网络命名空间，因此 80/443 在这里声明。
    # 注意：容器内 gunicorn 只监听回环 127.0.0.1:17892，不经共享栈的
    # nginx 就访问不到——保证应用不直接暴露公网（沿用现有部署安全模型）。
    ports:
      - "80:80"
      - "443:443"

    environment:
      - TZ=Asia/Shanghai          # 参与签到窗口计算，缺省会错 8 小时
      - YIBAN_ENV_FILE=/data/.env
      - YIBAN_DB_FILE=/data/yiban.db
      - YIBAN_ACCOUNTS_FILE=/data/accounts.json
      - YIBAN_STATE_DIR=/data/state
      - YIBAN_LOG_FILE=/data/logs/sign.log
      # 经容器内 nginx HTTPS 反代，强制会话 Cookie 仅经 HTTPS 发送
      - YIBAN_COOKIE_SECURE=1

    volumes:
      - ./data:/data
      # 可选：自定义 Web 图标（没有则显示占位符，不影响任何功能）
      # 你自己的图标放 ./logo.png 后取消此行注释即可
      # - ./logo.png:/app/web/static/vendor/logo.png:ro

    healthcheck:
      # 双探活：web 端口 + sched 心跳。只 curl web 时 sched 崩溃/躺平（supervisord
      # FATAL）容器照样"健康"，restart: unless-stopped 永不救。sched 侧调调度器自带
      # 出口 --check-health：状态目录里心跳文件（守护线程周期落盘，签到子进程
      # wait 期间不断流）mtime 在容忍窗内则 0，陈旧/缺失则 1。
      # 容器内整链生效待生产演练（本机无 docker 运行时）。
      test: ["CMD-SHELL",
             "python3 -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:17892/login', timeout=3)\" && python3 scripts/container_scheduler.py --check-health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  yiban-nginx:
    # 1.27 线 2025-06-24 已 EOL（无安全更新），升到当前 stable 1.30 线
    image: nginx:1.30-alpine
    container_name: yiban-nginx
    restart: unless-stopped
    # 关键：与应用共享网络命名空间。这样 nginx 到应用是回环 127.0.0.1，
    # 与应用"仅信任回环 XFF"的安全契约完全一致，限速/登录锁定不失效。
    network_mode: "service:yiban"
    depends_on:
      yiban:
        # healthcheck 留作可观测性/重启依据，不作为 nginx 启动门槛：双探活下
        # sched 侧一次故障就让整容器"不健康"，若 nginx 等健康再起，web 会因
        # sched 故障连坐全下线（旧单探 web 形态无此耦合）。
        condition: service_started
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/yiban/certs:ro   # 需 ./certs/fullchain.pem 和 ./certs/key.pem
    # nginx 同样禁新特权；只读根文件系统 + tmpfs 承接运行时缓存/pid 目录
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=16m
      - /var/run:size=1m
      - /tmp:size=4m