# oapi-codegen v2 configuration for the host API contract.
#
# Input:  contracts/openapi.yaml (OpenAPI 3.1)
# Output: internal/entry/http/oapi — generated code is a contract mirror.
#          canonical.tsv allows frozen status literals in that directory.
#
# Regenerate with the pinned generator v2.8.1:
#   ./scripts/generate.sh
package: oapi
generate:
  models: true
  gin-server: true
output-options:
  skip-prune: false
