        default: { $ref: '#/components/responses/DefaultError' }
  /api/accounts:
    get:
      tags: [accounts]
      operationId: AccountList
      summary: List accounts with cursor pagination.
      description: |
        master sees all schools; admin sees bound schools; user sees own
        accounts. school_id, status and q narrow the result.
        The ETag is the sha256 of the response body (quoted hex). The 304
        answer is decided after authentication and scope resolution, so a
        request that cannot read this page never gets a 304. If-None-Match
        honours the weak comparison, comma lists and `*`; repeated header
        lines are merged per RFC 9110 section 5.3.
      x-roles: [master, admin, user]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: school_id
          in: query
          required: false
          schema: { type: string }
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/AccountStatus'
        - name: q
          in: query
          required: false
          description: |
            A complete phone (11 digits, optionally prefixed by 86/+86) matches
            the phone exactly, or an effective remark name equal to the
            normalized 11 digits. A phone query consists only of digits and the
            separators + - . ( ) and whitespace; letters or @ make it a
            non-phone query.
            A complete email (exactly one @, non-empty sides, no whitespace)
            matches the owner email exactly, case-insensitively, or an
            identical effective remark name; the raw email is reachable only
            through a complete address.
            Any other query is a discovery filter:
            - the effective remark name (the name when set, otherwise "账号"
              followed by the last four phone digits) matches as a
              case-insensitive literal substring, so "账号" finds every
              unnamed account;
            - a masked owner email matches only when it keeps exactly the one
              visible leading character and the visible domain, e.g.
              a***@example.com; longer prefixes do not match;
            - in a phone-shaped query, a prefix of one to three digits or a
              trailing four-digit suffix matches; a 5..10 digit fragment never
              matches a phone.
            % and _ are literal characters. At most 254 characters.
            Login and password-reset rate limiting is a deployment precondition
            before public exposure (P7).
          schema: { type: string }
        - name: include_deleted
          in: query
          required: false
          description: |
            When true, soft-deleted accounts are also returned. Defaults to
            false: soft-deleted rows never appear without the flag.
          schema: { type: boolean }
        - name: If-None-Match
          in: header
          required: false
          description: |
            ETag(s) the client already holds; a match answers 304.
            Weak comparison, comma lists and `*` are honoured.
          schema: { type: string }
      responses:
        '200':
          description: Account page.
          headers:
            ETag:
              description: Strong validator of the response body (quoted sha256).
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountPage'
        '304':
          description: Not modified (ETag matched); no body.
          headers:
            ETag:
              description: Strong validator of the response body (quoted sha256).
              schema: { type: string }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        default: { $ref: '#/components/responses/DefaultError' }
    post:
      tags: [accounts]
      operationId: AccountCreate
      summary: Register a platform account.
      description: |
        owner_user_id defaults to the caller. Only master and admin may set it
        to another user, and the referenced user must exist and not be
        soft-deleted: an unknown or deleted owner answers 404. The account
        starts in status pending. The optional name is a remark label; it is
        trimmed and limited to 50 characters. The global active-account limit
        and the per-owner quota both answer 429 capacity_exceeded; the limiter
        429 carries Retry-After and the quota 429 does not. Changes are rate
        limited per caller.
      x-roles: [master, admin, user]
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountCreate'
      responses:
        '201':
          description: Account created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '409': { $ref: '#/components/responses/ConflictError' }
        '413': { $ref: '#/components/responses/PayloadTooLargeError' }
        '429': { $ref: '#/components/responses/TooManyRequestsError' }
        default: { $ref: '#/components/responses/DefaultError' }
  /api/accounts/summary:
    get:
      tags: [accounts]
      operationId: AccountSummary
      summary: Count the live accounts awaiting a review decision.
      description: |
        Master and admin only. pending counts the live accounts whose
        status is pending; rejected counts the live accounts whose status
        is rejected. Soft-deleted rows never enter either number, so the
        summary always answers from the same population the list serves
        without include_deleted. This is a static path segment next to
        /api/accounts/{id}; the other methods on /api/accounts/summary are
        matched by the {id} route and answer for the literal id "summary"
        like any other unknown account id.
      x-roles: [master, admin]
      responses:
        '200':
          description: Review workload counts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSummary'
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        default: { $ref: '#/components/responses/DefaultError' }
  /api/accounts/{id}:
    get:
      tags: [accounts]
      operationId: AccountGet
      summary: Read one account.
      description: Cross-scope reads return 404.
      x-roles: [master, admin, user]
      parameters:
        - $ref: '#/components/parameters/AccountID'
      responses:
        '200':
          description: Account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        default: { $ref: '#/components/responses/DefaultError' }
    patch:
      tags: [accounts]
      operationId: AccountUpdate
      summary: Update account fields.
      description: |
        Status changes come from the review flow and from credential recovery.
        Editing the credentials of a rejected account (phone, password, device
        code or model) returns it to pending. A name-only edit is not a
        resubmission: the remark is not review material, so a rejected account
        stays rejected. Changing the phone returns a non-pending account to
        pending: a review decision binds to the old phone. Both resubmission
        paths clear reject_reason and the review stamp. A password or device
        edit recovers a credential_error account to active; a phone change wins
        over that recovery. Other edits keep the status.
        Review and pause have dedicated endpoints.
        Changing school is forbidden in P1 (decision 12.3) and returns
        conflict. Changes are rate limited per caller; a 429 carries
        Retry-After.
        A request that carries phone, password or device_code must also
        carry current_password, the acting user's own login password (a
        name, phone_model or school_id edit does not): a missing value
        answers 400, a wrong value 403, and repeated failures answer 429.
        A rejected reauthentication writes nothing.
      x-roles: [master, admin, user]
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/AccountID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountUpdate'
      responses:
        '200':
          description: Account updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '409': { $ref: '#/components/responses/ConflictError' }
        '413': { $ref: '#/components/responses/PayloadTooLargeError' }
        '429': { $ref: '#/components/responses/TooManyRequestsError' }
        default: { $ref: '#/components/responses/DefaultError' }
    delete:
      tags: [accounts]
      operationId: AccountDelete
      summary: Soft-delete an account.
      description: |
        Sets deleted_at and deleted_by. Cascades hide credentials.
        Every request must carry current_password, the acting user's own
        login password: a missing value answers 400, a wrong value 403,
        and repeated failures answer 429. A rejected reauthentication
        writes nothing.
      x-roles: [master, admin, user]
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/AccountID'
      requestBody:
        required: false
        description: |
          The envelope is optional in the schema for wire compatibility;
          the server still requires current_password and answers 400 when
          it is missing.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountDeleteRequest'
      responses:
        '204': { description: Account deleted. }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '413': { $ref: '#/components/responses/PayloadTooLargeError' }
        '429': { $ref: '#/components/responses/TooManyRequestsError' }
        default: { $ref: '#/components/responses/DefaultError' }
  /api/accounts/{id}/review:
    post:
      tags: [accounts]
      operationId: AccountReview
      summary: Approve or reject a pending account.
      description: A rejection must carry a reason.
      x-roles: [master, admin]
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/AccountID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountReviewRequest'
      responses:
        '200':
          description: Account with the new status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '409': { $ref: '#/components/responses/ConflictError' }
        '413': { $ref: '#/components/responses/PayloadTooLargeError' }
        default: { $ref: '#/components/responses/DefaultError' }
  /api/accounts/{id}/pause:
    post:
      tags: [accounts]
      operationId: AccountPause
      summary: Pause or resume an account.
      description: |
        An admin or master pause sets paused_admin; the owner pause sets
        paused_user. Sending paused false resumes only the matching shape:
        admin and master resume paused_admin; the owner resumes paused_user.
        Any other shape returns conflict.
      x-roles: [master, admin, user]
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/AccountID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountPauseRequest'
      responses:
        '200':
          description: Account with the new status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '409': { $ref: '#/components/responses/ConflictError' }
        '413': { $ref: '#/components/responses/PayloadTooLargeError' }
        default: { $ref: '#/components/responses/DefaultError' }
  /api/accounts/{id}/device-refresh:
    post:
      tags: [accounts]
      operationId: AccountDeviceRefresh
      summary: Re-read the device fields registered on the platform.
      description: |
        The server reads the stored credentials, asks the
        platform for its registered device state and, on success, writes the
        non-empty fields back into the credential ciphertext inside one
        transaction; platform-side empty fields never overwrite hand-filled
        values. A platform failure answers 502 and writes nothing: the
        credential version and the audit trail are unchanged. The full device
        code never leaves the server; the response carries only the masked
        form, the phone model and the authorized flag. Like every write here,
        403 comes from the CSRF middleware when the token is missing or
        wrong, not from a role check.
        Every request must carry current_password, the acting user's own
        login password (the device identity is a credential): a missing
        value answers 400, a wrong value 403, and repeated failures answer
        429. A rejected reauthentication writes nothing.
      x-roles: [master, admin, user]
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/AccountID'
      requestBody:
        required: false
        description: |
          The envelope is optional in the schema for wire compatibility;
          the server still requires current_password and answers 400 when
          it is missing.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountDeviceRefreshRequest'
      responses:
        '200':
          description: The refreshed device view.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDevice'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '413': { $ref: '#/components/responses/PayloadTooLargeError' }
        '429': { $ref: '#/components/responses/TooManyRequestsError' }
        '502': { $ref: '#/components/responses/DefaultError' }
        default: { $ref: '#/components/responses/DefaultError' }
  /api/accounts/{id}/restore:
    post:
      tags: [accounts]
      operationId: AccountRestore
      summary: Restore a soft-deleted account.
      description: |
        Only master and admin may restore. The account keeps its pre-delete
        status. A missing or out-of-scope account answers 404; a live (not
        deleted) account answers 409 conflict; the global or the per-owner
        active-account quota answers 429 capacity_exceeded.
      x-roles: [master, admin]
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/AccountID'
      responses:
        '200':
          description: The restored account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '409': { $ref: '#/components/responses/ConflictError' }
        '413': { $ref: '#/components/responses/PayloadTooLargeError' }
        '429': { $ref: '#/components/responses/TooManyRequestsError' }
        default: { $ref: '#/components/responses/DefaultError' }
  /api/accounts/{id}/verify:
    post:
      tags: [accounts]
      operationId: AccountVerify
      summary: Verify the stored credentials against the platform.
      description: |
        Reads the stored phone, password and device code, performs a login and
        reports the platform conclusion. The response never includes the
        credential. Platform conclusions return 200; a transport failure
        returns 502 upstream_unavailable.
        Rate limited per client IP and per account id; a 429 carries Retry-After.
      x-roles: [master, admin]
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/AccountID'
      responses:
        '200':
          description: Verification conclusion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountVerifyResult'
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '502': { $ref: '#/components/responses/DefaultError' }
        '429': { $ref: '#/components/responses/TooManyRequestsError' }
        default: { $ref: '#/components/responses/DefaultError' }
  /api/accounts/{id}/sign:
    post:
      tags: [accounts]
      operationId: AccountSign
      summary: Queue a manual sign for today.
      description: |
        Ensures today's task row exists and returns 202 with its id.
        The target task is resolved from today's task rows of enabled tasks:
        exactly one such row selects it; no row today falls back to the
        school's single enabled task. More than one candidate (two rows today,
        or no row and two enabled tasks) returns 409 task_ambiguous. This
        version has no task selector parameter: a school with two enabled
        tasks can only sign manually after one of them is disabled.
        A closed window returns 409 window_closed. A run in progress returns
        409 sign_running. A concluded success returns 409 already_signed.
        A failed or skipped row is re-armed and returns 202 again.
        An account that is not active (pending, rejected, paused_admin,
        paused_user, credential_error) returns 409 conflict and queues
        nothing.
        Cross-scope accounts return 404 for every role.
        Rate limited per client IP and per account id; a 429 carries Retry-After.
      x-roles: [master, admin, user]
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/AccountID'
      responses:
        '202':
          description: Task accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSignAccepted'
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '409': { $ref: '#/components/responses/DefaultError' }
        '429': { $ref: '#/components/responses/TooManyRequestsError' }
        default: { $ref: '#/components/responses/DefaultError' }
  /api/accounts/{id}/location:
    get:
      tags: [accounts]
      operationId: AccountLocationGet
      summary: Read the account location policy.
      description: |
        Returns the stored policy. The visible scope is the same source as
        PUT /api/accounts/{id}/location: a user reads own accounts and an
        admin reads accounts of bound schools; a cross-user, cross-school or
        soft-deleted account answers 404. An account without a stored policy
        reads as mode auto with null lng/lat and an empty reason. master is
        not in x-roles and answers 403.
      x-roles: [user, admin]
      parameters:
        - $ref: '#/components/parameters/AccountID'
      responses:
        '200':
          description: Location policy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountLocation'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        default: { $ref: '#/components/responses/DefaultError' }
    put:
      tags: [accounts]
      operationId: AccountLocationSet
      summary: Set the account location policy.
      description: |
        mode auto clears the stored point; mode fixed requires lng and lat
        inside the WGS84 range. A user may only change own accounts and an
        admin only accounts of bound schools; cross-scope writes return 404.
        The reason is kept by the host for audit and review. Delivering it
        to the platform lands with the upload protocol slice; until then the
        sign request carries it but the provider does not include it. It
        applies when the fixed point falls
        outside the target fence, so an out-of-range sign can be explained.
      x-roles: [user, admin]
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/AccountID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountLocationUpdate'
      responses:
        '200':
          description: Location policy stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountLocation'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '413': { $ref: '#/components/responses/PayloadTooLargeError' }
        default: { $ref: '#/components/responses/DefaultError' }
  /api/accounts/{id}/photos:
    get:
      tags: [photos]
      operationId: AccountPhotoList
      summary: List the photos of one account's owner.
      description: |
        The photo library belongs to the account owner, so this page equals
        GET /api/me/photos for that owner. The account visibility check
        matches PUT /api/accounts/{id}/location: a user sees own accounts
        and an admin sees accounts of bound schools. A cross-scope account
        and a missing account both answer 404.
      x-roles: [user, admin]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/AccountID'
      responses:
        '200':
          description: Photo page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoPage'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        default: { $ref: '#/components/responses/DefaultError' }
  /api/admin/events:
    get:
      tags: [events]
      operationId: AdminEvents
      summary: Subscribe to the admin event stream (SSE).
      description: |
        text/event-stream. Events carry id, event and data lines. master
        receives every school; admin receives bound schools only (filtering
        happens at the broker, not the client). Send Last-Event-ID to resume:
        events buffered in-process are replayed in order; a gap larger than
        the buffer answers resync followed by a snapshot. A 15s heartbeat
        keeps the stream alive; 60s without an event closes the stream with
        an end event. Cache-Control: no-store; X-Accel-Buffering: no.
      x-roles: [master, admin]
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          description: Last event id seen by the client, for resumption.
          schema: { type: string }
      responses:
        '200':
          description: Event stream opened.
          content:
            text/event-stream:
              schema: { type: string }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        default: { $ref: '#/components/responses/DefaultError' }
  /api/admin/tasks:
    get:
      tags: [schedule]
      operationId: AdminTaskList
      summary: Search sign tasks for one business day.
      description: |
        master sees every school; admin sees bound schools only. An admin
        with no binding sees an empty page, never another scope's rows.
        day defaults to the current business day in the server timezone.
        state filters by the persisted task state; school_id narrows to one
        school (an out-of-scope school id yields an empty page and does not
        leak existence); q matches a substring of the school or task name,
        or a full 11-digit phone number exactly, with the LIKE wildcards %
        and _ taken literal; shorter phone prefixes never match. Rows are
        ordered by run_at descending with the row id as tiebreaker; cursor
        is an opaque keyset token over that order.
        account_phone_masked keeps the first 3 and last 4 digits; the full
        number never leaves the server.
      x-roles: [master, admin]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: day
          in: query
          required: false
          description: Business day YYYY-MM-DD. Defaults to today.
          schema: { type: string, format: date }
        - name: state
          in: query
          required: false
          description: Filter by persisted task state.
          schema: { type: string, enum: [pending, running, success, failed, skipped] }
        - name: school_id
          in: query
          required: false
          description: Narrow to one school.
          schema: { type: string, format: uuid }
        - name: q
          in: query
          required: false
          description: |
            Substring of the school or task name, with the LIKE wildcards %
            and _ taken literal. A full 11-digit phone number (leading 1,
            second digit 3-9) matches the account phone exactly instead.
            Shorter prefixes never match: a partial number must not rebuild
            a masked phone row by row.
          schema: { type: string }
      responses:
        '200':
          description: Task page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskPage'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        default: { $ref: '#/components/responses/DefaultError' }
  /api/admin/tasks/export:
    get:
      tags: [schedule]
      operationId: AdminTaskExport
      summary: Download the task search as CSV.
      description: |
        The same scope and filters as GET /api/admin/tasks without cursor
        and limit. The response is text/csv with one header row whose
        columns match the task list fields, quoted per RFC 4180. The
        school name, task name and result cells are formula-escaped: a
        leading = + - @ TAB or CR gets a single-quote prefix so
        spreadsheet applications do not evaluate the cell (CWE-1236).
        Content-Disposition names the file after the effective business
        day, so a request without day reads tasks-<today>.csv. The export
        is capped at 10000 rows in key order; when the cap cuts rows the
        response carries X-Export-Truncated: true.
      x-roles: [master, admin]
      parameters:
        - name: day
          in: query
          required: false
          description: Business day YYYY-MM-DD. Defaults to today.
          schema: { type: string, format: date }
        - name: state
          in: query
          required: false
          description: Filter by persisted task state.
          schema: { type: string, enum: [pending, running, success, failed, skipped] }
        - name: school_id
          in: query
          required: false
          description: Narrow to one school.
          schema: { type: string, format: uuid }
        - name: q
          in: query
          required: false
          description: |
            Substring of the school or task name, with the LIKE wildcards %
            and _ taken literal. A full 11-digit phone number (leading 1,
            second digit 3-9) matches the account phone exactly instead.
            Shorter prefixes never match: a partial number must not rebuild
            a masked phone row by row.
          schema: { type: string }
      responses:
        '200':
          description: CSV download.
          content:
            text/csv:
              schema: { type: string }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        default: { $ref: '#/components/responses/DefaultError' }
  /api/admin/engine:
    get:
      tags: [schedule]
      operationId: AdminEngine
      summary: One-process execution monitor snapshot.
      description: |
        A point-in-time view of the execution worker for admins. master sees
        every school; admin sees bound schools only — the per-school rows
        (inflight, retrying) and the due/today counters are narrowed by the
        same binding rule, while the in-process timestamps are global (they
        describe the process, not a school). An admin with no binding sees an
        empty snapshot, never another scope's rows.
        inflight rows are running tasks with a claim time and a lease
        deadline; lease_expires_at is an absolute time and the client renders
        the remaining lease itself. retrying rows are pending tasks with at
        least one business attempt (waiting requeues never count an attempt),
        ordered by the next run time ascending and capped at the 200 soonest
        rows; retrying_truncated reports that the cap cut rows, so the list
        is never read as complete. account_phone_masked keeps the first 3
        and last 4 digits; the full number never leaves the server.
        last_claim_at, last_tick_at and worker_started_at are
        in-process times: they are null before the loop starts and reset on
        restart, so they are never read back from the database.
      x-roles: [master, admin]
      responses:
        '200':
          description: Execution monitor snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EngineSnapshot'
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        default: { $ref: '#/components/responses/DefaultError' }
  /api/admin/notify:
    get:
      tags: [settings]
      operationId: AdminNotifyGet
      summary: Read the caller's effective notification subscriptions.
      description: |
        master and admin each manage their own subscriptions; the answer
        covers every category and channel with the effective state. A user
        has no subscription surface and answers 403. A pair with no stored
        row reads as the default:
        review_pending is in_app and email; credential_invalid is in_app;
        sign_failed_daily is email; capacity_rejected is in_app.
        These effective subscriptions decide delivery: enabled in_app pairs
        land in the inbox, enabled email pairs are queued for mail delivery.
        notification_prefs.sign_failed_daily is the administrator
        subscription channel for the daily digest. It does not gate a user's
        own sign-failure mail, which the user's mail_notify switch controls.
      x-roles: [master, admin]
      responses:
        '200':
          description: Effective subscriptions for all categories and channels.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotifyPrefPage'
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        default: { $ref: '#/components/responses/DefaultError' }
    put:
      tags: [settings]
      operationId: AdminNotifySet
      summary: Replace the caller's subscription overrides.
      description: |
        Idempotent replacement of the caller's override set. Every item must
        name a known category and channel; an unknown value or a repeated
        (category, channel) pair answers 400. Pairs absent from the request
        keep no override and read as their defaults, so an empty list resets
        every subscription to the default state. The answer is the effective
        state after the write. No notification is delivered.
      x-roles: [master, admin]
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotifyPrefsUpdate'
      responses:
        '200':
          description: Effective subscriptions after the replacement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotifyPrefPage'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '413': { $ref: '#/components/responses/PayloadTooLargeError' }
        default: { $ref: '#/components/responses/DefaultError' }
  /api/admin/settings:
    get:
      tags: [settings]
      operationId: AdminSettings
      summary: Read the deployment configuration roster, grouped.
      description: |
        Read-only. The keys come from config/registry.json, grouped by the
        group registered there. A non-sensitive key carries the resolved
        value (the environment value when set, otherwise the registered
        default; a key with neither reads null). A sensitive key never
        carries a value: it answers a sensitive view with set, a fixed
        masked form and the source. The source is env when the environment
        provides the key, default when the roster registers a default, and
        unknown when the key is unset with no default. The file source is
        reserved for a configuration layer that reads files; the current
        server never reports it.
      x-roles: [master, admin]
      responses:
        '200':
          description: Grouped configuration roster.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsReport'
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        default: { $ref: '#/components/responses/DefaultError' }
  /api/admin/mail/test:
    post:
      tags: [settings]
      operationId: AdminMailTest
      summary: Send a test email to the signed-in master.
      description: |
        Master only. Sends one plain-text message through the configured
        SMTP delivery path to the signed-in account's own email address.
        The request body is empty and ignored, so the client can never pick
        the recipient. Delivery is synchronous: a 200 means the SMTP server
        accepted the message (DATA was acknowledged), not that the mailbox
        received it. Mail delivery disabled (SMTP is off) answers 409 with a
        distinct message; a master whose account has no email address also
        answers 409. A delivery failure answers 502 with no SMTP reply,
        relay host, address or credential detail. At most one test-mail
        attempt per master per 60 seconds; a request inside that window
        answers 429 with Retry-After. The cooldown is process-local and
        resets when the server restarts.
        Every send attempt, success or failure, appends one
        settings.mail_test audit row whose detail holds only the result and
        the coarse delivery class; it never holds the SMTP reply, address,
        relay host or credential.
      x-roles: [master]
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '200':
          description: The SMTP server accepted the test message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailTestResult'
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '409': { $ref: '#/components/responses/ConflictError' }
        '429': { $ref: '#/components/responses/TooManyRequestsError' }
        '502': { $ref: '#/components/responses/DefaultError' }
        default: { $ref: '#/components/responses/DefaultError' }
  /api/admin/announcement:
    put:
      tags: [settings]
      operationId: AnnouncementSet
      summary: Publish or clear the site announcement.
      description: |
        Master only. The text is trimmed, must stay on one line (a line
        break or line separator answers 400) and is limited to 200
        characters, matching the previous deployment. An empty text clears
        the announcement. The write and one settings.announcement audit row
        commit in one transaction; the detail records only the field name,
        never the text.
      x-roles: [master]
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnnouncementUpdate'
      responses:
        '200':
          description: Announcement after the write.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Announcement'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '413': { $ref: '#/components/responses/PayloadTooLargeError' }
        default: { $ref: '#/components/responses/DefaultError' }
  /api/announcement:
    get:
      tags: [settings]
      operationId: AnnouncementGet
      summary: Read the published site announcement.
      description: |
        Every signed-in role reads the same text. An announcement that was
        never set, or was cleared, answers an empty text and a null
        updated_at. The raw author id never leaves the server.
      x-roles: [master, admin, user]
      responses:
        '200':
          description: Current announcement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Announcement'
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        default: { $ref: '#/components/responses/DefaultError' }
  /api/audit-logs:
    get:
      tags: [audit]
      operationId: AuditLogList
      summary: Read audit rows with cursor pagination.
      description: |
        Master and admin only. Rows are ordered newest first and paged with
        the opaque cursor; limit is 1..200 with a default of 50. action
        filters by the exact action word, actor filters by the masked actor
        label (the value is masked with the same rule the writer used, so a
        full email matches its stored masked form), from and to bound the
        row time inclusively; both take an RFC3339 timestamp. Each row
        carries the row id, the time, the action, the masked actor label and
        the detail JSON text, which is passed through the mask rules on the
        way out. The chain is not verified here and there is no export.
        Legacy parity: the previous console showed every school's rows to
        both master and admin; this endpoint deliberately keeps that global
        view and does not narrow by the caller's school scope.
      x-roles: [master, admin]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: action
          in: query
          required: false
          description: Exact action word, e.g. auth.login.
          schema: { type: string, maxLength: 128 }
        - name: actor
          in: query
          required: false
          description: |
            Actor filter. Masked with the writer's rule before matching, so
            a full address matches its stored masked label.
          schema: { type: string, maxLength: 254 }
        - name: from
          in: query
          required: false
          description: Inclusive lower bound on the row time (RFC3339).
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: false
          description: Inclusive upper bound on the row time (RFC3339).
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Audit page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogPage'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        default: { $ref: '#/components/responses/DefaultError' }
  /api/me/diagnostics:
    get:
      tags: [events]
      operationId: MeDiagnostics
      summary: Diagnostics for the signed-in user's own accounts.
      description: |
        One item per account owned by the caller, with today's task state,
        run time, attempts, result word, next retry time and a closed
        vocabulary suggestion (wait, retry_now, re_arm, contact_admin).
        Every authenticated principal reads the same way: the result covers
        own accounts only, and the role does not widen the set. No credential
        detail and no raw platform text.
      x-roles: [master, admin, user]
      responses:
        '200':
          description: Today's diagnostics per own account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnosticsReport'
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        default: { $ref: '#/components/responses/DefaultError' }
  /api/accounts/{id}/diagnostics:
    get:
      tags: [events]
      operationId: AccountDiagnostics
      summary: Detailed diagnostics for one account.
      description: |
        Single-account version of /api/me/diagnostics plus the planned
        window and the bound egress label when present. Cross-user and
        cross-school reads return 404. master reads any account; the run
        page opens this drawer from every task row (UX-3).
      x-roles: [user, admin, master]
      parameters:
        - $ref: '#/components/parameters/AccountID'
      responses:
        '200':
          description: Detailed diagnostics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDiagnostics'
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        default: { $ref: '#/components/responses/DefaultError' }
  /api/me/sign-status:
    get:
      tags: [events]
      operationId: MeSignStatus
      summary: Polling status for the signed-in user's own accounts.
      description: |
        Lightweight per-account state for 30-60s polling. stale is true when
        the row has not been updated for more than 90 seconds. Any
        authenticated principal may poll; the result covers own accounts only.
      x-roles: [master, admin, user]
      responses:
        '200':
          description: Sign status items.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignStatusReport'
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        default: { $ref: '#/components/responses/DefaultError' }
  /api/me/sign-calendar:
    get:
      tags: [events]
      operationId: SignCalendarGet
      summary: Daily sign outcome counts for the caller's own accounts.
      description: |
        One row per business day in the inclusive range from..to, including
        days without task rows. Counts are per account: an account with
        several task rows on one day contributes once, using its most
        recently updated row. Retries, attempts and event history are never
        counted. Accounts owned by another user and soft-deleted accounts
        are excluded. from and to are required, from <= to, and the range is
        at most 31 days. today and timezone come from the server so a client
        clock cannot move the day boundary. Accounts without a task row on a
        day are not counted.
      x-roles: [user]
      parameters:
        - name: from
          in: query
          required: true
          description: First business day, YYYY-MM-DD.
          schema: { type: string }
        - name: to
          in: query
          required: true
          description: Last business day, YYYY-MM-DD; at most 31 days after from.
          schema: { type: string }
      responses:
        '200':
          description: Daily counts for the range.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignCalendar'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        default: { $ref: '#/components/responses/DefaultError' }
  /api/me/sign-calendar/{day}:
    get:
      tags: [events]
      operationId: SignCalendarDayGet
      summary: Per-account sign outcome for one business day.
      description: |
        One item per account that has at least one task row on the day. The
        state is that account's most recently updated row, normalised to
        success, failed, skipped or unknown (pending and running are
        unknown). Accounts owned by another user and soft-deleted accounts
        are excluded. A future day returns future=true and an empty accounts
        list, matching the range endpoint's zeroed future days. v1 carries
        no reason or suggestion: sign_tasks stores only result, and the
        upstream text is never mapped into these fields.
      x-roles: [user]
      parameters:
        - name: day
          in: path
          required: true
          description: Business day, YYYY-MM-DD.
          schema: { type: string }
      responses:
        '200':
          description: Per-account outcomes for the day.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignCalendarDayDetail'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        default: { $ref: '#/components/responses/DefaultError' }
  /api/schedule/windows:
    get:
      tags: [schedule]
      operationId: ScheduleWindows
      summary: List task windows for a business day.
      description: |
        master sees every school; admin sees bound schools only.
        A day without a cached window is discovered once and then cached, so
        the default request costs at most one platform call per task. When the
        cache already holds the day, the default request makes no platform
        call. Set refresh=true to discover again.
        A task whose platform reports no window keeps null start and end.
      x-roles: [master, admin]
      parameters:
        - name: day
          in: query
          required: false
          description: Business day YYYY-MM-DD; defaults to today in the server time zone.
          schema: { type: string }
        - name: refresh
          in: query
          required: false
          description: |
            Discover the platform window again and store the result. Default
            false reads the daily cache first. A valid override keeps the
            cached window unchanged (discovery still runs).
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Task window list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleWindowList'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        default: { $ref: '#/components/responses/DefaultError' }
  /api/schedule/preview:
    get:
      tags: [schedule]
      operationId: SchedulePreview
      summary: Preview the plan for one school task and day.
      description: |
        Reads the window from the platform, then the cache, then the fallback,
        and returns the exact rows Build would persist. Preview writes nothing.
        A disabled task can be previewed: enabled is false and the window is
        still reported. Build and override reject a disabled task.
      x-roles: [master, admin]
      parameters:
        - name: day
          in: query
          required: true
          description: Business day YYYY-MM-DD.
          schema: { type: string }
        - $ref: '#/components/parameters/SchoolIDQuery'
        - $ref: '#/components/parameters/TaskIDQuery'
      responses:
        '200':
          description: Plan preview.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulePlan'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        default: { $ref: '#/components/responses/DefaultError' }
  /api/schedule/plan:
    post:
      tags: [schedule]
      operationId: SchedulePlan
      summary: Build and persist the plan for one school task and day.
      description: |
        Writes the resolved window, rearranges pending rows when the window
        changed, and inserts missing rows in one transaction. Running and
        terminal rows are never moved. A disabled task returns 409 conflict
        and writes nothing. Only the current business day is accepted; any
        other day is 400 validation_failed.

        Capacity shortfall returns 409 capacity_shortfall and writes nothing:
        the demand exceeds what the window can carry at the configured
        concurrency, average duration and egress rate. `details` carries
        demand, capacity, shortfall, binding, and suggested_workers when
        raising the channel count within the 64-channel cap fits the demand.
        Preview still reports the numbers.
      x-roles: [master, admin]
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchedulePlanRequest'
      responses:
        '200':
          description: Persisted plan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulePlan'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '409': { $ref: '#/components/responses/ConflictError' }
        '413': { $ref: '#/components/responses/PayloadTooLargeError' }
        default: { $ref: '#/components/responses/DefaultError' }
  /api/schedule/override:
    post:
      tags: [schedule]
      operationId: ScheduleOverride
      summary: Replace the window of one school task for one day.
      description: |
        An override wins over the platform window for the same day and keeps
        its recorded reason. Pending rows are rearranged immediately; running
        and terminal rows are never moved. A disabled task returns 409 conflict
        and stores no override.
      x-roles: [master, admin]
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleOverrideRequest'
      responses:
        '200':
          description: Plan rebuilt against the override.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulePlan'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '409': { $ref: '#/components/responses/ConflictError' }
        '413': { $ref: '#/components/responses/PayloadTooLargeError' }
        default: { $ref: '#/components/responses/DefaultError' }
  /api/me/time-pref:
    get:
      tags: [schedule]
      operationId: TimePrefGet
      summary: Read the signed-in user's preferred signing offset.
      description: |
        offset_min is the relative minute from the effective window start.
        It must be a multiple of five. allowed reports whether the deployment
        enables user time preferences; a stored value stays readable when the
        feature is disabled.
      x-roles: [master, admin, user]
      responses:
        '200':
          description: Time preference.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimePref'
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        default: { $ref: '#/components/responses/DefaultError' }
    put:
      tags: [schedule]
      operationId: TimePrefSet
      summary: Set or clear the signed-in user's preferred offset.
      description: |
        offset_min null clears the preference. A change within the cooldown
        window returns 429 rate_limited. The deployment gate
        YIBAN_ALLOW_TIME_PREF must be on, otherwise the call returns 403.
      x-roles: [master, admin, user]
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimePrefUpdate'
      responses:
        '200':
          description: Stored preference.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimePref'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '413': { $ref: '#/components/responses/PayloadTooLargeError' }
        '429': { $ref: '#/components/responses/DefaultError' }
        default: { $ref: '#/components/responses/DefaultError' }
  /api/me/accounts/{id}/delete:
    post:
      tags: [accounts]
      operationId: MyAccountDelete
      summary: Soft-delete one of the caller's own signing accounts.
      description: |
        Self-service counterpart of DELETE /api/accounts/{id}. Any signed-in
        role may delete an account it owns; ownership comes from the session
        user id, never from a request field. The row is soft-deleted
        (deleted_at set, deleted_by is the caller) and the audit action is
        account.self_delete; its detail never carries the phone or email.
        Another user's account answers 404, never 403, so foreign accounts
        are not disclosed. Deleting an already deleted account answers 400.
        The grace window is 7 days (core/account.SelfRestoreGrace), shared
        with POST /api/me/accounts/{id}/restore; once it has passed the
        retention job may purge the row and no self-service undo exists.
        Every request must carry current_password, the acting user's own
        login password: a missing value answers 400, a wrong value 403,
        and repeated failures answer 429. A rejected reauthentication
        writes nothing.
      x-roles: [master, admin, user]
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/AccountID'
      requestBody:
        required: false
        description: |
          The envelope is optional in the schema for wire compatibility;
          the server still requires current_password and answers 400 when
          it is missing.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MyAccountDeleteRequest'
      responses:
        '204': { description: Account soft-deleted. }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '413': { $ref: '#/components/responses/PayloadTooLargeError' }
        '429': { $ref: '#/components/responses/TooManyRequestsError' }
        default: { $ref: '#/components/responses/DefaultError' }
  /api/me/accounts/{id}/restore:
    post:
      tags: [accounts]
      operationId: MyAccountRestore
      summary: Undo the caller's own soft delete.
      description: |
        Only a self-deleted account can be restored: the row must carry
        deleted_by equal to the session user. An account an administrator
        deleted answers 403, so a removed account cannot be revived by its
        owner. The undo is accepted only within 7 days of deleted_at
        (core/account.SelfRestoreGrace); past the window it answers 409
        conflict. The owner must have no other live account: an existing
        live account answers 400. A missing or foreign account answers 404;
        a live (not deleted) account answers 409. Capacity is enforced like
        the administrator restore and answers 429 capacity_exceeded.
        The audit action is account.self_restore.
      x-roles: [master, admin, user]
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/AccountID'
      responses:
        '200':
          description: The restored account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '409': { $ref: '#/components/responses/ConflictError' }
        '413': { $ref: '#/components/responses/PayloadTooLargeError' }
        '429': { $ref: '#/components/responses/DefaultError' }
        default: { $ref: '#/components/responses/DefaultError' }
  /api/me/mail-notify:
    get:
      tags: [settings]
      operationId: MailNotifyGet
      summary: Read the caller's sign-failure mail switch.
      description: |
        Every signed-in role reads its own switch. A user who never changed
        the value reads true. The switch only gates sign-failure mail;
        authentication and credential mail bypass it. Sign-failure mail is
        delivered while the switch is true; a delivery already queued when
        the switch is turned off may still arrive.
        The switch is the user's own sign-failure mail master switch, not the
        administrator digest subscription. Delivery requires
        mail_notify=true for user mail; the administrator digest reads only
        notification_prefs (see GET /api/admin/notify).
      x-roles: [master, admin, user]
      responses:
        '200':
          description: Current switch state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailNotify'
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        default: { $ref: '#/components/responses/DefaultError' }
    put:
      tags: [settings]
      operationId: MailNotifySet
      summary: Set the caller's sign-failure mail switch.
      description: |
        enabled is required and must be a JSON boolean; a missing key answers
        400. The write and one user.mail_notify audit row share a
        transaction; the detail carries only the field and on/off, never the
        email. No mail is sent by this endpoint.
        This switch is the user's own sign-failure mail master switch, not
        the administrator digest subscription. When 0v8 delivers mail, user
        sign-failure mail requires the user's mail_notify=true and a delivery
        trigger; the administrator digest reads only notification_prefs.
        The two switches are never OR-ed and never substitute for each other.
      x-roles: [master, admin, user]
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MailNotifyUpdate'
      responses:
        '200':
          description: Stored switch state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailNotify'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '413': { $ref: '#/components/responses/PayloadTooLargeError' }
        default: { $ref: '#/components/responses/DefaultError' }
  /api/me/notifications:
    get:
      tags: [settings]
      operationId: NotificationList
      summary: Read the caller's in-app notifications.
      description: |
        master and admin read only their own rows; a user has no in-app
        notification surface and answers 403. Rows are ordered by
        (created_at DESC, id DESC) and page with the opaque next_cursor.
        next_cursor is always present; an empty string marks the last page.
        limit defaults to 20 and must be between 1 and 100; an out-of-range
        limit or a malformed cursor answers 400. dedupe_key is internal and
        never appears in a response. school_id is null for a deployment-wide
        event; read_at is null while the row is unread.
      x-roles: [master, admin]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/NotificationLimit'
      responses:
        '200':
          description: One page of the caller's notifications.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPage'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        default: { $ref: '#/components/responses/DefaultError' }
  /api/me/notifications/unread-count:
    get:
      tags: [settings]
      operationId: NotificationUnreadCount
      summary: Count the caller's unread in-app notifications.
      description: |
        Counts only the signed-in user's rows with read_at null. A user has
        no in-app notification surface and answers 403.
      x-roles: [master, admin]
      responses:
        '200':
          description: Unread count for the signed-in user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnreadCount'
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        default: { $ref: '#/components/responses/DefaultError' }
  /api/me/notifications/read:
    post:
      tags: [settings]
      operationId: NotificationMarkRead
      summary: Mark the caller's notifications as read.
      description: |
        ids must name 1 to 100 UUIDs. Only the signed-in user's rows are
        updated; an id owned by another user or no longer present is ignored
        silently, so repeated calls are idempotent. Already-read rows keep
        their first read timestamp. The answer is 204.
      x-roles: [master, admin]
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationRead'
      responses:
        '204': { description: Read state updated; unknown ids were ignored. }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '413': { $ref: '#/components/responses/PayloadTooLargeError' }
        default: { $ref: '#/components/responses/DefaultError' }
  /api/me/notifications/read-all:
    post:
      tags: [settings]
      operationId: NotificationMarkAllRead
      summary: Mark every unread notification of the caller as read.
      description: |
        Only the signed-in user's unread rows are updated. A second call with
        nothing left unread still answers 204: the operation is idempotent.
      x-roles: [master, admin]
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204': { description: Every unread row of the caller is read. }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        default: { $ref: '#/components/responses/DefaultError' }
  /api/capacity:
    get:
      tags: [schedule]
      operationId: CapacityGet
      summary: Report capacity and demand for one school task.
      description: |
        Capacity uses the same window resolution and formula as the plan.
        A positive shortfall means demand exceeds capacity and the plan
        compresses rows into the tail slice.
        The binding names the side to raise when capacity is short: workers
        when raising concurrency is the side to raise — within the
        64-channel cap that means a count exists that fits the demand; beyond
        it the demand needs more than 64 channels and no allowed count fits.
        egress_rate means raising concurrency alone cannot fit the demand
        because the egress rate is the hard limit. A suggested_workers value
        appears only for the workers binding, only when capacity is short,
        only when it is above the configured concurrency, at most 64, and
        that count really fits the demand
        (ceil(demand × average seconds ÷ (window seconds × utilization))).
        When capacity is short and the workers binding carries no
        suggested_workers, the demand needs more than the 64-channel cap.
        When the current capacity already fits, binding reports the current
        bottleneck and suggested_workers is absent.
        Raising concurrency is a restart-level configuration change; the
        report never changes it.
        The window is read from the daily cache by default: a cached day makes
        no platform call, a missing day is discovered once and then cached.
        Set refresh=true to discover again. An override still wins over both.
      x-roles: [master, admin]
      parameters:
        - $ref: '#/components/parameters/SchoolIDQuery'
        - $ref: '#/components/parameters/TaskIDQuery'
        - name: day
          in: query
          required: false
          description: Business day YYYY-MM-DD; defaults to today in the server time zone.
          schema: { type: string }
        - name: refresh
          in: query
          required: false
          description: |
            Discover the platform window again and store the result. Default
            false reads the daily cache first. A valid override keeps the
            cached window unchanged (discovery still runs).
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Capacity report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapacityReport'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        default: { $ref: '#/components/responses/DefaultError' }
  /api/sign-stats:
    get:
      tags: [schedule]
      operationId: SignStats
      summary: Report per-account sign results for a day range.
      description: |
        Master and admin only. Each account lands in one state per day, so
        the daily buckets are mutually exclusive. When a school runs several
        tasks in one day, the task row updated last represents the account.
        by_status counts distinct accounts per state over the whole window;
        those buckets can overlap and must not be summed into total. The
        range ends today in the server time zone. A day with no task rows
        carries zero counts and appears in days_missing.
      x-roles: [master, admin]
      parameters:
        - name: days
          in: query
          required: false
          description: Window length in days, 1 to 90. Defaults to 30.
          schema: { type: integer, minimum: 1, maximum: 90, default: 30 }
      responses:
        '200':
          description: Sign statistics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignStatsReport'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        default: { $ref: '#/components/responses/DefaultError' }
  /api/time-prefs/stats:
    get:
      tags: [schedule]
      operationId: TimePrefStats
      summary: Report time-preference crowding for one school task.
      description: |
        Master and admin only. Each slot is a five-minute offset from the
        effective window start of the selected task and day. count is the
        number of users with an active account in that school who picked the
        offset; pending, rejected and paused accounts do not count. cap is
        the per-slice capacity the plan uses. Slots cover the effective
        window in whole five-minute slices and stop at two hours. A window
        shorter than five minutes still returns one slot, matching the
        plan's clamp.
      x-roles: [master, admin]
      parameters:
        - $ref: '#/components/parameters/SchoolIDQuery'
        - $ref: '#/components/parameters/TaskIDQuery'
        - name: day
          in: query
          required: false
          description: Business day YYYY-MM-DD; defaults to today in the server time zone.
          schema: { type: string }
      responses:
        '200':
          description: Time-preference crowding.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrefStatsReport'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        default: { $ref: '#/components/responses/DefaultError' }
  /api/me/photos:
    get:
      tags: [photos]
      operationId: PhotoList
      summary: List the signed-in user's photos.
      description: |
        Cursor-paginated metadata for the photos the caller can read. Image
        bytes come from GET /api/me/photos/{id}.
      x-roles: [master, admin, user]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Photo page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoPage'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        default: { $ref: '#/components/responses/DefaultError' }
    post:
      tags: [photos]
      operationId: PhotoUpload
      summary: Upload one image into the library.
      description: |
        multipart/form-data with a single `image` file part. The server
        decodes, rotates, strips metadata, re-encodes and stores the bytes.
        The raw upload limit is 10 MiB. Uploading the same bytes again
        returns the same photo id and restores a deleted photo.
      x-roles: [master, admin, user]
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PhotoUpload'
      responses:
        '201':
          description: Photo stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Photo'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '413': { $ref: '#/components/responses/PayloadTooLargeError' }
        default: { $ref: '#/components/responses/DefaultError' }
  /api/me/photos/{id}:
    get:
      tags: [photos]
      operationId: PhotoGet
      summary: Stream one photo.
      description: |
        Returns the stored bytes with their real media type and an ETag of
        the sha256. The scope check runs before any bytes are written.
        The owner reads own photos under any role. An admin also reads photos
        whose owner has a non-deleted account in a bound school. A master
        reads own photos only. Cross-scope reads answer 404.
        When If-None-Match (weak comparison, comma lists and `*` honoured)
        matches the current ETag the answer is 304 without a body. Repeated
        If-None-Match header lines are merged per RFC 9110 section 5.3, so a
        well-formed list never answers 400.
      x-roles: [master, admin, user]
      parameters:
        - $ref: '#/components/parameters/PhotoID'
        - name: If-None-Match
          in: header
          required: false
          description: ETag(s) the client already holds; a match answers 304.
          schema: { type: string }
      responses:
        '200':
          description: Image bytes.
          headers:
            ETag:
              description: Strong validator of the stored bytes (quoted sha256).
              schema: { type: string }
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
        '304':
          description: Not modified (ETag matched); no body.
          headers:
            ETag:
              description: Strong validator of the stored bytes (quoted sha256).
              schema: { type: string }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        default: { $ref: '#/components/responses/DefaultError' }
    delete:
      tags: [photos]
      operationId: PhotoDelete
      summary: Soft-delete one photo.
      description: Idempotent; the blob is kept for dedupe and collected later.
      x-roles: [master, admin, user]
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/PhotoID'
      responses:
        '204': { description: Photo deleted. }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        default: { $ref: '#/components/responses/DefaultError' }
  /api/me/photo-retention:
    get:
      tags: [photos]
      operationId: PhotoRetentionGet
      summary: Read the photo retention period.
      description: |
        Returns the caller's own retention. A user who never set one reads
        the default 90 days, so the settings page can show the effective
        value instead of assuming it.
      x-roles: [master, admin, user]
      responses:
        '200':
          description: Current retention.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoRetention'
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        default: { $ref: '#/components/responses/DefaultError' }
    put:
      tags: [photos]
      operationId: PhotoRetentionSet
      summary: Set the photo retention period.
      description: |
        days is one of 30, 90, 180 or 365. Missing retention means 90 days.
      x-roles: [master, admin, user]
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhotoRetentionUpdate'
      responses:
        '200':
          description: Stored retention.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoRetention'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '413': { $ref: '#/components/responses/PayloadTooLargeError' }
        default: { $ref: '#/components/responses/DefaultError' }
  /healthz:
    get:
      tags: [health]
      operationId: HealthCheck
      summary: Liveness probe.
      description: |
        Answers 200 while the process serves requests. It needs no session and
        no CSRF token, and it does not touch the database.
      security: []
      x-roles: [public]
      responses:
        '200':
          description: Process is serving requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        default: { $ref: '#/components/responses/DefaultError' }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-yiban_session
      description: |
        HttpOnly, Secure, SameSite=Lax session cookie set by POST /api/auth/login.
  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque page cursor taken from next_cursor.
      schema: { type: string }
    Limit:
      name: limit
      in: query
      required: false
      description: Page size, 1 to 200.
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    NotificationLimit:
      name: limit
      in: query
      required: false
      description: Page size, 1 to 100. Defaults to 20.
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: |
        CSRF token returned by GET /api/auth/me. Required on every
        state-changing request that carries a session.
      schema: { type: string }
    CSRFTokenOptional:
      name: X-CSRF-Token
      in: header
      required: false
      description: |
        Required only when the request carries a session. Used by logout,
        where a session-less request is a no-op.
      schema: { type: string }
    SchoolID:
      name: id
      in: path
      required: true
      schema: { type: string }
    UserID:
      name: uid
      in: path
      required: true
      schema: { type: string }
    AccountID:
      name: id
      in: path
      required: true
      schema: { type: string }
    SchoolIDQuery:
      name: school_id
      in: query
      required: true
      schema: { type: string }
    TaskIDQuery:
      name: task_id
      in: query
      required: true
      description: School task id from GET /api/schedule/windows.
      schema: { type: string }
    PhotoID:
      name: id
      in: path
      required: true
      schema: { type: string }
  responses:
    ValidationError:
      description: Request body or parameters are invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnauthorizedError:
      description: No session, invalid session, invalid one-time token or wrong current password.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ForbiddenError:
      description: Role, scope or CSRF check does not allow the action.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequestsError:
      description: Inbound rate limit exceeded; Retry-After says when to retry.
      headers:
        Retry-After:
          description: Seconds to wait before retrying; always at least 1.
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFoundError:
      description: Object missing or out of scope.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ConflictError:
      description: Object already exists or the state transition is invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PayloadTooLargeError:
      description: Request body exceeds the entry limit; the code stays validation_failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    DefaultError:
      description: Error envelope; the code field carries the stable code.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    NotifyCategory:
      type: string
      description: Closed set of notification subjects for this phase.
      enum: [credential_invalid, review_pending, sign_failed_daily, capacity_rejected]
    NotifyChannel:
      type: string
      description: Closed set of delivery channels; in_app and email are the only values.
      enum: [in_app, email]
    NotifyPref:
      type: object
      required: [category, channel, enabled]
      properties:
        category:
          $ref: '#/components/schemas/NotifyCategory'
        channel:
          $ref: '#/components/schemas/NotifyChannel'
        enabled:
          type: boolean
          description: |
            Effective state: the stored override when present, the category
            default otherwise.
    NotifyPrefPage:
      type: object
      required: [items]
      description: |
        All four categories across both channels, so the client renders the
        full matrix without merging defaults itself. Exactly eight items in
        a stable order.
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/NotifyPref'
    NotifyPrefsUpdate:
      type: object
      required: [items]
      description: |
        The complete replacement override set. Every pair must be known and
        unique; unlisted pairs drop their override and read as defaults.
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/NotifyPref'
    Notification:
      type: object
      description: |
        One in-app notification owned by the signed-in user. The internal
        dedupe key is never exposed.
      required: [id, category, title, body, school_id, created_at, read_at]
      properties:
        id: { type: string }
        category:
          $ref: '#/components/schemas/NotifyCategory'
        title: { type: string }
        body: { type: string }
        school_id:
          type: [string, "null"]
          description: |
            School scope of the event; null for a deployment-wide event.
        created_at: { type: string, format: date-time }
        read_at:
          type: [string, "null"]
          format: date-time
          description: First read timestamp; null while unread.
    NotificationPage:
      type: object
      required: [items, next_cursor]
      description: One page of the caller's notifications.
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
        next_cursor:
          type: string
          description: Opaque cursor for the next page; empty on the last page.
    UnreadCount:
      type: object
      required: [count]
      properties:
        count:
          type: integer
          minimum: 0
          description: Unread notifications owned by the signed-in user.
    NotificationRead:
      type: object
      required: [ids]
      description: |
        Notification ids to mark read. At least one and at most 100 unique
        UUIDs; ids owned by another user are ignored.
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: { type: string, format: uuid }
    SettingSource:
      type: string
      description: |
        env: the process environment provides the key. file: a file-backed
        configuration layer provides it (never reported by this server).
        default: unset, the roster registers a default. unknown: unset with
        no registered default.
      enum: [env, file, default, unknown]
    SettingItem:
      type: object
      description: One roster key with its resolved view.
      required: [key, group, source, value, sensitive]
      properties:
        key: { type: string }
        group:
          type: string
          description: First group registered for the key in the roster.
        source:
          $ref: '#/components/schemas/SettingSource'
        value:
          description: |
            Resolved value of a non-sensitive key: the environment value when
            set, otherwise the registered default rendered by the key type,
            otherwise null. Absent (null) for a sensitive key.
          anyOf:
            - { type: [string, "null"] }
            - { type: [number, "null"], format: double }
            - { type: [boolean, "null"] }
        sensitive:
          description: Masked view for a sensitive key; null for a non-sensitive key.
          type: [object, "null"]
          required: [set, masked, source]
          properties:
            set:
              type: boolean
              description: True when the environment provides the key.
            masked:
              type: string
              description: |
                Fixed form - "****" when set, empty string otherwise. It carries
                no character of the stored value.
            source:
              $ref: '#/components/schemas/SettingSource'
    SettingGroup:
      type: object
      required: [name, items]
      properties:
        name: { type: string }
        items:
          type: array
          items:
            $ref: '#/components/schemas/SettingItem'
    SettingsReport:
      type: object
      required: [groups]
      properties:
        groups:
          type: array
          items:
            $ref: '#/components/schemas/SettingGroup'
    MailTestResult:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: |
            User-safe confirmation. It never carries the SMTP reply, the
            recipient address, the relay host or any credential.
    Announcement:
      type: object
      required: [text, updated_at]
      properties:
        text:
          type: string
          description: Current announcement body; empty when none is set. Single line.
        updated_at:
          type: [string, "null"]
          format: date-time
          description: When the announcement was last written; null when never set.
    AnnouncementUpdate:
      type: object
      required: [text]
      properties:
        text:
          type: string
          maxLength: 200
          description: |
            Trimmed body, at most 200 characters, one line: a line break or
            line separator answers 400. An empty text clears the
            announcement.
    AuditLogItem:
      type: object
      required: [id, at, action, actor, detail]
      properties:
        id:
          type: integer
          format: int64
          description: Row id of the audit chain row.
        at: { type: string, format: date-time }
        action: { type: string }
        actor:
          type: string
          description: Masked actor label fixed at write time; never a raw address.
        detail:
          type: string
          description: Detail JSON text; passed through the mask rules on the way out.
    AuditLogPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditLogItem'
        next_cursor:
          type: string
          description: Cursor for the next page; empty on the last page.
    Error:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
    ErrorBody:
      type: object
      required: [code, message, details, trace_id]
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          description: User-safe message; no internal detail.
        details:
          type: object
          additionalProperties: true
          description: Machine-readable extras; an empty object when unused.
        trace_id:
          type: string
          description: Request trace id; mirrors the X-Request-Id header.
    ErrorCode:
      type: string
      description: Stable codes frozen in P0. New values are additive only.
      enum:
        - validation_failed
        - unauthorized
        - forbidden
        - not_found
        - conflict
        - rate_limited
        - capacity_exceeded
        - capacity_shortfall
        - window_closed
        - already_signed
        - sign_running
        - task_ambiguous
        - photo_missing
        - photo_invalid
        - photo_rejected
        - location_out_of_range
        - upstream_unavailable
        - internal_error
    UserRole:
      type: string
      enum: [master, admin, user]
    UserStatus:
      type: string
      enum: [active, disabled]
    SessionUser:
      type: object
      required: [id, email, role, status, must_change_password, csrf_token]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        role:
          $ref: '#/components/schemas/UserRole'
        status:
          $ref: '#/components/schemas/UserStatus'
        must_change_password: { type: boolean }
        csrf_token:
          type: string
          description: Token the client sends back in X-CSRF-Token.
    User:
      type: object
      required:
        - id
        - email
        - role
        - status
        - must_change_password
        - account_count
        - pending_count
        - review_count
        - created_at
        - last_login_at
        - deleted_at
      properties:
        id: { type: string }
        email: { type: string, format: email }
        role:
          $ref: '#/components/schemas/UserRole'
        status:
          $ref: '#/components/schemas/UserStatus'
        must_change_password: { type: boolean }
        account_count:
          type: integer
          minimum: 0
          description: Live accounts owned by the user.
        pending_count:
          type: integer
          minimum: 0
          description: Live accounts owned by the user with status pending.
        review_count:
          type: integer
          minimum: 0
          description: |
            Live accounts owned by the user with status pending or rejected.
            A value above zero puts the user in the pending group.
        created_at: { type: string, format: date-time }
        last_login_at:
          type: [string, "null"]
          format: date-time
        deleted_at:
          type: [string, "null"]
          format: date-time
          description: |
            Soft-delete timestamp; null for live users. Only rows fetched
            with include_deleted=true can carry a non-null value.
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 1 }
    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
    ResetPasswordRequest:
      type: object
      required: [token, new_password]
      properties:
        token: { type: string, minLength: 1 }
        new_password: { type: string, minLength: 1 }
    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password: { type: string, minLength: 1 }
        new_password: { type: string, minLength: 1 }
    RegistrationStatus:
      type: object
      required: [enabled, terms_version, privacy_version]
      properties:
        enabled:
          type: boolean
          description: False by default. Only a master may change it.
        terms_version: { type: integer, minimum: 1 }
        privacy_version: { type: integer, minimum: 1 }
    RegistrationSetRequest:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
    RegisterRequest:
      type: object
      required:
        [
          email,
          password,
          agree_terms,
          agree_privacy,
          terms_version,
          privacy_version,
        ]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 10
          description: |
            At least 10 characters and two of uppercase, lowercase, digits and
            symbols. The server enforces the classes; minLength mirrors the
            character floor. Inputs over 1024 bytes are rejected.
        agree_terms: { type: boolean }
        agree_privacy: { type: boolean }
        terms_version:
          type: integer
          minimum: 1
          description: Must equal RegistrationStatus.terms_version; a stale value is 409.
        privacy_version:
          type: integer
          minimum: 1
          description: Must equal RegistrationStatus.privacy_version; a stale value is 409.
    UserCreate:
      type: object
      required: [email, password, role]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: >-
            The server also limits the address to 254 UTF-8 bytes.
            maxLength counts Unicode code points, so the server check is the
            stricter one for non-ASCII addresses.
        password: { type: string, minLength: 1 }
        role:
          $ref: '#/components/schemas/UserRole'
    UserUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        role:
          $ref: '#/components/schemas/UserRole'
        status:
          $ref: '#/components/schemas/UserStatus'
        current_password:
          $ref: '#/components/schemas/CurrentPassword'
    CurrentPassword:
      type: string
      minLength: 1
      description: |
        The acting user's own login password, used to re-authenticate a
        dangerous operation. It is never the signing account's platform
        credential, and it is never stored, logged or audited. Optional in
        this schema; the server requires it on the dangerous endpoints and
        answers 400 when it is missing, 403 when it is wrong and 429 after
        repeated failures.
    UserDeleteRequest:
      type: object
      properties:
        current_password:
          $ref: '#/components/schemas/CurrentPassword'
    UserPasswordResetRequest:
      type: object
      properties:
        current_password:
          $ref: '#/components/schemas/CurrentPassword'
    AccountDeleteRequest:
      type: object
      properties:
        current_password:
          $ref: '#/components/schemas/CurrentPassword'
    MyAccountDeleteRequest:
      type: object
      properties:
        current_password:
          $ref: '#/components/schemas/CurrentPassword'
    AccountDeviceRefreshRequest:
      type: object
      properties:
        current_password:
          $ref: '#/components/schemas/CurrentPassword'
    UserTempPassword:
      type: object
      required: [temp_password]
      properties:
        temp_password:
          type: string
          minLength: 1
          description: |
            The one-time temporary password. It appears only in this
            response: never in logs, audit rows or any later response.
    SchoolStatus:
      type: string
      enum: [active, disabled]
    School:
      type: object
      required: [id, code, name, status, timezone, created_at, updated_at]
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
        status:
          $ref: '#/components/schemas/SchoolStatus'
        timezone: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SchoolCreate:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{1,31}$'
        name: { type: string, minLength: 1, maxLength: 128 }
        timezone:
          type: string
          enum: [Asia/Shanghai]
          default: Asia/Shanghai
    SchoolUpdate:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        status:
          $ref: '#/components/schemas/SchoolStatus'
        timezone:
          type: string
          enum: [Asia/Shanghai]
    SchoolPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/School'
        next_cursor:
          type: string
          description: Cursor for the next page; empty on the last page.
    SchoolAdmin:
      type: object
      required: [user_id, email, role, granted_by, created_at]
      properties:
        user_id: { type: string }
        email: { type: string, format: email }
        role:
          $ref: '#/components/schemas/UserRole'
        granted_by: { type: string }
        created_at: { type: string, format: date-time }
    SchoolAdminCreate:
      type: object
      required: [user_id]
      properties:
        user_id: { type: string }
    SchoolAdminPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SchoolAdmin'
        next_cursor:
          type: string
          description: Cursor for the next page; empty on the last page.
    AccountStatus:
      type: string
      description: |
        pending on create; review moves to active or rejected. Editing a
        rejected account returns it to pending. Pause moves active to
        paused_admin or paused_user. credential_error is written by the
        engine in P4 only; a password or device update returns it to active,
        while a phone change returns it to pending. A phone change wins over
        that recovery.
      enum:
        - pending
        - active
        - rejected
        - paused_admin
        - paused_user
        - credential_error
    Account:
      type: object
      required:
        - id
        - school_id
        - owner_user_id
        - owner_email_masked
        - phone_masked
        - name
        - display_name
        - status
        - reject_reason
        - reviewed_at
        - reviewed_by
        - created_at
        - updated_at
        - deleted_at
      properties:
        id: { type: string }
        school_id: { type: string }
        owner_user_id: { type: string }
        owner_email_masked:
          type: string
          description: |
            Masked email of the owner. The raw email never leaves the server.
            Unmaskable input reads as "unknown".
        phone_masked:
          type: string
          description: Masked phone. The raw phone never leaves the server.
        phone_model:
          type: string
          maxLength: 64
          description: |
            Device model stored inside the encrypted credential payload. Empty
            when the credential is missing or unreadable, and for soft-deleted
            rows. The device code and password are never returned.
        name:
          type: string
          maxLength: 50
          description: |
            Remark name. Empty when unset. Trimmed free text; it is not a
            credential and does not take part in review or scheduling.
        display_name:
          type: string
          description: |
            Effective remark shown in lists: the name when set, otherwise
            "账号" followed by the last four digits of the phone. The remark
            search matches this value, so the default label is findable.
        status:
          $ref: '#/components/schemas/AccountStatus'
        reject_reason:
          type: string
          description: |
            The last rejection reason; cleared when an edit returns the account
            to pending.
        reviewed_at:
          type: [string, "null"]
          format: date-time
          description: Stamp of the last review; cleared when an edit returns the account to pending.
        reviewed_by:
          type: [string, "null"]
          description: Reviewer of the last review; cleared with reviewed_at.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        deleted_at:
          type: [string, "null"]
          format: date-time
          description: |
            Soft-delete timestamp. Null for live rows; non-null only when the
            list was fetched with include_deleted=true. The restore entry
            needs this to mark deleted rows.
    AccountCreate:
      type: object
      description: |
        A user may not set device_code: the device code is the platform device
        identity, and a user can only obtain it through device-refresh. A
        create carrying a non-empty device_code from a user answers 403.
        phone_model is not a device identity, but a model edit still counts as
        a credential edit (a rejected account resubmits and a
        credential_error account recovers), and every role may write it.
      required: [school_id, phone, password]
      properties:
        school_id: { type: string }
        owner_user_id:
          type: string
          description: |
            Defaults to the caller. Only master and admin may set another
            user, and that user must exist and not be soft-deleted;
            otherwise the whole request answers 404.
        phone:
          type: string
          pattern: '^1[0-9]{10}$'
        name:
          type: string
          maxLength: 50
          description: Optional remark name; trimmed. Empty means unnamed.
        password: { type: string, minLength: 1 }
        device_code:
          type: string
          maxLength: 64
          description: |
            master and admin may set it. A user can only obtain it through
            device-refresh: a non-empty value answers 403, an empty string is
            the same as omitting it.
        phone_model: { type: string, maxLength: 64 }
    AccountUpdate:
      type: object
      description: |
        A user may not set or change device_code: the device code is the
        platform device identity, and a user can only obtain it through
        device-refresh. A user update carrying any device_code, including an
        empty string, answers 403. phone_model is not a device identity, but
        a model edit still counts as a credential edit (a rejected account
        resubmits and a credential_error account recovers), and every role
        may write it.
        current_password is the acting user's own login password, never the
        account credential. The server requires it when the request carries
        phone, password or device_code and answers 400 when it is missing,
        403 when it is wrong and 429 after repeated failures.
      minProperties: 1
      properties:
        school_id:
          type: string
          description: |
            A different value returns 409 conflict. Changing school is
            forbidden in P1 (decision 12.3).
        name:
          type: string
          maxLength: 50
          description: |
            Remark name; trimmed. An empty string clears it. A name-only edit
            keeps the status, including rejected.
        phone:
          type: string
          pattern: '^1[0-9]{10}$'
          description: |
            A new phone returns a non-pending account to pending: the review
            decision binds to the old phone. An unchanged phone is not a
            rebind and keeps the status. On a rejected account only a
            credential edit (a new phone, password, device code or model)
            resubmits; a name-only edit or an unchanged phone does not.
        password: { type: string, minLength: 1 }
        device_code:
          type: string
          maxLength: 64
          description: |
            master and admin may set or clear it: an empty string clears the
            stored device code. A user update carrying any device_code,
            including an empty string, answers 403.
        phone_model: { type: string, maxLength: 64 }
        current_password:
          $ref: '#/components/schemas/CurrentPassword'
    AccountReviewRequest:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [approve, reject]
        reason:
          type: string
          maxLength: 200
          description: |
            Required when decision is reject. The limit matches the audit
            detail limit and the accounts.reject_reason CHECK.
      if:
        properties:
          decision:
            const: reject
      then:
        required: [reason]
        properties:
          reason: { type: string, minLength: 1 }
    AccountPauseRequest:
      type: object
      description: |
        paused true pauses the account. master and admin set paused_admin; the
        owner sets paused_user. paused false resumes only the matching shape:
        master and admin resume paused_admin; the owner resumes paused_user.
        The implementation follows exactly this semantics.
      required: [paused]
      properties:
        paused: { type: boolean }
    AccountVerifyResult:
      type: object
      required: [ok, code]
      properties:
        ok: { type: boolean }
        code:
          type: string
          description: |
            success, credential_invalid, challenge, blocked, device_unbound,
            transient, unknown or rejected. A platform conclusion sets ok false
            and returns 200. blocked means a WAF interception page: like
            challenge it is never retried, but it is reported as a failure.
        message:
          type: string
          description: Masked platform text; absent when empty.
    AccountSignAccepted:
      type: object
      additionalProperties: false
      required: [task_id]
      properties:
        task_id: { type: string }
    AccountLocation:
      type: object
      additionalProperties: false
      required: [mode, lng, lat, reason]
      description: |
        The stored location policy. lng and lat are null for auto and carry
        the fixed point otherwise; both keys are always present. The reason
        is kept by the host for audit; it is not delivered to the platform
        yet (that lands with the upload protocol slice).
      properties:
        mode: { type: string, enum: [auto, fixed] }
        lng: { type: [number, "null"], format: double, minimum: -180, maximum: 180 }
        lat: { type: [number, "null"], format: double, minimum: -90, maximum: 90 }
        reason:
          type: string
          maxLength: 200
          description: Free text explaining an out-of-range fixed point; may be empty.
    AccountLocationUpdate:
      type: object
      additionalProperties: false
      required: [mode]
      description: |
        mode auto ignores and clears lng/lat; mode fixed requires both.
        The reason is stored verbatim and never audited in full.
      properties:
        mode: { type: string, enum: [auto, fixed] }
        lng: { type: number, format: double, minimum: -180, maximum: 180 }
        lat: { type: number, format: double, minimum: -90, maximum: 90 }
        reason: { type: string, maxLength: 200 }

    ScheduleWindowSource:
      type: string
      description: |
        platform and cache come from discovery; fallback is the local
        default window; override is a master or admin replacement.
      enum: [platform, cache, fallback, override]
    ScheduleWindow:
      type: object
      required: [school_id, school_name, task_id, task_name, enabled, start, end, source]
      properties:
        school_id: { type: string }
        school_name: { type: string }
        task_id: { type: string }
        task_name: { type: string }
        enabled: { type: boolean }
        day: { type: string, description: Business day YYYY-MM-DD. }
        start:
          type: [string, "null"]
          format: date-time
          description: |
            Null when no window is cached for the day. An uncached day is
            discovered once, so null means no platform window was reported.
        end:
          type: [string, "null"]
          format: date-time
        source:
          type: [string, "null"]
          description: |
            platform, cache, fallback or override; null when no window is
            cached for the day.
        version: { type: integer }
    ScheduleWindowList:
      type: object
      required: [day, items]
      properties:
        day: { type: string, description: Business day the list was resolved for. }
        items:
          type: array
          items:
            $ref: '#/components/schemas/ScheduleWindow'
    SchedulePlanRequest:
      type: object
      additionalProperties: false
      required: [day, school_id, task_id]
      properties:
        day: { type: string, description: Business day YYYY-MM-DD. }
        school_id: { type: string }
        task_id: { type: string }
    SchedulePlan:
      type: object
      required:
        - day
        - enabled
        - source
        - window_start
        - window_end
        - version
        - capacity
        - demand
        - shortfall
        - histogram
        - rows
      properties:
        day: { type: string }
        enabled:
          type: boolean
          description: |
            Whether the school task is enabled. A disabled task can be
            previewed, but Build and override reject it with 409 conflict.
        source:
          $ref: '#/components/schemas/ScheduleWindowSource'
        window_start:
          type: string
          format: date-time
          description: Effective window start after the edge trim.
        window_end:
          type: string
          format: date-time
          description: Effective window end after the edge trim.
        version:
          type: integer
          description: Window cache version; zero in a pure preview.
        capacity:
          type: integer
          description: Attempts the window can hold with the configured channels and rate.
        demand: { type: integer }
        shortfall: { type: integer }
        histogram:
          type: object
          additionalProperties: { type: integer }
          description: Account count per five-minute slice, keyed by slice index.
        rows:
          type: array
          items:
            $ref: '#/components/schemas/ScheduleRow'
    ScheduleRow:
      type: object
      required: [account_id, run_at]
      properties:
        account_id: { type: string }
        run_at: { type: string, format: date-time }
    ScheduleOverrideRequest:
      type: object
      additionalProperties: false
      required: [day, school_id, task_id, start, end, reason]
      properties:
        day: { type: string, description: Business day YYYY-MM-DD. }
        school_id: { type: string }
        task_id: { type: string }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        reason:
          type: string
          minLength: 1
          maxLength: 200
          description: Recorded with the override for later review.
    CapacityReport:
      type: object
      required:
        - school_id
        - task_id
        - day
        - source
        - window_start
        - window_end
        - capacity
        - demand
        - shortfall
      properties:
        school_id: { type: string }
        task_id: { type: string }
        day: { type: string }
        source:
          $ref: '#/components/schemas/ScheduleWindowSource'
        window_start: { type: string, format: date-time }
        window_end: { type: string, format: date-time }
        capacity: { type: integer }
        demand: { type: integer }
        shortfall: { type: integer }
        binding:
          type: string
          description: |
            Side to raise when capacity is short. workers means raise
            concurrency: a count at most 64 fits the demand, or the demand
            needs more than 64 channels and no allowed count fits.
            egress_rate means raising concurrency alone cannot fit the
            demand. When the current capacity already fits, it reports the
            current bottleneck and suggested_workers is absent.
          enum: [workers, egress_rate]
        suggested_workers:
          type: integer
          minimum: 1
          description: |
            Total channel count that fits the demand. Present only when
            binding is workers, the value is above the configured concurrency,
            at most 64, and that count really fits the demand. Absent for the
            egress_rate binding (raising concurrency alone cannot fit the
            demand) and when the demand exceeds the 64-channel cap. Applying
            it means changing YIBAN_WORKERS and restarting.
    SignStatsDay:
      type: object
      required: [day, pending, running, success, failed, skipped]
      properties:
        day: { type: string, format: date }
        pending: { type: integer }
        running: { type: integer }
        success: { type: integer }
        failed: { type: integer }
        skipped: { type: integer }
    SignStatsCounts:
      type: object
      required: [pending, running, success, failed, skipped]
      properties:
        pending: { type: integer }
        running: { type: integer }
        success: { type: integer }
        failed: { type: integer }
        skipped: { type: integer }
    SignStatsReport:
      type: object
      required: [days, total, by_status, days_missing]
      properties:
        days:
          type: array
          items:
            $ref: '#/components/schemas/SignStatsDay'
        total:
          type: integer
          description: Distinct accounts with at least one task row in the window.
        by_status:
          $ref: '#/components/schemas/SignStatsCounts'
        days_missing:
          type: array
          description: Days in the window with no task rows.
          items: { type: string, format: date }
    PrefStatsSlot:
      type: object
      required: [offset_min, label, count, cap]
      properties:
        offset_min:
          type: integer
          description: Minutes from the effective window start; multiple of five.
        label: { type: string }
        count:
          type: integer
          description: |
            Users with an active account in the school who picked this offset.
            Pending, rejected and paused accounts do not count.
        cap:
          type: integer
          description: Per-slice capacity used by the plan.
    PrefStatsReport:
      type: object
      required: [school_id, task_id, day, window_start, window_end, slots]
      properties:
        school_id: { type: string }
        task_id: { type: string }
        day: { type: string }
        window_start: { type: string, format: date-time }
        window_end: { type: string, format: date-time }
        slots:
          type: array
          items:
            $ref: '#/components/schemas/PrefStatsSlot'
    TimePref:
      type: object
      additionalProperties: false
      required: [offset_min, allowed, window]
      properties:
        offset_min:
          type: [integer, "null"]
          description: Relative minute from the effective window start; multiple of five.
        allowed:
          type: boolean
          description: False when the deployment disables user time preferences.
        window:
          $ref: '#/components/schemas/TimePrefWindow'
        slots:
          type: array
          description: |
            Five-minute anchors relative to the server standard signing
            window. Each label is a clock time inside that window. The window
            actually executed for a task may be shifted by the platform
            window or a per-task override, so a label is a preference time,
            not the promised execution time. disabled follows the deployment
            gate and the window.
          items:
            $ref: '#/components/schemas/TimePrefSlot'
    TimePrefWindow:
      type: object
      additionalProperties: false
      required: [start, end]
      properties:
        start:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: |
            Server standard signing window start, HH:MM. Actual execution may
            be shifted by the platform window or a per-task override.
        end:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: |
            Server standard signing window end, HH:MM. Actual execution may
            be shifted by the platform window or a per-task override.
    TimePrefSlot:
      type: object
      additionalProperties: false
      required: [offset_min, label, disabled]
      properties:
        offset_min:
          type: integer
          minimum: 0
          description: Minute offset from the window start, a multiple of five.
        label:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: Absolute clock time of the slot.
        disabled:
          type: boolean
          description: True when the deployment gate or the window forbids the slot.
        reason:
          type: string
          description: Human-readable reason when disabled is true.
    TimePrefUpdate:
      type: object
      additionalProperties: false
      required: [offset_min]
      properties:
        offset_min:
          type: [integer, "null"]
          description: Null clears the preference.

    MailNotify:
      type: object
      description: |
        The signed-in user's own sign-failure mail master switch.
        users.mail_notify is the signed-in user's own sign-failure mail
        master switch; notification_prefs.sign_failed_daily is the
        administrator subscription channel for the daily digest. When 0v8
        delivers mail, user sign-failure mail requires the user's
        mail_notify=true and a delivery trigger; the administrator digest
        reads only notification_prefs. The two switches are never OR-ed and
        never substitute for each other.
      required: [enabled]
      properties:
        enabled:
          type: boolean
          description: |
            True when sign-failure mail is enabled for the signed-in user.
            A user who never changed the switch reads true.
    MailNotifyUpdate:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
          description: New state of the sign-failure mail switch.

    Photo:
      type: object
      additionalProperties: false
      required: [id, sha256, mime, width, height, bytes, created_at]
      properties:
        id: { type: string }
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Digest of the stored (preprocessed) bytes; also the ETag.
        mime:
          type: string
          enum: [image/jpeg, image/png]
        width: { type: integer, minimum: 1 }
        height: { type: integer, minimum: 1 }
        bytes: { type: integer, format: int64, minimum: 1 }
        created_at: { type: string, format: date-time }
    PhotoPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Photo'
        next_cursor:
          type: string
          description: Cursor for the next page; empty on the last page.
    PhotoUpload:
      type: object
      additionalProperties: false
      required: [image]
      properties:
        image:
          type: string
          format: binary
          description: Original image bytes; JPEG or PNG, at most 10 MiB.
    PhotoRetention:
      type: object
      additionalProperties: false
      required: [days]
      properties:
        days:
          type: integer
          enum: [30, 90, 180, 365]
    PhotoRetentionUpdate:
      type: object
      additionalProperties: false
      required: [days]
      properties:
        days:
          type: integer
          enum: [30, 90, 180, 365]
    SchoolDefaultPhoto:
      type: object
      additionalProperties: false
      required: [photo_id, etag]
      properties:
        photo_id:
          type: [string, "null"]
          description: Referenced photo id; null when no default photo is set.
        etag:
          type: string
          description: |
            sha256 (lowercase hex) of the referenced photo, the same digest
            as Photo.sha256; empty when photo_id is null.
    SchoolDefaultPhotoUpdate:
      type: object
      additionalProperties: false
      required: [photo_id]
      properties:
        photo_id:
          type: [string, "null"]
          description: An existing photo visible to the caller; null clears the default.
    UserPage:
      type: object
      required: [items, next_cursor, counts]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/User'
        next_cursor:
          type: string
          description: Cursor for the next page; empty on the last page.
        counts:
          $ref: '#/components/schemas/UserCounts'
    UserCounts:
      type: object
      description: |
        Group totals over all users, independent of role, status, q, group
        and pagination. pending, normal and vacant count live users; deleted
        counts soft-deleted users.
      required: [pending, normal, vacant, deleted]
      properties:
        pending:
          type: integer
          minimum: 0
        normal:
          type: integer
          minimum: 0
        vacant:
          type: integer
          minimum: 0
        deleted:
          type: integer
          minimum: 0
    UserLookupPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserLookupRef'
    UserLookupRef:
      type: object
      required: [id, email_masked, status]
      description: |
        A restricted user reference for owner pickers. The masked email
        keeps the first character and the domain; the full address,
        role and timestamps are never sent.
      properties:
        id: { type: string }
        email_masked: { type: string }
        status:
          $ref: '#/components/schemas/UserStatus'
    AccountDevice:
      type: object
      required: [device_code_masked, phone_model, authorized]
      description: |
        The device view after a platform re-read. device_code_masked keeps
        the first two and the last two characters; the full code never
        leaves the server. phone_model and device_code_masked carry the
        effective stored values: platform-side empty fields leave the
        hand-filled values in place.
      properties:
        device_code_masked: { type: string }
        phone_model: { type: string }
        authorized: { type: boolean }
    AccountPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Account'
        next_cursor:
          type: string
          description: Cursor for the next page; empty on the last page.
    AccountSummary:
      type: object
      required: [pending, rejected]
      description: |
        Review workload counts over live accounts only: a row with a
        deleted_at stamp never enters either number.
      properties:
        pending: { type: integer, minimum: 0 }
        rejected: { type: integer, minimum: 0 }
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok
    DiagnosticsReport:
      type: object
      required: [updated_at, items]
      properties:
        updated_at: { type: string, format: date-time }
        items:
          type: array
          items:
            $ref: '#/components/schemas/DiagnosticsItem'
    TaskPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminTaskRow'
        next_cursor:
          type: string
          description: Empty string on the last page.
    AdminTaskRow:
      type: object
      required: [id, account_id, account_phone_masked, school_id, school_name, task_name, state, attempts, result, run_at, claimed_at, updated_at]
      properties:
        id: { type: string }
        account_id: { type: string }
        account_phone_masked:
          type: string
          description: First 3 and last 4 digits of the account phone; the full number never leaves the server.
        school_id: { type: string }
        school_name: { type: string }
        task_name: { type: string }
        state:
          type: string
          description: pending, running, success, failed or skipped.
        attempts: { type: integer }
        result: { type: string }
        run_at: { type: string, format: date-time }
        claimed_at:
          type: [string, "null"]
          format: date-time
          description: Null while the row has never been claimed.
        updated_at: { type: string, format: date-time }
    EngineSnapshot:
      type: object
      required: [inflight, due_now, today_success, today_failed, retrying, retrying_truncated, last_claim_at, last_tick_at, worker_started_at]
      properties:
        inflight:
          type: array
          description: Running tasks with a claim time and a lease deadline, oldest claim first.
          items:
            $ref: '#/components/schemas/EngineInflightRow'
        due_now:
          type: integer
          description: Pending tasks whose run time has passed, in the caller's school scope.
        today_success:
          type: integer
          description: |
            Distinct accounts whose latest task row (by last update, then row
            id) on the current business day reached success, in the caller's
            school scope. Soft-deleted accounts never count.
        today_failed:
          type: integer
          description: |
            Distinct accounts whose latest task row (by last update, then row
            id) on the current business day reached failed, in the caller's
            school scope. Soft-deleted accounts never count.
        retrying:
          type: array
          description: |
            Pending tasks with at least one business attempt, ordered by the
            next run time ascending, capped at the 200 soonest rows. Waiting
            requeues never count an attempt.
          items:
            $ref: '#/components/schemas/EngineRetryRow'
        retrying_truncated:
          type: boolean
          description: True when more retry rows exist beyond the 200-row cap; the client must not read the list as complete.
        last_claim_at:
          type: [string, "null"]
          format: date-time
          description: |
            In-process time of the last claim that processed at least one
            task; null before the loop claims anything. Never read from the
            database, so it resets on restart.
        last_tick_at:
          type: [string, "null"]
          format: date-time
          description: In-process time of the last completed loop pass; null before the first pass.
        worker_started_at:
          type: [string, "null"]
          format: date-time
          description: In-process time when the loop started; null while the loop has not started.
    EngineInflightRow:
      type: object
      required: [account_id, account_phone_masked, school_id, school_name, claimed_at, lease_expires_at]
      properties:
        account_id: { type: string }
        account_phone_masked:
          type: string
          description: First 3 and last 4 digits of the account phone; the full number never leaves the server.
        school_id: { type: string }
        school_name: { type: string }
        claimed_at:
          type: string
          format: date-time
          description: When this task was claimed by the worker.
        lease_expires_at:
          type: string
          format: date-time
          description: Absolute lease deadline (claim time plus the lease span); the client renders the remaining lease.
    EngineRetryRow:
      type: object
      required: [task_id, account_id, account_phone_masked, school_id, school_name, task_name, attempts, run_at, result]
      properties:
        task_id:
          type: string
          description: The sign task row id; the business identity of a retry row, since one account can have several pending retries for one day.
        account_id: { type: string }
        account_phone_masked:
          type: string
          description: First 3 and last 4 digits of the account phone; the full number never leaves the server.
        school_id: { type: string }
        school_name: { type: string }
        task_name:
          type: string
          description: The school task name, shown so a multi-retry account is readable.
        attempts:
          type: integer
          description: Business attempts already consumed; waiting requeues do not count.
        run_at:
          type: string
          format: date-time
          description: When the next attempt is scheduled.
        result:
          type: string
          description: The persisted outcome word of the last attempt, free-text masked.
    DiagnosticsItem:
      type: object
      required:
        - account_id
        - display_name
        - phone_masked
        - account_status
        - state
        - run_at
        - attempts
        - result
        - next_retry_at
        - suggestion
      properties:
        account_id: { type: string }
        display_name:
          type: string
          description: |
            Effective remark: the name when set, otherwise "账号" followed by
            the last four digits of the phone. Read from the account record;
            the read surface never re-derives it.
        phone_masked:
          type: string
          description: First 3 and last 4 digits of the account phone; the full number never leaves the server.
        account_status:
          $ref: '#/components/schemas/AccountStatus'
        state:
          type: [string, "null"]
          description: pending, running, success, failed or skipped; null when the account has no task row today.
        run_at:
          type: [string, "null"]
          format: date-time
        attempts: { type: integer }
        result: { type: string }
        next_retry_at:
          type: [string, "null"]
          format: date-time
          description: When the task is queued again after a failure; null otherwise.
        suggestion:
          type: string
          enum: [wait, retry_now, re_arm, contact_admin]
    AccountDiagnostics:
      allOf:
        - $ref: '#/components/schemas/DiagnosticsItem'
        - type: object
          required: [window, egress]
          properties:
            window:
              type: [object, "null"]
              description: Today's planned window; null when not discovered yet.
              required: [start, end, source, version]
              properties:
                start: { type: string, format: date-time }
                end: { type: string, format: date-time }
                source:
                  type: string
                  enum: [platform, cache, fallback, override]
                version: { type: integer }
            egress:
              type: [object, "null"]
              description: The account's sticky egress label; null when not assigned yet.
              required: [identity]
              properties:
                identity: { type: string }
    SignStatusReport:
      type: object
      required: [updated_at, items]
      properties:
        updated_at: { type: string, format: date-time }
        items:
          type: array
          items:
            $ref: '#/components/schemas/SignStatusItem'
    SignStatusItem:
      type: object
      required:
        - account_id
        - display_name
        - phone_masked
        - account_status
        - state
        - run_at
        - stale
      properties:
        account_id: { type: string }
        display_name:
          type: string
          description: |
            Effective remark: the name when set, otherwise "账号" followed by
            the last four digits of the phone. Read from the account record;
            the read surface never re-derives it.
        phone_masked:
          type: string
          description: First 3 and last 4 digits of the account phone; the full number never leaves the server.
        account_status:
          $ref: '#/components/schemas/AccountStatus'
        state:
          type: [string, "null"]
          description: pending, running, success, failed or skipped; null when the account has no task row today.
        run_at:
          type: [string, "null"]
          format: date-time
        stale: { type: boolean }
    SignCalendar:
      type: object
      additionalProperties: false
      required: [timezone, today, updated_at, days]
      properties:
        timezone:
          type: string
          description: Server business time zone used for today and every day key.
        today:
          type: string
          description: Server business day, YYYY-MM-DD.
        updated_at:
          type: string
          format: date-time
          description: |
            Maximum task-row update time inside the range; the server clock
            when the range holds no rows.
        days:
          type: array
          items:
            $ref: '#/components/schemas/SignCalendarDay'
    SignCalendarDay:
      type: object
      additionalProperties: false
      required: [day, total, success, failed, skipped, unknown, future]
      properties:
        day:
          type: string
          description: Business day, YYYY-MM-DD.
        total:
          type: integer
          minimum: 0
          description: Accounts counted that day; the sum of the four buckets.
        success: { type: integer, minimum: 0 }
        failed: { type: integer, minimum: 0 }
        skipped: { type: integer, minimum: 0 }
        unknown:
          type: integer
          minimum: 0
          description: Accounts whose latest row is pending, running or unrecognised.
        future:
          type: boolean
          description: True for days after the server business day; all counts are zero.
    SignCalendarDayDetail:
      type: object
      additionalProperties: false
      required: [day, timezone, accounts, future]
      properties:
        day:
          type: string
          description: Business day, YYYY-MM-DD.
        timezone:
          type: string
          description: Server business time zone.
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/SignCalendarAccount'
        future:
          type: boolean
          description: True for days after the server business day; accounts is empty.
    SignCalendarAccount:
      type: object
      additionalProperties: false
      required: [account_id, state, attempts]
      properties:
        account_id: { type: string }
        state:
          type: string
          enum: [success, failed, skipped, unknown]
          description: Normalised account outcome for the day.
        run_at:
          type: string
          format: date-time
          description: Planned run time of the latest row; absent when the row has none.
        attempts:
          type: integer
          minimum: 0
          description: Business attempts consumed by the latest row.
