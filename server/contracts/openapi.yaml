# Host API v1 — OpenAPI 3.1 contract.
#
# The frozen shape lives in contracts/README.md; this file is its machine
# readable form and the only source of the Go transport types. Regenerate the
# code with the pinned generator (v2.8.1):
#
#   ./scripts/generate.sh
#
# Conventions:
# - JSON, UTF-8, RFC3339 timestamps.
# - Auth: HttpOnly session cookie. Writes also require X-CSRF-Token.
# - Error envelope: {"error":{"code","message","details","trace_id"}}.
# - Cross-scope object: 404. Action forbidden: 403.
# - Pagination: ?cursor=&limit= (default 50, max 200).
# - No raw phone number, credential or upstream raw text in any response.
openapi: 3.1.0
info:
  title: yiban-auto-sign host API
  version: "1.0.0"
  description: |
    Host API for the account caretaking platform. Roles: master (all schools,
    admins, settings), admin (bound schools only), user (own accounts).

    Phase P1 ships the frozen shape and live use cases. Auth, password reset,
    users, schools, admins and accounts answer from their use cases.
servers:
  - url: /
tags:
  - name: auth
  - name: users
  - name: schools
  - name: admins
  - name: accounts
  - name: schedule
  - name: photos
  - name: health
security:
  - sessionCookie: []
paths:
  /api/auth/login:
    post:
      tags: [auth]
      operationId: AuthLogin
      summary: Sign in with email and password.
      description: Sets the HttpOnly session cookie on success.
      security: []
      x-roles: [public]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Session established.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionUser'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        default: { $ref: '#/components/responses/DefaultError' }
  /api/auth/logout:
    post:
      tags: [auth]
      operationId: AuthLogout
      summary: Destroy the current session.
      description: |
        Idempotent. A request without a session is a no-op and needs no CSRF
        token, because no authority is carried. A request with a session must
        send X-CSRF-Token.
      security: []
      x-roles: [public]
      parameters:
        - $ref: '#/components/parameters/CSRFTokenOptional'
      responses:
        '204': { description: Session destroyed. }
        default: { $ref: '#/components/responses/DefaultError' }
  /api/auth/me:
    get:
      tags: [auth]
      operationId: AuthMe
      summary: Return the signed-in user and the CSRF token.
      x-roles: [master, admin, user]
      responses:
        '200':
          description: Current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionUser'
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        default: { $ref: '#/components/responses/DefaultError' }
  /api/auth/forgot-password:
    post:
      tags: [auth]
      operationId: AuthForgotPassword
      summary: Start the password reset flow.
      description: |
        Always returns 204, whether or not the email exists, to avoid account
        enumeration. A one-time token row is written only for known accounts.
      security: []
      x-roles: [public]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '204': { description: Request accepted. }
        '400': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/DefaultError' }
  /api/auth/reset-password:
    post:
      tags: [auth]
      operationId: AuthResetPassword
      summary: Finish the password reset flow with a one-time token.
      description: |
        Consumes the token, replaces the password, revokes every session of the
        user and marks must_change_password false.
      security: []
      x-roles: [public]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '204': { description: Password replaced. }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        default: { $ref: '#/components/responses/DefaultError' }
  /api/users:
    post:
      tags: [users]
      operationId: UserCreate
      summary: Create a master, admin or user account.
      description: |
        Master only (decision 12.4). There is no public registration endpoint.
        The password is stored as an argon2id hash. A duplicate email among
        live users is a 409; a soft-deleted user's email may be reused.
      x-roles: [master]
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: User created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '409': { $ref: '#/components/responses/ConflictError' }
        default: { $ref: '#/components/responses/DefaultError' }
  /api/schools:
    get:
      tags: [schools]
      operationId: SchoolList
      summary: List schools with cursor pagination.
      x-roles: [master, admin]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: |
            School page. master sees every school; admin sees only bound schools.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchoolPage'
        '403': { $ref: '#/components/responses/ForbiddenError' }
        default: { $ref: '#/components/responses/DefaultError' }
    post:
      tags: [schools]
      operationId: SchoolCreate
      summary: Create a school.
      x-roles: [master]
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchoolCreate'
      responses:
        '201':
          description: School created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/School'
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '409': { $ref: '#/components/responses/ConflictError' }
        '413': { $ref: '#/components/responses/PayloadTooLargeError' }
        default: { $ref: '#/components/responses/DefaultError' }
  /api/schools/{id}:
    patch:
      tags: [schools]
      operationId: SchoolUpdate
      summary: Update school name, status or time zone.
      description: The school code is immutable in v1.
      x-roles: [master]
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/SchoolID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchoolUpdate'
      responses:
        '200':
          description: School updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/School'
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        default: { $ref: '#/components/responses/DefaultError' }
  /api/schools/{id}/admins:
    get:
      tags: [admins]
      operationId: SchoolAdminList
      summary: List admins bound to the school.
      x-roles: [master]
      parameters:
        - $ref: '#/components/parameters/SchoolID'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Admin binding page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchoolAdminPage'
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        default: { $ref: '#/components/responses/DefaultError' }
    post:
      tags: [admins]
      operationId: SchoolAdminAdd
      summary: Bind an existing user as an admin of the school.
      description: |
        P1 has no invitation flow (decision 12.15). The user must already exist
        and have role admin or master.
      x-roles: [master]
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/SchoolID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchoolAdminCreate'
      responses:
        '201':
          description: Admin bound.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchoolAdmin'
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '409': { $ref: '#/components/responses/ConflictError' }
        '413': { $ref: '#/components/responses/PayloadTooLargeError' }
        default: { $ref: '#/components/responses/DefaultError' }
  /api/schools/{id}/admins/{uid}:
    delete:
      tags: [admins]
      operationId: SchoolAdminRemove
      summary: Unbind an admin from the school.
      x-roles: [master]
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/SchoolID'
        - $ref: '#/components/parameters/UserID'
      responses:
        '204': { description: Admin unbound. }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        default: { $ref: '#/components/responses/DefaultError' }
  /api/accounts:
    get:
      tags: [accounts]
      operationId: AccountList
      summary: List accounts with cursor pagination.
      description: |
        master sees all schools; admin sees bound schools; user sees own
        accounts. school_id, status and q narrow the result.
      x-roles: [master, admin, user]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: school_id
          in: query
          required: false
          schema: { type: string }
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/AccountStatus'
        - name: q
          in: query
          required: false
          description: |
            Phone filter. Non-digits are stripped. A leading prefix of one to
            three digits, a trailing four-digit suffix, or the exact 11-digit
            phone matches. A 5..10 digit fragment never matches. The exact
            11-digit phone still matches, so the number stays enumerable.
            Login and password-reset rate limiting is a deployment precondition
            before public exposure (P7).
          schema: { type: string }
      responses:
        '200':
          description: Account page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountPage'
        '403': { $ref: '#/components/responses/ForbiddenError' }
        default: { $ref: '#/components/responses/DefaultError' }
    post:
      tags: [accounts]
      operationId: AccountCreate
      summary: Register a platform account.
      description: |
        owner_user_id defaults to the caller. Only master and admin may set it
        to another user. The account starts in status pending.
      x-roles: [master, admin, user]
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountCreate'
      responses:
        '201':
          description: Account created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '409': { $ref: '#/components/responses/ConflictError' }
        '413': { $ref: '#/components/responses/PayloadTooLargeError' }
        default: { $ref: '#/components/responses/DefaultError' }
  /api/accounts/{id}:
    get:
      tags: [accounts]
      operationId: AccountGet
      summary: Read one account.
      description: Cross-scope reads return 404.
      x-roles: [master, admin, user]
      parameters:
        - $ref: '#/components/parameters/AccountID'
      responses:
        '200':
          description: Account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '404': { $ref: '#/components/responses/NotFoundError' }
        default: { $ref: '#/components/responses/DefaultError' }
    patch:
      tags: [accounts]
      operationId: AccountUpdate
      summary: Update account fields.
      description: |
        Never changes status. Review and pause have dedicated endpoints. Changing
        school is forbidden in P1 (decision 12.3) and returns conflict.
      x-roles: [master, admin, user]
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/AccountID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountUpdate'
      responses:
        '200':
          description: Account updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '409': { $ref: '#/components/responses/ConflictError' }
        default: { $ref: '#/components/responses/DefaultError' }
    delete:
      tags: [accounts]
      operationId: AccountDelete
      summary: Soft-delete an account.
      description: Sets deleted_at and deleted_by. Cascades hide credentials.
      x-roles: [master, admin, user]
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/AccountID'
      responses:
        '204': { description: Account deleted. }
        '404': { $ref: '#/components/responses/NotFoundError' }
        default: { $ref: '#/components/responses/DefaultError' }
  /api/accounts/{id}/review:
    post:
      tags: [accounts]
      operationId: AccountReview
      summary: Approve or reject a pending account.
      description: A rejection must carry a reason.
      x-roles: [master, admin]
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/AccountID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountReviewRequest'
      responses:
        '200':
          description: Account with the new status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '409': { $ref: '#/components/responses/ConflictError' }
        default: { $ref: '#/components/responses/DefaultError' }
  /api/accounts/{id}/pause:
    post:
      tags: [accounts]
      operationId: AccountPause
      summary: Pause or resume an account.
      description: |
        An admin or master pause sets paused_admin; the owner pause sets
        paused_user. Sending paused false resumes only the matching shape:
        admin and master resume paused_admin; the owner resumes paused_user.
        Any other shape returns conflict.
      x-roles: [master, admin, user]
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/AccountID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountPauseRequest'
      responses:
        '200':
          description: Account with the new status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '409': { $ref: '#/components/responses/ConflictError' }
        default: { $ref: '#/components/responses/DefaultError' }
  /api/accounts/{id}/verify:
    post:
      tags: [accounts]
      operationId: AccountVerify
      summary: Verify the stored credentials against the platform.
      description: |
        Reads the stored phone, password and device code, performs a login and
        reports the platform conclusion. The response never includes the
        credential. Platform conclusions return 200; a transport failure
        returns 502 upstream_unavailable.
      x-roles: [master, admin]
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/AccountID'
      responses:
        '200':
          description: Verification conclusion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountVerifyResult'
        '404': { $ref: '#/components/responses/NotFoundError' }
        '502': { $ref: '#/components/responses/DefaultError' }
        default: { $ref: '#/components/responses/DefaultError' }
  /api/accounts/{id}/sign:
    post:
      tags: [accounts]
      operationId: AccountSign
      summary: Queue a manual sign for today.
      description: |
        Ensures today's task row exists and returns 202 with its id.
        A closed window returns 409 window_closed. A run in progress returns
        409 sign_running. A concluded day returns 409 already_signed.
        Cross-scope accounts return 404 for every role.
      x-roles: [master, admin, user]
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/AccountID'
      responses:
        '202':
          description: Task accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSignAccepted'
        '404': { $ref: '#/components/responses/NotFoundError' }
        '409': { $ref: '#/components/responses/DefaultError' }
        default: { $ref: '#/components/responses/DefaultError' }
  /api/accounts/{id}/location:
    put:
      tags: [accounts]
      operationId: AccountLocationSet
      summary: Set the account location policy.
      description: |
        mode auto clears the stored point; mode fixed requires lng and lat
        inside the WGS84 range. A user may only change own accounts and an
        admin only accounts of bound schools; cross-scope writes return 404.
        The reason is kept by the host for audit and review. Delivering it
        to the platform lands with the upload protocol slice; until then the
        sign request carries it but the provider does not include it. It
        applies when the fixed point falls
        outside the target fence, so an out-of-range sign can be explained.
      x-roles: [user, admin]
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/AccountID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountLocationUpdate'
      responses:
        '200':
          description: Location policy stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountLocation'
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        default: { $ref: '#/components/responses/DefaultError' }
  /api/schedule/windows:
    get:
      tags: [schedule]
      operationId: ScheduleWindows
      summary: List task windows for a business day.
      description: |
        master sees every school; admin sees bound schools only.
        A task without a cached window for the day has null start and end,
        because the window is not discovered yet.
      x-roles: [master, admin]
      parameters:
        - name: day
          in: query
          required: false
          description: Business day YYYY-MM-DD; defaults to today in the server time zone.
          schema: { type: string }
      responses:
        '200':
          description: Task window list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleWindowList'
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        default: { $ref: '#/components/responses/DefaultError' }
  /api/schedule/preview:
    get:
      tags: [schedule]
      operationId: SchedulePreview
      summary: Preview the plan for one school task and day.
      description: |
        Reads the window from the platform, then the cache, then the fallback,
        and returns the exact rows Build would persist. Preview writes nothing.
      x-roles: [master, admin]
      parameters:
        - name: day
          in: query
          required: true
          description: Business day YYYY-MM-DD.
          schema: { type: string }
        - $ref: '#/components/parameters/SchoolIDQuery'
        - $ref: '#/components/parameters/TaskIDQuery'
      responses:
        '200':
          description: Plan preview.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulePlan'
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        default: { $ref: '#/components/responses/DefaultError' }
  /api/schedule/plan:
    post:
      tags: [schedule]
      operationId: SchedulePlan
      summary: Build and persist the plan for one school task and day.
      description: |
        Writes the resolved window, rearranges pending rows when the window
        changed, and inserts missing rows in one transaction. Running and
        terminal rows are never moved.
      x-roles: [master, admin]
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchedulePlanRequest'
      responses:
        '200':
          description: Persisted plan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulePlan'
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '409': { $ref: '#/components/responses/ConflictError' }
        default: { $ref: '#/components/responses/DefaultError' }
  /api/schedule/override:
    post:
      tags: [schedule]
      operationId: ScheduleOverride
      summary: Replace the window of one school task for one day.
      description: |
        An override wins over the platform window for the same day and keeps
        its recorded reason. Pending rows are rearranged immediately; running
        and terminal rows are never moved.
      x-roles: [master, admin]
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleOverrideRequest'
      responses:
        '200':
          description: Plan rebuilt against the override.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulePlan'
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '409': { $ref: '#/components/responses/ConflictError' }
        default: { $ref: '#/components/responses/DefaultError' }
  /api/me/time-pref:
    get:
      tags: [schedule]
      operationId: TimePrefGet
      summary: Read the signed-in user's preferred signing offset.
      description: |
        offset_min is the relative minute from the effective window start.
        It must be a multiple of five. allowed reports whether the deployment
        enables user time preferences; a stored value stays readable when the
        feature is disabled.
      x-roles: [user]
      responses:
        '200':
          description: Time preference.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimePref'
        '403': { $ref: '#/components/responses/ForbiddenError' }
        default: { $ref: '#/components/responses/DefaultError' }
    put:
      tags: [schedule]
      operationId: TimePrefSet
      summary: Set or clear the signed-in user's preferred offset.
      description: |
        offset_min null clears the preference. A change within the cooldown
        window returns 429 rate_limited. The deployment gate
        YIBAN_ALLOW_TIME_PREF must be on, otherwise the call returns 403.
      x-roles: [user]
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimePrefUpdate'
      responses:
        '200':
          description: Stored preference.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimePref'
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '429': { $ref: '#/components/responses/DefaultError' }
        default: { $ref: '#/components/responses/DefaultError' }
  /api/capacity:
    get:
      tags: [schedule]
      operationId: CapacityGet
      summary: Report capacity and demand for one school task.
      description: |
        Capacity uses the same window resolution and formula as the plan.
        A positive shortfall means demand exceeds capacity and the plan
        compresses rows into the tail slice.
      x-roles: [master, admin]
      parameters:
        - $ref: '#/components/parameters/SchoolIDQuery'
        - $ref: '#/components/parameters/TaskIDQuery'
        - name: day
          in: query
          required: false
          description: Business day YYYY-MM-DD; defaults to today in the server time zone.
          schema: { type: string }
      responses:
        '200':
          description: Capacity report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapacityReport'
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        default: { $ref: '#/components/responses/DefaultError' }
  /api/me/photos:
    get:
      tags: [photos]
      operationId: PhotoList
      summary: List the signed-in user's photos.
      x-roles: [user]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Photo page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoPage'
        '403': { $ref: '#/components/responses/ForbiddenError' }
        default: { $ref: '#/components/responses/DefaultError' }
    post:
      tags: [photos]
      operationId: PhotoUpload
      summary: Upload one image into the library.
      description: |
        multipart/form-data with a single `image` file part. The server
        decodes, rotates, strips metadata, re-encodes and stores the bytes.
        The raw upload limit is 10 MiB. Uploading the same bytes again
        returns the same photo id and restores a deleted photo.
      x-roles: [user]
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PhotoUpload'
      responses:
        '201':
          description: Photo stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Photo'
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        default: { $ref: '#/components/responses/DefaultError' }
  /api/me/photos/{id}:
    get:
      tags: [photos]
      operationId: PhotoGet
      summary: Stream one photo.
      description: |
        Returns the stored bytes with their real media type and an ETag of
        the sha256. The scope check runs before any bytes are written.
        admin reads answer 404 until the account-photo relation exists.
      x-roles: [user, admin]
      parameters:
        - $ref: '#/components/parameters/PhotoID'
      responses:
        '200':
          description: Image bytes.
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/NotFoundError' }
        default: { $ref: '#/components/responses/DefaultError' }
    delete:
      tags: [photos]
      operationId: PhotoDelete
      summary: Soft-delete one photo.
      description: Idempotent; the blob is kept for dedupe and collected later.
      x-roles: [user]
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/PhotoID'
      responses:
        '204': { description: Photo deleted. }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        default: { $ref: '#/components/responses/DefaultError' }
  /api/me/photo-retention:
    put:
      tags: [photos]
      operationId: PhotoRetentionSet
      summary: Set the photo retention period.
      description: |
        days is one of 30, 90, 180 or 365. Missing retention means 90 days.
      x-roles: [user]
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhotoRetentionUpdate'
      responses:
        '200':
          description: Stored retention.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoRetention'
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        default: { $ref: '#/components/responses/DefaultError' }
  /healthz:
    get:
      tags: [health]
      operationId: HealthCheck
      summary: Liveness probe.
      security: []
      x-roles: [public]
      responses:
        '200':
          description: Process is serving requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        default: { $ref: '#/components/responses/DefaultError' }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-yiban_session
      description: |
        HttpOnly, Secure, SameSite=Lax session cookie set by POST /api/auth/login.
  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque page cursor taken from next_cursor.
      schema: { type: string }
    Limit:
      name: limit
      in: query
      required: false
      description: Page size, 1 to 200.
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: |
        CSRF token returned by GET /api/auth/me. Required on every
        state-changing request that carries a session.
      schema: { type: string }
    CSRFTokenOptional:
      name: X-CSRF-Token
      in: header
      required: false
      description: |
        Required only when the request carries a session. Used by logout,
        where a session-less request is a no-op.
      schema: { type: string }
    SchoolID:
      name: id
      in: path
      required: true
      schema: { type: string }
    UserID:
      name: uid
      in: path
      required: true
      schema: { type: string }
    AccountID:
      name: id
      in: path
      required: true
      schema: { type: string }
    SchoolIDQuery:
      name: school_id
      in: query
      required: true
      schema: { type: string }
    TaskIDQuery:
      name: task_id
      in: query
      required: true
      description: School task id from GET /api/schedule/windows.
      schema: { type: string }
    PhotoID:
      name: id
      in: path
      required: true
      schema: { type: string }
  responses:
    ValidationError:
      description: Request body or parameters are invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnauthorizedError:
      description: No session, invalid session or invalid one-time token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ForbiddenError:
      description: Role or scope does not allow the action.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFoundError:
      description: Object missing or out of scope.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ConflictError:
      description: Object already exists or the state transition is invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PayloadTooLargeError:
      description: Request body exceeds the entry limit; the code stays validation_failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    DefaultError:
      description: Error envelope; the code field carries the stable code.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
    ErrorBody:
      type: object
      required: [code, message, details, trace_id]
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          description: User-safe message; no internal detail.
        details:
          type: object
          additionalProperties: true
          description: Machine-readable extras; an empty object when unused.
        trace_id:
          type: string
          description: Request trace id; mirrors the X-Request-Id header.
    ErrorCode:
      type: string
      description: Stable codes frozen in P0. No other value is allowed.
      enum:
        - validation_failed
        - unauthorized
        - forbidden
        - not_found
        - conflict
        - rate_limited
        - capacity_exceeded
        - window_closed
        - already_signed
        - sign_running
        - photo_missing
        - photo_invalid
        - photo_rejected
        - location_out_of_range
        - upstream_unavailable
        - internal_error
    UserRole:
      type: string
      enum: [master, admin, user]
    UserStatus:
      type: string
      enum: [active, disabled]
    SessionUser:
      type: object
      required: [id, email, role, status, must_change_password, csrf_token]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        role:
          $ref: '#/components/schemas/UserRole'
        status:
          $ref: '#/components/schemas/UserStatus'
        must_change_password: { type: boolean }
        csrf_token:
          type: string
          description: Token the client sends back in X-CSRF-Token.
    User:
      type: object
      required: [id, email, role, status, must_change_password, created_at]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        role:
          $ref: '#/components/schemas/UserRole'
        status:
          $ref: '#/components/schemas/UserStatus'
        must_change_password: { type: boolean }
        created_at: { type: string, format: date-time }
        last_login_at:
          type: [string, "null"]
          format: date-time
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 1 }
    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
    ResetPasswordRequest:
      type: object
      required: [token, new_password]
      properties:
        token: { type: string, minLength: 1 }
        new_password: { type: string, minLength: 1 }
    UserCreate:
      type: object
      required: [email, password, role]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: >-
            The server also limits the address to 254 UTF-8 bytes.
            maxLength counts Unicode code points, so the server check is the
            stricter one for non-ASCII addresses.
        password: { type: string, minLength: 1 }
        role:
          $ref: '#/components/schemas/UserRole'
    SchoolStatus:
      type: string
      enum: [active, disabled]
    School:
      type: object
      required: [id, code, name, status, timezone, created_at, updated_at]
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
        status:
          $ref: '#/components/schemas/SchoolStatus'
        timezone: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SchoolCreate:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{1,31}$'
        name: { type: string, minLength: 1, maxLength: 128 }
        timezone:
          type: string
          enum: [Asia/Shanghai]
          default: Asia/Shanghai
    SchoolUpdate:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        status:
          $ref: '#/components/schemas/SchoolStatus'
        timezone:
          type: string
          enum: [Asia/Shanghai]
    SchoolPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/School'
        next_cursor:
          type: string
          description: Cursor for the next page; empty on the last page.
    SchoolAdmin:
      type: object
      required: [user_id, email, role, granted_by, created_at]
      properties:
        user_id: { type: string }
        email: { type: string, format: email }
        role:
          $ref: '#/components/schemas/UserRole'
        granted_by: { type: string }
        created_at: { type: string, format: date-time }
    SchoolAdminCreate:
      type: object
      required: [user_id]
      properties:
        user_id: { type: string }
    SchoolAdminPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SchoolAdmin'
        next_cursor:
          type: string
          description: Cursor for the next page; empty on the last page.
    AccountStatus:
      type: string
      description: |
        pending on create; review moves to active or rejected. Pause moves
        active to paused_admin or paused_user. credential_error is written by
        the engine in P4 only.
      enum:
        - pending
        - active
        - rejected
        - paused_admin
        - paused_user
        - credential_error
    Account:
      type: object
      required:
        - id
        - school_id
        - owner_user_id
        - phone_masked
        - status
        - reject_reason
        - created_at
        - updated_at
      properties:
        id: { type: string }
        school_id: { type: string }
        owner_user_id: { type: string }
        phone_masked:
          type: string
          description: Masked phone. The raw phone never leaves the server.
        status:
          $ref: '#/components/schemas/AccountStatus'
        reject_reason: { type: string }
        reviewed_at:
          type: [string, "null"]
          format: date-time
        reviewed_by:
          type: [string, "null"]
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AccountCreate:
      type: object
      required: [school_id, phone, password]
      properties:
        school_id: { type: string }
        owner_user_id:
          type: string
          description: Defaults to the caller.
        phone:
          type: string
          pattern: '^1[0-9]{10}$'
        password: { type: string, minLength: 1 }
        device_code: { type: string, maxLength: 64 }
        phone_model: { type: string, maxLength: 64 }
    AccountUpdate:
      type: object
      minProperties: 1
      properties:
        phone:
          type: string
          pattern: '^1[0-9]{10}$'
        password: { type: string, minLength: 1 }
        device_code: { type: string, maxLength: 64 }
        phone_model: { type: string, maxLength: 64 }
    AccountReviewRequest:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [approve, reject]
        reason:
          type: string
          maxLength: 200
          description: |
            Required when decision is reject. The limit matches the audit
            detail limit and the accounts.reject_reason CHECK.
      if:
        properties:
          decision:
            const: reject
      then:
        required: [reason]
        properties:
          reason: { type: string, minLength: 1 }
    AccountPauseRequest:
      type: object
      description: |
        paused true pauses the account. master and admin set paused_admin; the
        owner sets paused_user. paused false resumes only the matching shape:
        master and admin resume paused_admin; the owner resumes paused_user.
        The implementation follows exactly this semantics.
      required: [paused]
      properties:
        paused: { type: boolean }
    AccountVerifyResult:
      type: object
      required: [ok, code]
      properties:
        ok: { type: boolean }
        code:
          type: string
          description: |
            success, credential_invalid, challenge, device_unbound, transient,
            unknown or rejected. A platform conclusion sets ok false and
            returns 200.
        message:
          type: string
          description: Masked platform text; absent when empty.
    AccountSignAccepted:
      type: object
      additionalProperties: false
      required: [task_id]
      properties:
        task_id: { type: string }
    AccountLocation:
      type: object
      additionalProperties: false
      required: [mode, reason]
      description: |
        The stored location policy. lng and lat are null for auto and always
        present for fixed. The reason travels to the platform only when the
        fixed point falls outside the target fence.
      properties:
        mode: { type: string, enum: [auto, fixed] }
        lng: { type: [number, "null"], format: double, minimum: -180, maximum: 180 }
        lat: { type: [number, "null"], format: double, minimum: -90, maximum: 90 }
        reason:
          type: string
          maxLength: 200
          description: Free text explaining an out-of-range fixed point; may be empty.
    AccountLocationUpdate:
      type: object
      additionalProperties: false
      required: [mode]
      description: |
        mode auto ignores and clears lng/lat; mode fixed requires both.
        The reason is stored verbatim and never audited in full.
      properties:
        mode: { type: string, enum: [auto, fixed] }
        lng: { type: number, format: double, minimum: -180, maximum: 180 }
        lat: { type: number, format: double, minimum: -90, maximum: 90 }
        reason: { type: string, maxLength: 200 }

    ScheduleWindowSource:
      type: string
      description: |
        platform and cache come from discovery; fallback is the local
        default window; override is a master or admin replacement.
      enum: [platform, cache, fallback, override]
    ScheduleWindow:
      type: object
      required: [school_id, school_name, task_id, task_name, enabled]
      properties:
        school_id: { type: string }
        school_name: { type: string }
        task_id: { type: string }
        task_name: { type: string }
        enabled: { type: boolean }
        day: { type: string, description: Business day YYYY-MM-DD. }
        start:
          type: [string, "null"]
          format: date-time
          description: Null when the window is not cached for the day yet.
        end:
          type: [string, "null"]
          format: date-time
        source:
          type: [string, "null"]
          description: |
            platform, cache, fallback or override; null when the window is not
            cached for the day.
        version: { type: integer }
    ScheduleWindowList:
      type: object
      required: [day, items]
      properties:
        day: { type: string, description: Business day the list was resolved for. }
        items:
          type: array
          items:
            $ref: '#/components/schemas/ScheduleWindow'
    SchedulePlanRequest:
      type: object
      additionalProperties: false
      required: [day, school_id, task_id]
      properties:
        day: { type: string, description: Business day YYYY-MM-DD. }
        school_id: { type: string }
        task_id: { type: string }
    SchedulePlan:
      type: object
      required:
        - day
        - source
        - window_start
        - window_end
        - version
        - capacity
        - demand
        - shortfall
        - histogram
        - rows
      properties:
        day: { type: string }
        source:
          $ref: '#/components/schemas/ScheduleWindowSource'
        window_start:
          type: string
          format: date-time
          description: Effective window start after the edge trim.
        window_end:
          type: string
          format: date-time
          description: Effective window end after the edge trim.
        version:
          type: integer
          description: Window cache version; zero in a pure preview.
        capacity:
          type: integer
          description: Attempts the window can hold with the configured channels and rate.
        demand: { type: integer }
        shortfall: { type: integer }
        histogram:
          type: object
          additionalProperties: { type: integer }
          description: Account count per five-minute slice, keyed by slice index.
        rows:
          type: array
          items:
            $ref: '#/components/schemas/ScheduleRow'
    ScheduleRow:
      type: object
      required: [account_id, run_at]
      properties:
        account_id: { type: string }
        run_at: { type: string, format: date-time }
    ScheduleOverrideRequest:
      type: object
      additionalProperties: false
      required: [day, school_id, task_id, start, end, reason]
      properties:
        day: { type: string, description: Business day YYYY-MM-DD. }
        school_id: { type: string }
        task_id: { type: string }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        reason:
          type: string
          minLength: 1
          maxLength: 200
          description: Recorded with the override for later review.
    CapacityReport:
      type: object
      required:
        - school_id
        - task_id
        - day
        - source
        - window_start
        - window_end
        - capacity
        - demand
        - shortfall
      properties:
        school_id: { type: string }
        task_id: { type: string }
        day: { type: string }
        source:
          $ref: '#/components/schemas/ScheduleWindowSource'
        window_start: { type: string, format: date-time }
        window_end: { type: string, format: date-time }
        capacity: { type: integer }
        demand: { type: integer }
        shortfall: { type: integer }
    TimePref:
      type: object
      additionalProperties: false
      required: [offset_min, allowed]
      properties:
        offset_min:
          type: [integer, "null"]
          description: Relative minute from the effective window start; multiple of five.
        allowed:
          type: boolean
          description: False when the deployment disables user time preferences.
    TimePrefUpdate:
      type: object
      additionalProperties: false
      required: [offset_min]
      properties:
        offset_min:
          type: [integer, "null"]
          description: Null clears the preference.

    Photo:
      type: object
      additionalProperties: false
      required: [id, sha256, mime, width, height, bytes, created_at]
      properties:
        id: { type: string }
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Digest of the stored (preprocessed) bytes; also the ETag.
        mime:
          type: string
          enum: [image/jpeg, image/png]
        width: { type: integer, minimum: 1 }
        height: { type: integer, minimum: 1 }
        bytes: { type: integer, format: int64, minimum: 1 }
        created_at: { type: string, format: date-time }
    PhotoPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Photo'
        next_cursor:
          type: string
          description: Cursor for the next page; empty on the last page.
    PhotoUpload:
      type: object
      additionalProperties: false
      required: [image]
      properties:
        image:
          type: string
          format: binary
          description: Original image bytes; JPEG or PNG, at most 10 MiB.
    PhotoRetention:
      type: object
      additionalProperties: false
      required: [days]
      properties:
        days:
          type: integer
          enum: [30, 90, 180, 365]
    PhotoRetentionUpdate:
      type: object
      additionalProperties: false
      required: [days]
      properties:
        days:
          type: integer
          enum: [30, 90, 180, 365]
    AccountPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Account'
        next_cursor:
          type: string
          description: Cursor for the next page; empty on the last page.
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok
