# Host API v1 — OpenAPI 3.1 contract.
#
# The frozen shape lives in contracts/README.md; this file is its machine
# readable form and the only source of the Go transport types. Regenerate the
# code with the pinned generator (v2.8.1):
#
#   ./scripts/generate.sh
#
# Conventions:
# - JSON, UTF-8, RFC3339 timestamps.
# - Auth: HttpOnly session cookie. Writes also require X-CSRF-Token.
# - Error envelope: {"error":{"code","message","details","trace_id"}}.
# - Cross-scope object: 404. Action forbidden: 403.
# - Pagination: ?cursor=&limit= (default 50, max 200).
#   Notifications are the exception: default 20, max 100.
# - No raw phone number, credential or upstream raw text in any response.
openapi: 3.1.0
info:
  title: yiban-auto-sign host API
  version: "1.0.0"
  description: |
    Host API for the account caretaking platform. Roles: master (all schools,
    admins, settings), admin (bound schools only), user (own accounts).

    Phase P1 ships the frozen shape and live use cases. Auth, password reset,
    users, schools, admins and accounts answer from their use cases.

    Versioning: this `info.version` is the API contract version; it only
    changes on a breaking contract change and is independent of the Go-line
    product release version, which lives in the repository root `VERSION`
    file and is tagged `v$VERSION` at release time (see contracts/README.md
    "Versioning" and release-check item `go-version`).
  contact:
    name: yiban-auto-sign maintainers
    url: https://github.com/frostpolaris1/yiban-auto-sign
servers:
  - url: /
tags:
  - name: auth
  - name: users
  - name: schools
  - name: admins
  - name: accounts
  - name: schedule
  - name: photos
  - name: events
  - name: settings
  - name: audit
  - name: health
security:
  - sessionCookie: []
paths:
  /api/auth/login:
    post:
      tags: [auth]
      operationId: AuthLogin
      summary: Sign in with email and password.
      description: |
        Sets the HttpOnly session cookie on success.
        Cross-site browser submissions are rejected. Sec-Fetch-Site must be
        same-origin or none; cross-site and same-site are 403 forbidden.
        When Sec-Fetch-Site is absent, a present Origin must match the
        configured public origin or the request origin; a mismatch is 403. Rate limited per client IP and per normalized email; a 429
        carries Retry-After in seconds.
      security: []
      x-roles: [public]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Session established.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionUser'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '413': { $ref: '#/components/responses/PayloadTooLargeError' }
        '429': { $ref: '#/components/responses/TooManyRequestsError' }
        default: { $ref: '#/components/responses/DefaultError' }
  /api/auth/logout:
    post:
      tags: [auth]
      operationId: AuthLogout
      summary: Destroy the current session.
      description: |
        Idempotent. A request without a session is a no-op and needs no CSRF
        token, because no authority is carried. A request with a session must
        send X-CSRF-Token.
      security: []
      x-roles: [public]
      parameters:
        - $ref: '#/components/parameters/CSRFTokenOptional'
      responses:
        '204': { description: Session destroyed. }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        default: { $ref: '#/components/responses/DefaultError' }
  /api/auth/me:
    get:
      tags: [auth]
      operationId: AuthMe
      summary: Return the signed-in user and the CSRF token.
      description: |
        Returns the signed-in user and the CSRF token that writes must send.
        A request without a session answers 401.
      x-roles: [master, admin, user]
      responses:
        '200':
          description: Current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionUser'
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        default: { $ref: '#/components/responses/DefaultError' }
  /api/auth/forgot-password:
    post:
      tags: [auth]
      operationId: AuthForgotPassword
      summary: Start the password reset flow.
      description: |
        Always returns 204, whether or not the email exists, to avoid account
        enumeration. A one-time token row is written only for known accounts.
        Rate limited per client IP; a 429 carries Retry-After in seconds.
      security: []
      x-roles: [public]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '204': { description: Request accepted. }
        '400': { $ref: '#/components/responses/ValidationError' }
        '413': { $ref: '#/components/responses/PayloadTooLargeError' }
        '429': { $ref: '#/components/responses/TooManyRequestsError' }
        default: { $ref: '#/components/responses/DefaultError' }
  /api/auth/reset-password:
    post:
      tags: [auth]
      operationId: AuthResetPassword
      summary: Finish the password reset flow with a one-time token.
      description: |
        Consumes the token, replaces the password, revokes every session of the
        user and marks must_change_password false. The token is checked before
        the new password is hashed. Rate limited per client IP and per token
        digest; a 429 carries Retry-After in seconds.
      security: []
      x-roles: [public]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '204': { description: Password replaced. }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '413': { $ref: '#/components/responses/PayloadTooLargeError' }
        '429': { $ref: '#/components/responses/TooManyRequestsError' }
        default: { $ref: '#/components/responses/DefaultError' }
  /api/auth/change-password:
    post:
      tags: [auth]
      operationId: AuthChangePassword
      summary: Change the password of the signed-in user.
      description: |
        Verifies current_password, then replaces it with new_password.
        Success sets must_change_password false and writes password_changed_at.
        Success revokes every other session of the user and keeps the calling
        session. Success writes one auth.password_change audit row.
        A wrong current_password is 401 with the same code and message as a
        failed login, so the two are indistinguishable.
        Rate limited per client IP and per user; a 429 carries Retry-After.
        A new_password equal to current_password is 409 conflict.
        Both fields are non-empty. The minimum length matches
        POST /api/auth/reset-password.
      x-roles: [master, admin, user]
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204': { description: Password replaced. }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '409': { $ref: '#/components/responses/ConflictError' }
        '413': { $ref: '#/components/responses/PayloadTooLargeError' }
        '429': { $ref: '#/components/responses/TooManyRequestsError' }
        default: { $ref: '#/components/responses/DefaultError' }
  /api/auth/registration:
    get:
      tags: [auth]
      operationId: AuthRegistration
      summary: Report whether public registration is open.
      description: |
        Public. enabled is false by default. terms_version and
        privacy_version identify the agreement text the client must show;
        a register request must echo the same values.
      security: []
      x-roles: [public]
      responses:
        '200':
          description: Registration status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationStatus'
        default: { $ref: '#/components/responses/DefaultError' }
    put:
      tags: [auth]
      operationId: AuthRegistrationSet
      summary: Open or close public registration.
      description: |
        Master only. Writes one settings.registration audit row.
        The response is the new status, with the current agreement versions.
      x-roles: [master]
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationSetRequest'
      responses:
        '200':
          description: Registration status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationStatus'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '413': { $ref: '#/components/responses/PayloadTooLargeError' }
        default: { $ref: '#/components/responses/DefaultError' }
  /api/auth/register:
    post:
      tags: [auth]
      operationId: AuthRegister
      summary: Create a user account and sign in.
      description: |
        Public. Answers 403 while registration is closed. Both agreement
        booleans must be true and the versions must equal the current ones;
        a stale version is 409 conflict. The password needs at least 10
        characters and two of uppercase, lowercase, digits and symbols.
        A duplicate live email is 409 conflict. The new user has role user,
        status active and must_change_password false. Success sets the
        session cookie. Cross-site browser submissions are rejected like
        login. Rate limited per client IP and per normalized email; a 429
        carries Retry-After in seconds.
      security: []
      x-roles: [public]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created and session established.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionUser'
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '409': { $ref: '#/components/responses/ConflictError' }
        '413': { $ref: '#/components/responses/PayloadTooLargeError' }
        '429': { $ref: '#/components/responses/TooManyRequestsError' }
        default: { $ref: '#/components/responses/DefaultError' }
  /api/users:
    get:
      tags: [users]
      operationId: UserList
      summary: List users with cursor pagination.
      description: |
        Master only. By default soft-deleted users never appear; pass
        include_deleted to include them, each carrying a non-null
        deleted_at. role, status and q narrow the result. q matches the
        start of the email address and never matches a name. A query
        longer than 254 characters is 400: no address can be that long,
        so no row can match.
        The ETag is the sha256 of the response body (quoted hex). The 304
        answer is decided after authentication and scope resolution, so a
        request that cannot read this page never gets a 304. If-None-Match
        honours the weak comparison, comma lists and `*`; repeated header
        lines are merged per RFC 9110 section 5.3.
      x-roles: [master]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: role
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/UserRole'
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/UserStatus'
        - name: q
          in: query
          required: false
          description: |
            Email prefix. Matching is case-insensitive because stored
            addresses are lower case. Wildcards in the value are literal.
          schema: { type: string }
        - name: group
          in: query
          required: false
          description: |
            Live-user group derived from the user's live accounts:
            - pending: at least one pending or rejected account;
            - normal: no pending/rejected account and at least one account;
            - vacant: no live account.
            UserPage.counts covers all live users and does not change with
            this parameter. group cannot be combined with include_deleted
            true; that combination answers 400.
          schema:
            type: string
            enum: [pending, normal, vacant]
        - name: include_deleted
          in: query
          required: false
          description: |
            Include soft-deleted users. Defaults to false, so the default
            behavior is unchanged: soft-deleted users never appear.
            Deleted rows carry deleted_at and keep their status value.
            Cannot be combined with group.
          schema: { type: boolean }
        - name: If-None-Match
          in: header
          required: false
          description: |
            ETag(s) the client already holds; a match answers 304.
            Weak comparison, comma lists and `*` are honoured.
          schema: { type: string }
      responses:
        '200':
          description: User page.
          headers:
            ETag:
              description: Strong validator of the response body (quoted sha256).
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '304':
          description: Not modified (ETag matched); no body.
          headers:
            ETag:
              description: Strong validator of the response body (quoted sha256).
              schema: { type: string }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        default: { $ref: '#/components/responses/DefaultError' }
    post:
      tags: [users]
      operationId: UserCreate
      summary: Create a master, admin or user account.
      description: |
        Master only (decision 12.4). Public registration creates role user
        accounts through POST /api/auth/register; this endpoint remains the
        only way to create a master or admin. The password is stored as an
        argon2id hash. A duplicate email among live users is a 409; a
        soft-deleted user's email may be reused.
      x-roles: [master]
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: User created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '409': { $ref: '#/components/responses/ConflictError' }
        '413': { $ref: '#/components/responses/PayloadTooLargeError' }
        '429': { $ref: '#/components/responses/DefaultError' }
        default: { $ref: '#/components/responses/DefaultError' }
  /api/users/lookup:
    get:
      tags: [users]
      operationId: UserLookup
      summary: Restricted user search for owner pickers.
      description: |
        Master and admin only. Matches the start of the email address;
        matching is case-insensitive because stored addresses are lower
        case. Soft-deleted users never match. Each item carries only the
        id, the masked email and the status: the full address, the role
        and the timestamps never leave the server. No cursor: a picker
        takes the first limit rows in email order. With exact=true the
        query is the whole address, not a prefix: an owner picker that
        binds by id must use it, because masked rows are visually
        indistinguishable and a prefix can rank the wrong user first.
        This is a static path segment next to /api/users/{id}; the other
        methods on /api/users/lookup are matched by the {id} route and
        answer 404 for the literal id "lookup".
      x-roles: [master, admin]
      parameters:
        - name: q
          in: query
          required: true
          description: Email prefix; wildcards in the value are literal.
          schema: { type: string, minLength: 1, maxLength: 254 }
        - name: limit
          in: query
          required: false
          description: Page size. Defaults to 20.
          schema: { type: integer, minimum: 1, maximum: 200, default: 20 }
        - name: exact
          in: query
          required: false
          description: |
            When true, q is matched as the whole (normalized) email and the
            result is at most one row. Defaults to false: the prefix search.
          schema: { type: boolean }
      responses:
        '200':
          description: Lookup page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserLookupPage'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        default: { $ref: '#/components/responses/DefaultError' }
  /api/users/{id}:
    patch:
      tags: [users]
      operationId: UserUpdate
      summary: Change a user's role or status.
      description: |
        Master only. A soft-deleted user is 404. Lowering the role of, or
        disabling, the last active master is 409: at any moment there must
        be at least one active master row that is not soft-deleted. A
        disabled master cannot sign in, so it is not a recovery path and
        does not count. A role change writes one user.role_change audit
        row and a status change writes user.disable or user.enable; both
        take effect from the next request because sessions resolve the
        user row every time.
        Every request must carry current_password, the acting user's own
        login password: a missing value answers 400, a wrong value 403,
        and repeated failures answer 429. A rejected reauthentication
        writes nothing.
      x-roles: [master]
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: User updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '409': { $ref: '#/components/responses/ConflictError' }
        '413': { $ref: '#/components/responses/PayloadTooLargeError' }
        '429': { $ref: '#/components/responses/TooManyRequestsError' }
        default: { $ref: '#/components/responses/DefaultError' }
    delete:
      tags: [users]
      operationId: UserDelete
      summary: Soft-delete a user.
      description: |
        Master only. A user cannot delete their own account (403).
        A user who still owns live accounts is 409: transfer or delete
        the accounts first. Deleting the last active master is also 409:
        the active-master invariant covers deletion. Success soft-deletes
        the row, revokes every
        session of that user and writes one user.delete audit row. The
        row keeps its email; a later restore can conflict with a live
        user that has taken the address.
        Every request must carry current_password, the acting user's own
        login password: a missing value answers 400, a wrong value 403,
        and repeated failures answer 429. A rejected reauthentication
        writes nothing.
      x-roles: [master]
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        description: |
          The envelope is optional in the schema for wire compatibility;
          the server still requires current_password and answers 400 when
          it is missing.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserDeleteRequest'
      responses:
        '204': { description: User soft-deleted. }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '409': { $ref: '#/components/responses/ConflictError' }
        '413': { $ref: '#/components/responses/PayloadTooLargeError' }
        '429': { $ref: '#/components/responses/TooManyRequestsError' }
        default: { $ref: '#/components/responses/DefaultError' }
  /api/users/{id}/password-reset:
    post:
      tags: [users]
      operationId: UserPasswordReset
      summary: Reset a user's password to a one-time temporary password.
      description: |
        Master only. A master cannot reset their own password (403) so a
        lost display of the one-time secret cannot lock the operator out.
        Success replaces the password hash, sets must_change_password,
        revokes every session of that user and writes one
        user.password_reset audit row without the secret. temp_password
        appears exactly once, in this response; it is never stored or
        returned again.
        Every request must carry current_password, the acting user's own
        login password: a missing value answers 400, a wrong value 403,
        and repeated failures answer 429. A rejected reauthentication
        writes nothing.
      x-roles: [master]
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        description: |
          The envelope is optional in the schema for wire compatibility;
          the server still requires current_password and answers 400 when
          it is missing.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPasswordResetRequest'
      responses:
        '200':
          description: Temporary password. Shown once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserTempPassword'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '413': { $ref: '#/components/responses/PayloadTooLargeError' }
        '429': { $ref: '#/components/responses/TooManyRequestsError' }
        default: { $ref: '#/components/responses/DefaultError' }
  /api/users/{id}/restore:
    post:
      tags: [users]
      operationId: UserRestore
      summary: Restore a soft-deleted user.
      description: |
        Master only. Restoring a live or unknown user is 404. The restored
        row keeps its role, status and email; if a live user has taken the
        address the partial unique index rejects it with 409. Restoring
        above the live-user capacity is 429. Sessions were revoked when
        the user was deleted, so the user must sign in again.
      x-roles: [master]
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: User restored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '409': { $ref: '#/components/responses/ConflictError' }
        '429': { $ref: '#/components/responses/TooManyRequestsError' }
        default: { $ref: '#/components/responses/DefaultError' }
  /api/schools:
    get:
      tags: [schools]
      operationId: SchoolList
      summary: List schools with cursor pagination.
      description: |
        master sees every school; admin sees bound schools; user sees active
        schools only. The page follows cursor pagination.
      x-roles: [master, admin, user]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: |
            School page. master sees every school; admin sees only bound
            schools; user sees only active schools.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchoolPage'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        default: { $ref: '#/components/responses/DefaultError' }
    post:
      tags: [schools]
      operationId: SchoolCreate
      summary: Create a school.
      description: |
        master only. A duplicate school code answers 409 with a conflict
        envelope.
      x-roles: [master]
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchoolCreate'
      responses:
        '201':
          description: School created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/School'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '409': { $ref: '#/components/responses/ConflictError' }
        '413': { $ref: '#/components/responses/PayloadTooLargeError' }
        default: { $ref: '#/components/responses/DefaultError' }
  /api/schools/{id}:
    patch:
      tags: [schools]
      operationId: SchoolUpdate
      summary: Update school name, status or time zone.
      description: The school code is immutable in v1.
      x-roles: [master]
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/SchoolID'
