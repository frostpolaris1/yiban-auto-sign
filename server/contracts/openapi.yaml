        master only. Unbinds the admin from the school and keeps the user
        account. A missing binding answers 404.
      x-roles: [master]
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/SchoolID'
        - $ref: '#/components/parameters/UserID'
      responses:
        '204': { description: Admin unbound. }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
