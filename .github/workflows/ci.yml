name: CI

# PR 门禁：独立于 .github/workflows/signin.yml（后者是定时签到服务自动化）
# 触发：向 server-web / main 提 PR，或向这两个分支 push
on:
  pull_request:
    branches: [server-web, main]
  push:
    branches: [server-web, main]

# 最小权限：仅读取代码与 PR 元数据
permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.x

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.x
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install dependencies (locked)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      # 提交/PR 标题规范校验（Conventional Commits）
      # 不符合 feat/fix/docs/... 前缀则门禁失败。
      # 已固定为完整 commit SHA（2026-08-22 M10，防可变 tag 被篡改）。
      - name: Validate PR title
        if: github.event_name == 'pull_request'
        uses: amannn/action-semantic-pull-request@e32d7e603df1aa1ba07e981f2a23455dee596825 # v5.x
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ---- Lint（按需启用） ----
      # 项目若引入 ruff / flake8 / black，取消注释并填入命令：
      # - name: Lint
      #   run: ruff check .

      # ---- Test（按需启用） ----
      # 现有 tests/ 目录可接上 pytest；取消注释启用：
      # - name: Test
      #   run: pytest -q

      - name: Gate ready
        run: echo "CI gate active; enable lint/test above when available."
