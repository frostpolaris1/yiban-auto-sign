name: CI

# PR 门禁（signin.yml 定时签到与 mirror.yml Gitee 镜像已删除，MF-106：前者危险且
# secret 不存在，后者首日即坏；gitee 同步改为人工 push 维护，历史可从 git 找回）
# 触发：向 develop / server-web / main 提 PR 或 push；feature 分支只跑 push；
# 另有 workflow_dispatch 手动触发（改 workflow 自身时先手动跑一遍验证）
# （分支模型见 PROMPT.md §6.11：功能在 feature/*，汇入 develop，发布走 release/* 或部署分支）
on:
  workflow_dispatch:
  pull_request:
    branches: [develop, server-web, main]
  push:
    branches: [develop, server-web, main, 'feature/**']

# 最小权限：仅读取代码与 PR 元数据
permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install dependencies (locked)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          # 开发/门禁工具：与运行依赖分离，锁定版本保证 CI 可复现
          # ruff 0.16.6 = 与本地 WSL 门禁（~/.venv-yiban-wsl）逐字对齐（MF-106：
          # 旧钉 0.15.22 与本地漂移，同一份代码两套编辑器判出不同结果）
          # pytest 9.1.1 = 含 CVE-2025-71176 修复（0~9.0.3 受影响）
          # pytest-xdist = 并发跑测试（-n auto 按 CI 核数分发；单测各自隔离临时目录）
          pip install ruff==0.16.6 pytest==9.1.1 pytest-xdist==3.8.0

      # 提交/PR 标题规范校验（Conventional Commits）
      # 不符合 feat/fix/docs/... 前缀则门禁失败。
      # 已固定为完整 commit SHA（2026-08-22 M10，防可变 tag 被篡改）。
      - name: Validate PR title
        if: github.event_name == 'pull_request'
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ---- Lint ----
      # 与本地门禁命令逐字一致（含 web/：旧命令漏 web/ 曾藏 2 处 RUF100，MF-39）
      - name: Lint (ruff)
        run: ruff check yiban/ tests/ scripts/ web/ --quiet

      # ---- Test ----
      # 单元/回归测试（tests/，pyproject.toml testpaths=["tests"]）
      # -n auto：按 runner 核数并发（GitHub 默认 2 核 → 提速约 2 倍）
      # --dist loadfile：**按文件**分发、文件内保持原顺序。默认分发（按单条测试）会把
      #   同一个类拆到不同 worker，叠加进程级 DB 连接单例，导致确定性失败
      #   （test_web_security_gates 的 cookie path 用例报 401）；本套测试原本按
      #   "同文件内用例有先后依赖"写就，故必须用 loadfile。
      - name: Test (pytest)
        run: pytest -q -n auto --dist loadfile

      - name: Gate ready
        run: echo "Lint + Test gate active."
