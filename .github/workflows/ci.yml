name: CI

# PR 门禁：独立于 .github/workflows/signin.yml（后者是定时签到服务自动化）
# 触发：向 server-web / main 提 PR，或向这两个分支 push
on:
  pull_request:
    branches: [server-web, main]
  push:
    branches: [server-web, main]

# 最小权限：仅读取代码与 PR 元数据
permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install dependencies (locked)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          # 开发/门禁工具：与运行依赖分离，锁定版本保证 CI 可复现
          # ruff 0.15.22 = 0.15 系列最终版（0.16 起默认规则集大改，待迁移后再升）
          # pytest 9.1.1 = 含 CVE-2025-71176 修复（0~9.0.3 受影响）
          # pytest-xdist = 并发跑测试（-n auto 按 CI 核数分发；单测各自隔离临时目录）
          pip install ruff==0.15.22 pytest==9.1.1 pytest-xdist==3.8.0

      # 提交/PR 标题规范校验（Conventional Commits）
      # 不符合 feat/fix/docs/... 前缀则门禁失败。
      # 已固定为完整 commit SHA（2026-08-22 M10，防可变 tag 被篡改）。
      - name: Validate PR title
        if: github.event_name == 'pull_request'
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ---- Lint ----
      - name: Lint (ruff)
        run: ruff check .

      # ---- Test ----
      # 单元/回归测试（tests/，pyproject.toml testpaths=["tests"]）
      # -n auto：按 runner 核数并发（GitHub 默认 2 核 → 提速约 2 倍）
      - name: Test (pytest)
        run: pytest -q -n auto

      - name: Gate ready
        run: echo "Lint + Test gate active."
