name: CI

# fast 轨（push/PR）：Lint + 安全子集 + e2e smoke + **依赖漏洞审计（pip-audit）**，
# 前三项目标 ≤3min 含 setup（审计为并行独立 job，不在关键路径上）。
# 全量轨独立为 nightly.yml（schedule 06:00 UTC / 14:00 北京）——拆成两文件而非同文件两 job，
# 理由：schedule 是 workflow 级触发，若与 fast job 同文件则必须给 fast job 加
# `if: github.event_name != 'schedule'` 的事件守卫，语义更脆；两文件让每个 workflow 的
# 触发条件各自诚实，且 nightly 可用独立的 timeout/并行度。（取舍全文见
# .superpowers/sdd/m3-batch1-plan-20260925/task-1-report.md）
# ⚠️ 排程定义点：GitHub 的 `schedule` **只在默认分支上生效**
# （本仓库默认分支 = main）——所以 `nightly.yml` 与 `e2e-nightly.yml` 的**唯一定义点在
# 默认分支 main**，**develop 分支不持有这两个文件**（此前在 develop = 同一事实两个定义
# 点，必然漂移）。两文件的 `actions/checkout` 显式 `ref: develop`：被测对象是活跃线
# develop——main 是"对外默认可见的已验证分支"、天然落后（见 docs/dev/release-gate.md）；
# e2e-nightly 的前端步骤随旧线退役在 main 上同步（PR3）。
# 两条不许破：① 不许把这两个文件加回 develop；② 不许把 checkout 的 `ref` 改成 main
# （nightly 变成跑旧线、e2e 直接失败）。
# 触发：向 develop / server-web / main 提 PR 或 push；feature 分支只跑 push；
# 另有 workflow_dispatch 手动触发（改 workflow 自身时先手动跑一遍验证）
# （分支模型：功能在 feature/*，汇入 develop，发布走 release/* 或部署分支）
on:
  workflow_dispatch:
  pull_request:
    branches: [develop, server-web, main]
  push:
    branches: [develop, server-web, main, 'feature/**']

# 同一 ref 的连续推送只保留最新一次：旧 run 排队/占 runner 会直接顶掉快轨 ≤3min 目标，
# 且"最新一次绿"会被旧 run 的结果干扰（P13-10）。与 deploy-gate.yml 同口径。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 最小权限：仅读取代码与 PR 元数据
permissions:
  contents: read
  pull-requests: read

jobs:
  # job 名保持 verify（不改成 fast）：仓库分支保护/必需检查可能按 job 名引用，
  # 改名会让必需检查静默失效。若确要改名，先在 GitHub 设置里同步更新（批 1 约束 6）。
  verify:
    runs-on: ubuntu-latest
    # 旧线混合面（mixed）实测：套件 ~6.5 分钟 + 门 ~2 分钟 + 装依赖 ~1.5 分钟，
    # 原 10 分钟上限会在套件刚跑完时把作业判成 cancelled（PR #256 实测）。
    # 上限不代表目标：快面（newstack/shared）仍在 1.5 分钟左右结束。
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install gate tools
        run: |
          python -m pip install --upgrade pip
          # 门禁工具钉版：ruff/pytest/pytest-xdist 三个足够跑 Python 面。
          pip install ruff==0.16.6 pytest==9.1.1 pytest-xdist==3.8.0

      # 提交/PR 标题规范校验（Conventional Commits）
      # 不符合 feat/fix/docs/... 前缀则门禁失败。
      # 已固定为完整 commit SHA（2026-08-22 M10，防可变 tag 被篡改）。
      - name: Validate PR title
        if: github.event_name == 'pull_request'
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ---- 关键子集：本地与 CI 同源（scripts/dev-verify.sh --ci） ----
      # 为什么收成一步：跑法此前有两个入口（CI 内联一份、本地各人一套），两位负责人
      #   分组跑法不同会产出伪红。现在命令原文只存在仓内入口脚本里一份，CI 只调它的
      #   子集模式；本地全量（`bash scripts/dev-verify.sh`）与这条子集共用同一个脚本。
      # 命令原文只住 scripts/dev-verify.sh 的 run_ci 一份；CI 不复制语义。
      # 旧线退役后不再有 scope 分类：Python 面只跑新栈门与 tests/。
      # 改动面由流水线自身决定，不按旧路径跳过。
      # 护栏：tests/test_dev_verify_entry.py 与 tests/test_public_exposure_gate_wiring.py。
      - name: Gate subset (scripts/dev-verify.sh --ci)
        run: bash scripts/dev-verify.sh --ci

      - name: Gate ready
        # 收尾回执不枚举子集内容，避免第二定义点。
        run: 'echo "Fast gate active: the step list in this job is the single source; this receipt does not enumerate it."'

  # ---- 工具链快门：actionlint / shellcheck / golangci / govulncheck / npm audit ----
  # 五道检查都看静态事实，不跑产品测试；与 verify/stacks 并行，不占关键路径。
  # 脚本是唯一入口（本地同一条命令）；本 job 只负责装钉版工具。
  # 分支保护要把 tooling-gate 勾成 required check（仓库设置，代码改不了）。
  # 工具版本钉住：门禁工具漂移会让"昨天绿今天红"分不清是漏洞库更新还是工具行为变化。
  # govulncheck 用 1.27.x（与 go.mod 的 toolchain 行同值）：stdlib 漏洞修在补丁版。
  tooling-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27.x'
          cache-dependency-path: server/go.sum

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install pinned tooling
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Tooling gate
        run: bash scripts/tooling-gate.sh

  # ---- 契约门：spectral lint ＋ oasdiff breaking ----
  # 只在 server/contracts/ 改动时真跑；其余 PR 显性早退（跳过必须可见）。
  # 与 ui-e2e 同一套步骤级判定：作业级 if 为假时作业不被调度，required check 的
  # 语义有歧义。底本口径：PR 取目标分支尖端、push 取 event.before（浅拉一层）。
  # 比较对是「底本 → 本分支」；若目标分支先行改了契约，本分支要先合并/变基再比。
  # 工具钉版：spectral 6.17.0（server/contracts/tools/package-lock.json）；
  # oasdiff v1.35.0（下面 go install）。npm 安装用 --ignore-scripts 阻断 postinstall 联网。
  # 取不到 base 分两种：PR 事件（底本是必需输入）让入口脚本 exit 2；push 事件置空，
  # spectral 照跑、oasdiff 显性 SKIP。push 的 SKIP 进 stdout 与 step summary；
  # PR 的 fail-closed 走 stderr 退出。
  # 接线由 tests/test_contract_gate_wiring.py 钉住（真调用判据：注释与 echo 不算）。
  contract-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Classify change surface
        id: scope
        # base_ref / event.before 是外部输入：先映射成 env，再在 shell 里以带引号
        # 变量使用。表达式直接插进 run 会被 GitHub 展开成裸文本、不经 shell 转义，
        # 因此构成注入面（git fetch 的参数可被分支名影响）。
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          # base：PR 事件取 base 分支尖端（浅拉一层），push 事件取 event.before。
          # 与 verify / ui-e2e 的 Classify 步骤同一写法。
          if [ -n "$BASE_REF" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_REF" >/dev/null 2>&1 || true
            base="FETCH_HEAD"
          else
            base="$BEFORE_SHA"
            if [ -n "$base" ]; then git fetch --no-tags --depth=1 origin "$base" >/dev/null 2>&1 || true; fi
          fi
          # base 不可解析时分两种：
          #   PR 事件（base_ref 非空）→ 底本是必需输入，保留原值交给入口脚本 exit 2（fail-closed）。
          #   push 事件（如新分支）→ 没有可比底本，置空并显性 SKIP oasdiff（不伪造底本）。
          base_ok=0
          if git rev-parse --verify "$base" >/dev/null 2>&1; then
            base_ok=1
          elif [ -n "$BASE_REF" ]; then
            base="origin/$BASE_REF"
          else
            base=""
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          # 取不到 base、base 不可解析或 diff 失败 → 默认跑（fail-closed：宁可白跑，不静默漏跑）。
          if [ -z "$base" ]; then
            echo "value=run" >> "$GITHUB_OUTPUT"
            echo "reason=no-base" >> "$GITHUB_OUTPUT"
          elif [ "$base_ok" = "0" ]; then
            echo "value=run" >> "$GITHUB_OUTPUT"
            echo "reason=base-unresolved" >> "$GITHUB_OUTPUT"
          elif ! changed=$(git diff --name-only "$base" HEAD 2>/dev/null); then
            echo "value=run" >> "$GITHUB_OUTPUT"
            echo "reason=diff-failed" >> "$GITHUB_OUTPUT"
          elif printf '%s\n' "$changed" | grep -E '^server/contracts/' >/dev/null 2>&1; then
            echo "value=run" >> "$GITHUB_OUTPUT"
            echo "reason=contracts-changed" >> "$GITHUB_OUTPUT"
          else
            echo "value=skip" >> "$GITHUB_OUTPUT"
            echo "reason=no-contract-changes" >> "$GITHUB_OUTPUT"
          fi

      # 非契约改动：作业照常调度、显性早退。同一行进 stdout 与 step summary。
      - name: Skip (out of change surface)
        if: steps.scope.outputs.value == 'skip'
        run: |
          line="contract-gate SKIP (scope=${{ steps.scope.outputs.reason }}: no server/contracts/ file changed vs base)"
          echo "$line"
          echo "$line" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Node
        if: steps.scope.outputs.value != 'skip'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/contracts/tools/package-lock.json

      - name: Set up Go (oasdiff)
        if: steps.scope.outputs.value != 'skip'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27.x'
          cache-dependency-path: server/go.sum

      - name: Install pinned spectral
        if: steps.scope.outputs.value != 'skip'
        run: npm ci --prefix server/contracts/tools --ignore-scripts --no-audit --no-fund

      - name: Install pinned oasdiff
        if: steps.scope.outputs.value != 'skip'
        run: |
          go install github.com/oasdiff/oasdiff@v1.35.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Contract gate
        if: steps.scope.outputs.value != 'skip'
        run: bash scripts/contract-gate.sh --base "${{ steps.scope.outputs.base }}"

  # 新栈（Go 后端 + React 前端）的自动门。与 verify job 分开：
  # Python 旧栈与 Go/React 新栈的依赖与工具链不同，混在一个 job 里会让
  # 任一栈的安装失败拖垮另一栈。本 job 只调同一个本地入口
  # `bash scripts/verify-stacks.sh`；执行点只住该脚本一份，测试只做
  # 逐字冻结断言（tests/test_stacks_ci_wiring.py::StacksCiWiringTest），
  # 不复制命令语义。
  # 视觉回归不在本 job：基线目前只有 win32（见 ui/README.md），Linux 基线未生成。
  stacks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The database layer has e2e tests that need a real PostgreSQL 18: partial
    # indexes, advisory locks, FK RESTRICT and append-only triggers have no
    # honest in-process substitute. Without this service the tests skip, so the
    # service is what makes the database gates real in CI.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: yiban
          POSTGRES_PASSWORD: yiban
          POSTGRES_DB: yiban
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yiban -d yiban"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # npm ci 必须先做：入口脚本只跑 `npm run verify`，不在门禁里联网装依赖。
      - name: Install UI dependencies (locked)
        working-directory: ui
        run: npm ci

      # 真调入口脚本（不是内联命令）。命令原文只存在 scripts/verify-stacks.sh；
      # tests/test_stacks_ci_wiring.py::StacksCiWiringTest 钉住这条执行行。
      - name: New-stack gates (scripts/verify-stacks.sh)
        env:
          YIBAN_TEST_DATABASE_URL: postgres://yiban:yiban@127.0.0.1:5432/yiban?sslmode=disable
        run: bash scripts/verify-stacks.sh

  # ---- 新线 UI 的 Playwright e2e ----
  # 为什么独立作业（不进 stacks）：stacks 的 15 分钟上限已装满 Go 门与 UI verify；
  # e2e 还要 build ＋ 浏览器安装 ＋ 两条分片，塞进去只会互相顶爆超时。独立作业与
  # stacks 并行，总墙钟不变。
  # 为什么改动面用**步骤级**判定而不是作业级 `if`：作业级 `if` 为假时作业不被调度，
  # 分支保护里呈现 Expected / waiting 状态，required check 的语义有歧义。步骤级判定
  # 让作业照常调度：非 ui 改动时早退，并在 stdout 与 $GITHUB_STEP_SUMMARY 打印显性
  # `ui-e2e SKIP` 行（跳过必须显性可见）。
  # base 取法与 verify 的 Classify change surface 步骤逐字一致（浅拉一层
  # 取尖端，不按 SHA 拉）。过滤口径 `^(ui/|server/contracts/)`：ui/e2e 的全部 API 由
  # page.route 假端点提供，不需要 Go 后端，server/ 其余改动不触发；但 openapi 契约
  # 改字段会改前端类型与页面，故 server/contracts/ 算触发面。
  # 取不到 base 或 diff 失败 → 默认跑（fail-closed：宁可白跑，不静默漏跑）。
  # 接线由 tests/test_ui_e2e_ci_wiring.py 钉住（真调用判据：注释与 echo 不算）。
  # 视觉基线 win32 与 linux 两套都在库（ui/README.md），runner 读 -chromium-linux.png。
  ui-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [behavior, shots]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Classify change surface
        id: scope
        # base_ref / event.before 是外部输入：先映射成 env，再在 shell 里以带引号
        # 变量使用。表达式直接插进 run 会被 GitHub 展开成裸文本、不经 shell 转义，
        # 因此构成注入面（git fetch 的参数可被分支名影响）。
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          # base：PR 事件取 base 分支尖端（浅拉一层），push 事件取 event.before。
          # 与 verify 的 Classify 步骤同一写法；取不到 base 或 diff 失败即默认跑（fail-closed）。
          if [ -n "$BASE_REF" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_REF" >/dev/null 2>&1 || true
            base="FETCH_HEAD"
          else
            base="$BEFORE_SHA"
            if [ -n "$base" ]; then git fetch --no-tags --depth=1 origin "$base" >/dev/null 2>&1 || true; fi
          fi
          # 取不到 base → 默认跑（fail-closed）。
          if [ -z "$base" ] || ! git rev-parse --verify "$base" >/dev/null 2>&1; then
            echo "value=run" >> "$GITHUB_OUTPUT"
            echo "reason=no-base" >> "$GITHUB_OUTPUT"
          # diff 本身失败 → 默认跑（fail-closed）。
          elif ! changed=$(git diff --name-only "$base" HEAD 2>/dev/null); then
            echo "value=run" >> "$GITHUB_OUTPUT"
            echo "reason=diff-failed" >> "$GITHUB_OUTPUT"
          elif printf '%s\n' "$changed" | grep -E '^(ui/|server/contracts/)' >/dev/null 2>&1; then
            echo "value=run" >> "$GITHUB_OUTPUT"
            echo "reason=ui-or-contracts-changed" >> "$GITHUB_OUTPUT"
          else
            echo "value=skip" >> "$GITHUB_OUTPUT"
            echo "reason=no-ui-changes" >> "$GITHUB_OUTPUT"
          fi

      # 非 ui 改动：作业照常调度、显性早退。同一行进 stdout 与 step summary。
      - name: Skip (out of change surface)
        if: steps.scope.outputs.value == 'skip'
        run: |
          line="ui-e2e SKIP (scope=${{ steps.scope.outputs.reason }}: no ui/ or server/contracts/ file changed vs base)"
          echo "$line"
          echo "$line" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Node
        if: steps.scope.outputs.value != 'skip'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies (locked)
        if: steps.scope.outputs.value != 'skip'
        working-directory: ui
        run: npm ci

      # 4173 webServer 只伺服 dist、不自动构建（ui/playwright.config.ts）⇒ build 必须先于测试。
      - name: Build UI
        if: steps.scope.outputs.value != 'skip'
        working-directory: ui
        run: npm run build

      # 浏览器二进制缓存：key 绑 ui/package-lock.json（Playwright 版本随 lock 走）。
      - name: Cache Playwright browsers
        if: steps.scope.outputs.value != 'skip'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('ui/package-lock.json') }}

      - name: Install Playwright browser (chromium)
        if: steps.scope.outputs.value != 'skip'
        working-directory: ui
        run: npx playwright install --with-deps chromium

      - name: E2E behavior shard
        if: steps.scope.outputs.value != 'skip' && matrix.shard == 'behavior'
        working-directory: ui
        run: npm run test:behavior

      - name: E2E shots shard
        if: steps.scope.outputs.value != 'skip' && matrix.shard == 'shots'
        working-directory: ui
        run: npm run test:shots

      # trace = retain-on-failure（ui/playwright.config.ts）：只有失败才有东西可传。
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-e2e-results-${{ matrix.shard }}
          path: ui/test-results/
          if-no-files-found: ignore
