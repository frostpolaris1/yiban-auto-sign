name: CI

# fast 轨（push/PR）：Lint + 安全子集 + e2e smoke + **依赖漏洞审计（pip-audit）**，
# 前三项目标 ≤3min 含 setup（审计为并行独立 job，不在关键路径上）。
# 全量轨独立为 nightly.yml（schedule 06:00 UTC / 14:00 北京）——拆成两文件而非同文件两 job，
# 理由：schedule 是 workflow 级触发，若与 fast job 同文件则必须给 fast job 加
# `if: github.event_name != 'schedule'` 的事件守卫，语义更脆；两文件让每个 workflow 的
# 触发条件各自诚实，且 nightly 可用独立的 timeout/并行度。（取舍全文见
# .superpowers/sdd/m3-batch1-plan-20260925/task-1-report.md）
# ⚠️ 排程定义点（M24 已修，2026-10-05）：GitHub 的 `schedule` **只在默认分支上生效**
# （本仓库默认分支 = main）——所以 `nightly.yml` 与 `e2e-nightly.yml` 的**唯一定义点在
# 默认分支 main**，**develop 分支不持有这两个文件**（此前在 develop = 同一事实两个定义
# 点，必然漂移）。两文件的 `actions/checkout` 显式 `ref: develop`：被测对象是活跃线
# develop——main 是"对外默认可见的已验证分支"、天然落后（见 docs/dev/release-gate.md
# §1）；e2e-nightly 还依赖当前只在 develop 上的 `frontend/`。
# 两条不许破：① 不许把这两个文件加回 develop；② 不许把 checkout 的 `ref` 改成 main
# （nightly 变成跑旧线、e2e 直接失败）。回潮守卫见
# tests/test_ci_dependency_audit_gate.py::ScheduledWorkflowDefinitionPointTest。
# 触发：向 develop / server-web / main 提 PR 或 push；feature 分支只跑 push；
# 另有 workflow_dispatch 手动触发（改 workflow 自身时先手动跑一遍验证）
# （分支模型见 PROMPT.md §6.11：功能在 feature/*，汇入 develop，发布走 release/* 或部署分支）
on:
  workflow_dispatch:
  pull_request:
    branches: [develop, server-web, main]
  push:
    branches: [develop, server-web, main, 'feature/**']

# 同一 ref 的连续推送只保留最新一次：旧 run 排队/占 runner 会直接顶掉快轨 ≤3min 目标，
# 且"最新一次绿"会被旧 run 的结果干扰（P13-10）。与 deploy-gate.yml 同口径。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 最小权限：仅读取代码与 PR 元数据
permissions:
  contents: read
  pull-requests: read

jobs:
  # job 名保持 verify（不改成 fast）：仓库分支保护/必需检查可能按 job 名引用，
  # 改名会让必需检查静默失效。若确要改名，先在 GitHub 设置里同步更新（批 1 约束 6）。
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install dependencies (locked)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          # 开发/门禁工具：与运行依赖分离，锁定版本保证 CI 可复现
          # ruff 0.16.6 = 与本地 WSL 门禁（~/.venv-yiban-wsl）逐字对齐（MF-106：
          # 旧钉 0.15.22 与本地漂移，同一份代码两套编辑器判出不同结果）
          # pytest 9.1.1 = 含 CVE-2025-71176 修复（0~9.0.3 受影响）
          # pytest-xdist = 并发跑测试（-n 按 CI 核数分发；单测各自隔离临时目录）
          # mypy 1.19.0 = 静态类型门禁（dev-verify 的 mypy 步；与本地 WSL 门禁 venv 同版号；
          #   不进 requirements.lock——生产 Docker 镜像不背门禁工具，先例同 ruff/pytest）
          # import-linter 2.15 = 结构门禁（.importlinter 依赖方向契约；P0 批四条，批 A0 补三条；
          #   同 ruff/mypy 先例只钉在本行，不进 requirements.lock。
          #   本地 WSL 门禁 venv 单独装同版号。升版须同批改 tests/test_import_linter_gate.py
          #   的 PINNED_TOOL——门走 import-linter 的非公开 API，升版可能改元数据形态）
          # grimp 3.17 = import-linter 的图引擎。import-linter 2.15 对 grimp 只给下限
          #   （Requires-Dist: grimp>=3.17，无上界），不钉版即每次拉当时最新。而门自己
          #   重实现了 grimp 的 `X.*` 通配语义（见 check-import-linter.py 的空转守卫），
          #   故 grimp 也必须钉住。升版须同批改测试的 PINNED_GRIMP（审查 M2）。
          pip install ruff==0.16.6 pytest==9.1.1 pytest-xdist==3.8.0 mypy==1.19.0 import-linter==2.15 grimp==3.17

      # 提交/PR 标题规范校验（Conventional Commits）
      # 不符合 feat/fix/docs/... 前缀则门禁失败。
      # 已固定为完整 commit SHA（2026-08-22 M10，防可变 tag 被篡改）。
      - name: Validate PR title
        if: github.event_name == 'pull_request'
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ---- 关键子集：本地与 CI 同源（scripts/dev-verify.sh --ci） ----
      # 为什么收成一步：跑法此前有两个入口（CI 内联一份、本地各人一套），两位负责人
      #   分组跑法不同会产出伪红。现在命令原文只存在仓内入口脚本里一份，CI 只调它的
      #   子集模式；本地全量（`bash scripts/dev-verify.sh`）与这条子集共用同一个脚本。
      # 子集内容与参数**与改前逐字相同**（ruff 扫描面 / -k 词集 / -n 4 / --dist loadfile /
      #   -p no:randomly / e2e smoke 目标 / shared-facts 门与元测试），命令原文与理由写在
      #   scripts/dev-verify.sh 的 run_ci 与 docs/dev/dev-verify.md；本条不复制命令文本，
      #   免得同一个事实出现第二个定义点（漂移由 tests/test_dev_verify_entry.py 冻结）。
      # 任一环节非 0 即本步非 0——与改前"步级失败即停"等价。
      # 2026-10-06 起多了一步：B1 的在册部署键裸读门（scripts/check-path-env-reads.py）
      #   与它的元测试。加步是工单要求的（"门禁要真进 CI，不许只当仓里的摆设"），
      #   除这两步之外 CI 结果与改前等价；命令原文仍只住 run_ci 一份，漂移由
      #   tests/test_dev_verify_entry.py 的冻结清单钉住。
      # 2026-10-11 起又多了一步：import-linter 结构门（scripts/check-import-linter.py）
      #   与它的元测试（P0 批四条，批 A0 补三条）。同上，命令原文只住 run_ci 一份。
      - name: Gate subset (scripts/dev-verify.sh --ci)
        run: bash scripts/dev-verify.sh --ci

      # Vue 构建产物可复现门禁的元测试（工单 yiban-auto-sign-spn6）。
      # 为什么单列一步：CI 的 -k 词集住在 scripts/dev-verify.sh 的 run_ci，本单不改该文件
      #   （feature/dev-verify-fastmode 分支在飞改 run_ci，跨分支必冲突），故按文件路径直接选测。
      # 为什么在 verify（不是 frontend）job：本元测试只跑 --lf-only 与 --compare 两个模式，
      #   不需要 node；frontend job 有 node，本 job 有 Python，各取所需。
      # 守卫本体（重建 + 逐字节比对，需要 node）在 frontend job 跑；承重段突变证明在
      #   scripts/e2e/vue-build-reproducible-e2e.sh（WSL 内手跑）。
      - name: Vue build reproducible meta-tests (no node)
        run: python -m pytest tests/test_vue_build_reproducible.py -q -p no:randomly

      - name: Gate ready
        # 这行只是收尾回执，但它枚举了子集内容 —— 子集变了这里也要变，否则"同一个事实
        # 两个定义点"就从这里开始漂。2026-10-06（工单 2ula）加入 config-registry。
        # 2026-10-11 加入 mypy（静态类型门禁与它的元测试进 run_ci 子集）。
        # 2026-10-11 加入 import-linter（结构门禁与它的元测试进 run_ci 子集）。
        # 2026-10-13（工单 j06f）加入依赖一致性门的**元测试**（门本体不在 CI 跑：
        #   verify job 的解释器刚按 requirements.lock 装过，跑门本体是同义反复；
        #   元测试才造得出"venv 落后 lock"的形态）。
        run: 'echo "Fast gate active: lint + mypy + roster fast lane + serial drill lane + e2e smoke + shared-facts roster + path-env bare reads + config registry + import-linter contracts + deps lock meta-tests."'

  # ---- 慢集专轨（vckk 阶段 2-a · 2026-10-17）：名册 slow 行 ＋ FAST_KNOWN_SLOW 长尾轨 ----
  # 为什么独立 job：slow 行的贵是**真实的等外面**（真子进程 / 真定时等待），并进 verify
  # 会把它拱向 10 分钟上限（工单 i9gl；CI 实测比本机慢约一倍）。独立成轨与 verify 并行，
  # 总墙钟不变。
  # 覆盖面对账（AGENTS §十三 第 29 条）：verify 跑 fast + serial 行，本作业跑 slow 行
  # ＋ `FAST_KNOWN_SLOW` 的 4 条长尾（R3-025，2026-10-24）⇒ 三条道在每次 push 上各跑
  # 各的，**合起来覆盖名册全部文件与全部被快集 --deselect 的 nodeid**——"改动落在某条道
  # 之外"在结构上不再可能（名册漏归类由 tests/test_gate_lane_roster.py 红，长尾轨的
  # 执行点在场性由 tests/test_dev_verify_entry.py::DevVerifyTailLaneTest 红，两者都在快集里）。
  # 长尾 4 条此前落在两道之间：所在文件是 fast 行，而快集用 --deselect 剔除它们，本作业
  # 又只取 slow 行 ⇒ 任何自动轨都不执行。耗时口径（2026-10-24，WSL 固定 venv，串行）：
  # 3 条实测 28.86s / 28.78s / 29.53s，第 4 条 opt-in 恒 skip；本作业实测 193s → 305s。
  # 行集由 tests/lane-roster.tsv 与脚本内 FAST_KNOWN_SLOW 推导（唯一事实源）；本文件不写
  # 任何测试名，防第二定义点。
  # ⚠️ 要真的拦得住，须把 `slow-lane` 加进分支保护的 required checks（所有者在仓库设置里
  # 勾选）——与 dependency-audit 同一约束，本文件无法替你做。
  slow-lane:
    runs-on: ubuntu-latest
    # 10 → 15 分钟（R3-025）：本作业新增长尾轨约 +110s（本机实测 193.47s → 305s 合计），
    # CI 机器更慢；这只是上限，不增加正常路径的时长。
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install dependencies (locked)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          # 只钉 pytest：--slow 串行跑，不需要 xdist；ruff/mypy 属 verify 的静态步。
          pip install pytest==9.1.1

      - name: Slow lane (roster slow rows + FAST_KNOWN_SLOW tail, serial)
        run: bash scripts/dev-verify.sh --slow

  # ---- 依赖漏洞审计门（M28 批次 · 补 Dockerfile 注释里承诺的 pip-audit） ----
  # 为什么要它：`requirements.lock` 是**手工维护的精确锁定**。2026-10-24（R3-007）起
  # 每个 pin 带 `--hash=sha256`，安装侧用 `--require-hashes`——供应链换包在安装阶段
  # 就会 fail-closed；pip-audit 仍是漏洞审计入口。0.5.1 评审批已把 urllib3 抬到 2.8.0、
  # Werkzeug 抬到 3.1.9 关掉 4 个 CVE（该改动在本分支的基线提交里，不在本文件所在提交的 diff 中）。
  # ⚠️ 它要真的"拦得住"，必须把它加进分支保护的 required checks（所有者在仓库设置里
  # 勾选 `dependency-audit`）——本文件无法替你做这件事；没勾之前它只是**报告式**审计。
  # 独立 job 而非 verify 里的一步：审计要解算整棵依赖树并访问漏洞库，与 verify 的
  # 测试子集无关联，并行跑不占 fast 轨关键路径（两个 job 共用一次 checkout + setup）。
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.lock

      # 审计**锁定清单**（requirements.lock）而不是下限清单（requirements.txt）：
      # 锁定版本才是镜像实际安装、也是现网实际跑的那个版本。
      # pip-audit 2.10.0 钉版（与本 job 的 ruff/pytest 钉版同一纪律：门禁工具必须可
      # 复现，否则"昨天绿今天红"分不清是漏洞库更新还是工具行为变化）。
      # 退出码：0=无已知漏洞；1=检出漏洞（门禁失败）；>1=审计本身跑不起来。
      - name: pip-audit (locked dependencies)
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit==2.10.0
          pip-audit -r requirements.lock

      - name: Audit ready
        run: 'echo "Dependency audit clean: requirements.lock has no known vulnerabilities."'

  # ---- 前端单测（Vue + Vitest）＋ 真浏览器 e2e（Playwright）----
  # 为什么必须有单测：122 项 Vitest 此前完全不在门禁内，而"纯函数全绿、组件接线坏掉"的缺陷
  # 恰好落在无门禁区——2026-10-03 独立审查实测到一个 blocking 回归（日志页日期栏整体失效）
  # 正是这样漏掉的。前端测试与后端测试同门槛。
  # 为什么 e2e 也放这里（R3-008，2026-10-24）：这批 Playwright 用例此前只挂在
  # `e2e-nightly.yml`——它的排程定义点在默认分支 main，而 server-web 分支不持有该文件；
  # 故部署分支上一条都不跑。本 job 已有 node 与 node_modules，补 Python 运行依赖与浏览器
  # 二进制即可拉起 `e2e/server.py`（临时 Flask 实例 + 临时 SQLite，不碰真实数据、不联外网）。
  # 实测（本机 2026-10-24，串行 workers=1）：12 个 spec、31 条用例、2m19s。
  # 为什么不在 verify job：verify 的目标是 ≤3min 快速轨；本 job 与它并行，加时不占快轨。
  frontend:
    runs-on: ubuntu-latest
    # 10 → 15 分钟（R3-008）：本 job 新增 e2e（浏览器安装 ＋ 2m19s 用例，本机实测）。
    # 这只是上限，不增加正常路径时长；与 verify / slow-lane 并行，不占快轨关键路径。
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies (locked)
        run: npm ci
      - name: Unit tests (Vitest)
        run: npm run test
      # 构建产物可复现门禁（工单 yiban-auto-sign-spn6）：产物必须与已提交产物逐字节相同。
      # 为什么在本 job：这里已有 node 与 node_modules（上面 npm ci），一次重建约 2 秒。
      # 判据与理由写在 scripts/check-vue-build-reproducible.sh；承重段的突变证明写在
      # scripts/e2e/vue-build-reproducible-e2e.sh（WSL 内手跑）；本文件不复制判据文本。
      - name: Vue build artifacts reproducible (LF + byte-identical rebuild)
        run: bash ../scripts/check-vue-build-reproducible.sh
      # e2e 的 Python 侧：e2e/server.py 要 Flask / portalocker 等运行依赖（按 lock 装，
      # 与 verify job 用的 requirements.lock 同一份口径）。
      - name: Set up Python (e2e server)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install Python runtime deps (e2e server, locked)
        run: pip install -r ../requirements.lock
      - name: Install Playwright browser (chromium)
        run: npx playwright install --with-deps chromium
      # YB_E2E_PYTHON 必须显式给：playwright.config 的探测只覆盖本机 venv 布局，
      # 在 runner 上会退化成 "python" 之外的探测结果。
      # 覆盖说明（R3-008 P3-1，登记不改）：`paging.spec.ts` 的 2 条 5k 用例要
      # `YB_E2E_BULK_ACCOUNTS>=1000` 才执行，默认在 PR 里 skip；它们仍会在夹具满足时执行，
      # 但不在本 job 的默认覆盖内。
      - name: End-to-end tests (Playwright, real browser + temp Flask)
        run: npm run test:e2e
        env:
          YB_E2E_PYTHON: python

  # 新栈（Go 后端 + React 前端）的自动门。与 verify job 分开：
  # Python 旧栈与 Go/React 新栈的依赖与工具链不同，混在一个 job 里会让
  # 任一栈的安装失败拖垮另一栈。本 job 只调同一个本地入口
  # `bash scripts/verify-stacks.sh`；命令原文只住在该脚本里一份，避免
  # “注释说跑了脚本、steps 里却内联命令”的双定义点。
  # 视觉回归不在本 job：基线目前只有 win32（见 ui/README.md），Linux 基线未生成。
  stacks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The database layer has e2e tests that need a real PostgreSQL 18: partial
    # indexes, advisory locks, FK RESTRICT and append-only triggers have no
    # honest in-process substitute. Without this service the tests skip, so the
    # service is what makes the database gates real in CI.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: yiban
          POSTGRES_PASSWORD: yiban
          POSTGRES_DB: yiban
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yiban -d yiban"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # npm ci 必须先做：入口脚本只跑 `npm run verify`，不在门禁里联网装依赖。
      - name: Install UI dependencies (locked)
        working-directory: ui
        run: npm ci

      # 真调入口脚本（不是内联命令）。命令原文只存在 scripts/verify-stacks.sh；
      # tests/test_dev_verify_entry.py::StacksCiWiringTest 钉住这条执行行。
