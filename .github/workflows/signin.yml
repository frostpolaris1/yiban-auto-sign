name: Yiban Sign-in

on:
  schedule:
    # 早操签到窗口：北京时间 06:30-07:50
    # 第一次：UTC 22:35 = 北京时间 06:35（首次打卡）
    - cron: '35 22 * * *'
    # 第二次：UTC 23:15 = 北京时间 07:15（容错重试；若已签到则按成功处理）
    - cron: '15 23 * * *'
  workflow_dispatch:
  workflow_call:
    secrets:
      YIBAN_ACCOUNTS:
        required: false
      YIBAN_PHONE:
        required: false
      YIBAN_PASSWORD:
        required: false
      YIBAN_NOTIFY_URL:
        required: false
      YIBAN_PROXY:
        required: false

jobs:
  signin:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Diagnose runner network
        run: |
          echo "=== Runner 出口 IP / 地域（用于判断是否被易班地域风控）==="
          curl -s --max-time 10 https://ipinfo.io/json || true

      - name: Run sign-in script
        env:
          YIBAN_ACCOUNTS: ${{ secrets.YIBAN_ACCOUNTS }}
          YIBAN_PHONE: ${{ secrets.YIBAN_PHONE }}
          YIBAN_PASSWORD: ${{ secrets.YIBAN_PASSWORD }}
          YIBAN_NOTIFY_URL: ${{ secrets.YIBAN_NOTIFY_URL }}
          YIBAN_PROXY: ${{ secrets.YIBAN_PROXY }}
        run: python scripts/signin.py

  # 在定时触发时调用 keepalive 防止工作流被 GitHub 自动禁用（60 天限制）
  workflow-keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1
