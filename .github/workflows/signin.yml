name: Yiban Sign-in

on:
  schedule:
    # 早操签到窗口：北京时间 06:30-07:50
    # GitHub Actions schedule 通常延迟 20-30 分钟触发
    # 06:50 触发 → 实际约 07:15-07:20 执行，留 30+ 分钟余量
    # UTC 时间 = 北京时间 - 8（前一天）
    - cron: '50 22 * * *'   # 北京时间 06:50
  workflow_dispatch:
  workflow_call:
    secrets:
      YIBAN_ACCOUNTS:
        required: false
      YIBAN_PHONE:
        required: false
      YIBAN_PASSWORD:
        required: false
      YIBAN_NOTIFY_URL:
        required: false
      YIBAN_PROXY:
        required: false
      YIBAN_PHONE_MODEL:
        required: false
      YIBAN_PHONE_CODE:
        required: false

jobs:
  signin:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Diagnose runner network
        run: |
          echo "=== Runner 出口 IP / 地域（用于判断是否被易班地域风控）==="
          curl -s --max-time 10 https://ipinfo.io/json || true
          echo ""
          echo "=== 代理配置状态 ===="
          if [ -n "${{ secrets.YIBAN_PROXY }}" ]; then
            echo "YIBAN_PROXY 已配置（隐藏具体内容）"
          else
            echo "⚠️ YIBAN_PROXY 未配置，如遇到 WAF 拦截请配置代理（国内出口）"
          fi

      - name: Run sign-in script
        env:
          YIBAN_ACCOUNTS: ${{ secrets.YIBAN_ACCOUNTS }}
          YIBAN_PHONE: ${{ secrets.YIBAN_PHONE }}
          YIBAN_PASSWORD: ${{ secrets.YIBAN_PASSWORD }}
          YIBAN_NOTIFY_URL: ${{ secrets.YIBAN_NOTIFY_URL }}
          YIBAN_PROXY: ${{ secrets.YIBAN_PROXY }}
          YIBAN_PHONE_MODEL: ${{ secrets.YIBAN_PHONE_MODEL }}
          YIBAN_PHONE_CODE: ${{ secrets.YIBAN_PHONE_CODE }}
        run: python scripts/signin.py

  # 在定时触发时调用 keepalive 防止工作流被 GitHub 自动禁用（60 天限制）
  workflow-keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1
