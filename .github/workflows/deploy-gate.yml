name: Deploy gate

# 发布判据的守卫：可发布＝全新干净环境按 README
# 从零装成、一次完成、零手动调整；且部署流程必须有 e2e 钉住（干净容器内按 README 走通、
# 服务健康检查通过）。那条 e2e 的唯一载体是 scripts/deploy_gate.sh——它此前被 CI/测试
# 引用 0 次，可整个失败而无人红，唯一的"守卫"是有人记得手跑。本 workflow 让它进自动轨：
# 闸门坏了，这条检查就红。
#
# 跑的是 README 的形态：**不传 GATE_PIP_INDEX_URL**（走默认索引，同 README 的
# `docker compose up -d --build`）。国内镜像旁路只供本机用（GATE_PIP_INDEX_URL=...），
# 不在 CI 里设——否则跑的就是另一条同义命令，不再是 README 那条。
#
# fetch-depth: 0 是必须的：B 阶段迁移演练要 `git archive v0.6.2` 起旧库。
# 钉不可变 tag 而不是分支：分支会被删（`release/0.6.2` 于 2026-10-17 被删，B0 无法解析）。
#
# 一键更新失败矩阵（U2）的完整演练需要特权 systemd 容器，托管 runner 上不可得，
# 不在本文件里跑：它由 update-rollback-privileged.yml（手动 + 自托管）承载。本文件
# 只保留不依赖 docker 的 update.sh 干跑契约，作为 required 检查。
on:
  workflow_dispatch:
  pull_request:
    branches: [develop, server-web, main]
  push:
    branches: [develop, server-web, main]

# 最小权限：仅读取代码
permissions:
  contents: read

# 闸门是重活（构建两次镜像 + 起全栈 + 迁移/备份演练）：同一 ref 上只保留最新一次运行，
# 新推送取消在跑的那次，避免 PR 上堆积冗余运行（评审规则：push/PR 无 concurrency 会
# 产生冗余运行）。
concurrency:
  group: deploy-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout (full history — phase B archives v0.6.2)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # 线路自检（先跑、快）：必须有 workflow 引用部署闸门，且闸门跑的是 README 的形态。
      # 这是"守卫的守卫"——与 dev-verify 全量/nightly 里同一枚用例（tests/
      # test_deploy_gate_wiring.py）互为独立轨：删掉本 workflow 时那条轨仍会红。
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Wiring meta-test (pins this job's existence + README form)
        run: |
          python -m pip install --upgrade pip
          pip install pytest==9.1.1
          python -m pytest tests/test_deploy_gate_wiring.py -q -p no:randomly

      # 闸门本体：干净 docker 环境按 README 起全栈 + 迁移/回滚演练（期望版本取自迁移登记表） + 备份恢复。
      # 它自己失败（任一 PASS/FAIL 项为 FAIL）即非 0 退出 ⇒ 本 job 红。
      - name: Deploy gate — README clean deploy + migration/rollback + backup restore
        run: bash scripts/deploy_gate.sh

  # ---- 新栈容器部署 e2e --------------------------------------
  # 为什么独立 job：它构建 Go 镜像、拉三个基础镜像、起 compose 栈并等健康。
  # 与 deploy-gate 并行，不占部署闸门的关键路径。
  # 判据来源：干净环境从零装成 + 健康检查通过。
  # 断言与跑法：scripts/e2e/deploy-container-e2e.sh 与 docs/dev/deploy-e2e.md。
  # 裸机路径需 --privileged systemd，未在托管 runner 实测，登记为发布前手跑项。
  # 超时门：30 分钟。正常路径约 5 分钟（镜像构建 + 健康等待）。
  container-deploy-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Container deploy e2e — build, up, migrate, healthz, SIGTERM, down
        run: bash scripts/e2e/deploy-container-e2e.sh

  # ---- 一键更新干跑契约（U2，required） ------------------------------------
  # 判据与跑法：update-rollback-e2e.sh（见 docs/dev/deploy-e2e.md §8）的 update.sh 干跑契约，由
  # server/cmd/cli 的 TestUpdateSh|TestInstallSh 覆盖：自检门、统一备份、
  # systemctl start 失败回滚、首次装页面回滚、argv 无口令、缺值退出 2。
  #
  # 这份契约不依赖 docker，托管 runner 上必定真跑；**任何非 0 退出都判红**，
  # 不设降级分支（P1-6：旧写法在脚本返回 2 时把环境错误打印成跳过并放绿，
  # 等于 required 检查可整条失效）。
  #
  # 完整失败矩阵 R1..R10 需要 docker --privileged + 真 systemd PID1，托管
  # runner 起不了，已拆到 update-rollback-privileged.yml（手动 workflow_dispatch、
  # 自托管 runner、只读权限）。发布前仍按 docs/dev/deploy-e2e.md §8 手跑一遍。
  update-rollback-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: update.sh 干跑契约（自检门/备份/回滚/argv 无口令）
        run: |
          command -v go >/dev/null 2>&1 || { echo "go not found on the runner"; exit 1; }
          cd server && go test ./cmd/cli/ -run 'TestUpdateSh|TestInstallSh' -count=1
