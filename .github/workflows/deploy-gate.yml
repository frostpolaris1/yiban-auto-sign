name: Deploy gate

# 部署 e2e 的守卫：可发布＝全新干净环境按 README 从零装成、一次完成、零手动调整。
#
# 本文件承载两条 e2e：
#   1. container-deploy-e2e：构建 Go 镜像与 UI 产物，起 compose 栈并等健康检查；
#   2. update-rollback-e2e：非特权环境下 update.sh 的快照/回滚契约。
# 两条都必须真执行被测对象（shell 脚本 / Go 干跑用例），不许出现
# "检查器在、脚本没跑"的空转。
#
# 一键更新失败矩阵（U2）的完整演练需要特权 systemd 容器，托管 runner 上不可得，
# 不在本文件里跑：它由 update-rollback-privileged.yml（手动 + 自托管）承载。
on:
  workflow_dispatch:
  pull_request:
    branches: [develop, server-web, main]
  push:
    branches: [develop, server-web, main]

# 最小权限：仅读取代码
permissions:
  contents: read

# 闸门是重活（构建两次镜像 + 起全栈 + 迁移/备份演练）：同一 ref 上只保留最新一次运行，
# 新推送取消在跑的那次，避免 PR 上堆积冗余运行（评审规则：push/PR 无 concurrency 会
# 产生冗余运行）。
concurrency:
  group: deploy-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- 新栈容器部署 e2e --------------------------------------
  # 为什么独立 job：它构建 Go 镜像、拉三个基础镜像、起 compose 栈并等健康。
  # 与 update-rollback-e2e 并行，不占部署闸门的关键路径。
  # 判据来源：干净环境从零装成 + 健康检查通过。
  # 断言与跑法：scripts/e2e/deploy-container-e2e.sh 与 docs/dev/deploy-e2e.md。
  # 裸机路径需 --privileged systemd，未在托管 runner 实测，登记为发布前手跑项。
  # 超时门：30 分钟。正常路径约 5 分钟（镜像构建 + 健康等待）。
  container-deploy-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Container deploy e2e — build, up, migrate, healthz, SIGTERM, down
        run: bash scripts/e2e/deploy-container-e2e.sh

  # ---- 一键更新干跑契约（U2，required） ------------------------------------
  # 判据与跑法：update-rollback-e2e.sh（见 docs/dev/deploy-e2e.md §8）的 update.sh 干跑契约，由
  # server/cmd/cli 的 TestUpdateSh|TestInstallSh 覆盖：自检门、统一备份、
  # systemctl start 失败回滚、首次装页面回滚、argv 无口令、缺值退出 2。
  #
  # 这份契约不依赖 docker，托管 runner 上必定真跑；**任何非 0 退出都判红**，
  # 不设降级分支（P1-6：旧写法在脚本返回 2 时把环境错误打印成跳过并放绿，
  # 等于 required 检查可整条失效）。
  #
  # 完整失败矩阵 R1..R10 需要 docker --privileged + 真 systemd PID1，托管
  # runner 起不了，已拆到 update-rollback-privileged.yml（手动 workflow_dispatch、
  # 自托管 runner、只读权限）。发布前仍按 docs/dev/deploy-e2e.md §8 手跑一遍。
  update-rollback-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: update.sh 干跑契约（自检门/备份/回滚/argv 无口令）
        run: |
          set -o pipefail
          cd server
          go test ./cmd/cli/ -run 'TestUpdateSh|TestInstallSh' -count=1 -v | tee /tmp/update-sh-e2e.log
          passes=$(awk '/^--- PASS/{n++} END{print n+0}' /tmp/update-sh-e2e.log)
          min_passes=2
          echo "update.sh contract: $passes passing cases"
          if [ "$passes" -lt "$min_passes" ]; then
            echo "expected at least $min_passes passing cases, got $passes"
            exit 1
          fi
