# 功能请求（结构化表单）
# 三问贴合本仓清单文化：旧线对照、契约影响、迁移需求。
# labels 只绑仓库已存在的标签；契约/迁移细节见 CONTRIBUTING.md §7.5。
name: 功能请求
description: 提议一个新能力或行为变更（先对齐判据，再写代码）
title: "[feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        本仓按「先定判据，再写代码」工作。
        请把**要解决的问题**与**验收判据**写清楚；实现方案可以后议。

        - 涉及签到状态语义、认领互斥、容量调度、隐私脱敏、审计完整性、风控分类、平台协议的面由本仓自持，见 `CONTRIBUTING.md` §4。
        - 安全漏洞不要开公开 issue，见仓库根目录 `SECURITY.md`。

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 谁在什么场景下遇到什么困难；不要只写「加一个功能」。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 提议方案
      description: 你希望的行为与边界；可以不写实现细节。
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 验收判据
      description: 写成可执行谓词，至少一条负向用例；断言用户可见结果，不钉调用顺序。
      placeholder: |
        正向：...
        负向：...
    validations:
      required: true

  - type: dropdown
    id: old_stack
    attributes:
      label: 旧线对照？
      description: 旧栈（yiban/、web/、frontend/、tests/）已冻结，但仍是行为参考。
      options:
        - 不涉及旧线
        - 旧线已有类似能力，可作行为参考
        - 旧线能力不足，需要在新栈重做
        - 不确定，请维护者判断
    validations:
      required: true

  - type: dropdown
    id: contract
    attributes:
      label: 影响契约？
      description: 契约唯一事实源是 `server/contracts/openapi.yaml`；生成物不得手改。
      options:
        - 不影响 API 契约
        - 改契约：新增字段或端点（兼容）
        - 改契约：破坏性变更（需要豁免与迁移说明）
        - 不确定，请维护者判断
    validations:
      required: true

  - type: dropdown
    id: migration
    attributes:
      label: 迁移需求？
      options:
        - 无数据库迁移
        - 需要新迁移
        - 需要回填、双写或分阶段切换
        - 不确定，请维护者判断
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 截图（已脱敏）、相关 issue、外部参考（注明来源与许可证）。
    validations:
      required: false
