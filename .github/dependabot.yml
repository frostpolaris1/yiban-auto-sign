# Dependabot：只做「发现 → 升级 PR」的闭环。
#
# 为什么还需要它：CI 的 `tooling-gate` 每个 PR 已跑 govulncheck 与 npm audit（high+）。
# 这些作业只负责**发现**；发现之后不会自己开升级 PR。
# 本文件补上后半段：每周检查 github-actions、npm、pip、gomod 四个生态、
# 六个更新配置的更新，按配置合并成一条分组 PR 交给 CI 复核。
#
# 纪律：
# - 每个更新配置只开一个分组 PR，避免周一刷屏。
# - open-pull-requests-limit: 5 是逐配置上限；六个配置合计最多 30 条，
#   CI 红或需要人工适配时先处理旧的，再让新的进来。
# - action 固定到 commit SHA 的写法由 dependabot 连同版本注释一起更新；
#   升级 PR 仍要过全部 CI 检查，不因为「只是依赖」跳过门禁。
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/ui"
    schedule:
      interval: "weekly"
    groups:
      ui-dependencies:
        patterns: ["*"]
    open-pull-requests-limit: 5

  - package-ecosystem: "pip"
    directory: "/tests"
    schedule:
      interval: "weekly"
    groups:
      gate-tools:
        patterns: ["*"]
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/server/contracts/tools"
    schedule:
      interval: "weekly"
    ignore:
      # 版本同时被 tests/test_contract_gate_wiring.py 钉成常量；
      # 升级必须连同该常量一起改，故不交给自动 PR。
      - dependency-name: "@stoplight/spectral-cli"
    groups:
      contract-tools:
        patterns: ["*"]
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/ui/scripts/api-codegen"
    schedule:
      interval: "weekly"
    ignore:
      # TS5 是为了和 UI 的 TS7 隔离；大版本会改生成器契约，必须人工适配。
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "openapi-typescript"
        update-types: ["version-update:semver-major"]
    groups:
      api-codegen:
        patterns: ["*"]
    open-pull-requests-limit: 5

  - package-ecosystem: "gomod"
    directory: "/server"
    schedule:
      interval: "weekly"
    groups:
      go-dependencies:
        patterns: ["*"]
    open-pull-requests-limit: 5
