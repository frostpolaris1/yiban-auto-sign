<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>易班自动签到 · 控制台</title>
    <!--
      主题引导外置在 /theme-boot.js（public/）。
      目的：在任何 CSS 加载前写入 data-theme，深色用户不会先看到一帧浅色。
      36 个 Adminator 令牌只在 :root[data-theme="light"]
      或 :root[data-theme="dark"] 下解析。
      本脚本只写一个键：dash26-theme。不存任何凭据。
      必须同步加载（无 defer/async）：服务端 CSP 的 script-src 只有 'self'，
      内联脚本会被浏览器拦掉。
    -->
    <script src="/theme-boot.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
