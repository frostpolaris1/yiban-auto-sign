[tool.ruff]
line-length = 100
target-version = "py313"
exclude = [".git", "__pycache__"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "SIM", "RUF"]
ignore = [
    "BLE001",
    "SIM115",
    "E501",
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "."]
addopts = "-ra --tb=short"
