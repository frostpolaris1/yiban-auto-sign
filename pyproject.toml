[tool.mypy]
# 静态类型门禁（2026-10-11 立）。策略＝**strict per-module 增量收编**：
# 只检查 `files` 列出的"收编名单"，名单内严格档全开；名单外显式豁免（本轮不检查）。
# 为什么用 files 白名单而不是全树 ignore_errors：白名单让"收编进度"成为一份可读的
# 清单（改一行 = 收编一个模块），也不依赖"谁把某个模块 import 进来"这种隐式路径。
python_version = "3.13"
files = [
    "yiban/core/clock.py",
    "yiban/core/status.py",
    "yiban/egress.py",
    "yiban/engine/schedule.py",
    "yiban/engine/planner.py",
    "yiban/adapters/persistence/queue_store.py",
    "yiban/engine/token_bucket.py",
]
# 被导入模块的类型信息照常取用，但不报它们的错：收编模块可引用尚未收编的模块，
# 收编边界因此是"本模块"而不是"整条 import 闭包"。
follow_imports = "silent"
ignore_missing_imports = true
# ---- 名单内的严格档（等价 mypy --strict 减去下面两项有因豁免）----
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_decorators = true
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true
# `--strict` 的两项**有意不启用**（增量收编边界，非放水）：
#   · disallow_untyped_calls：启用即要求"收编模块调用的每个函数都已收编"——会把收编
#     面扩成整条 import 闭包（planner 一调 hrw/schedule/window 就牵连全包），与"增量"矛盾。
#     收编推进到全包时再开。
#   · warn_return_any：本批的行数据用 `dict[str, Any]` 表达（manifest 行 / PlanRow / owner
#     视图），Any 返回告警会逼出大量无意义 cast。批次 2 把这些形状改 TypedDict 后再开。
#
# ---- 名单外豁免清单（本轮不检查；显式登记，防止"以为在管其实没管"）----
# 其余 `yiban/**`、`web/**`、`scripts/**`、`docker/**`、`tests/**` 全部豁免。
# 收编路线（按"判据/契约轻重"排序，逐批推进）：
#   批次 2：`yiban/core/window.py`、`yiban/core/hrw.py`、`yiban/core/masking.py`、`yiban/adapters/config/loader.py`
#           （被收编模块直接依赖的判据件，收编后本批的 Any 可收窄）
#   批次 3：`yiban/adapters/persistence/**`（connection/migrations/clock_meta）、`yiban/engine/executor_v3.py`
#   批次 4：`web/**`（路由与展示层）
# 收编一个新模块 = 把它的路径加进 `files`，并就地修完它的红。

[tool.ruff]
line-length = 100
target-version = "py313"
# 无 lint 排除项：洁净室协议库 `yiban/adapters/protocol_yiban/` 已是本仓一等模块（不再 vendored），
# 与本仓其余部分同口径受检。
exclude = [".git", "__pycache__"]

[tool.pytest.ini_options]
# 只收集 tests/ 下的用例；scripts/ 下的一次性运维脚本不作为测试收集目标
testpaths = ["tests"]
# 导入路径：仓库根（web 包）+ scripts（db/signin 等裸模块）+ docker（scheduler）
# + tests，各测试文件无需再自插 sys.path 样板
pythonpath = ["tests", ".", "scripts", "web", "docker"]
# 汇总报告：结尾列出全部 skipped/xfailed/xpass；失败时短 traceback
addopts = "-ra --tb=short"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "SIM", "RUF", "DTZ"]
ignore = [
    "BLE001",  # 顶层兜底已逐处审查（API 输入校验/网络调用/文件降级）
    "SIM115",  # 行缓冲写入是有意行为（log_fh）
    # E501 是有意豁免，不是疏漏。行长上限 100 为两类必要长行让路：essay 式中文注释，
    # 与长 SQL 字面量（列清单写一行才可读）。属设计取舍。
    # 另记一处事实：两道门禁只跑 `ruff check`，从不跑 `ruff format`，故超限行不会
    # 被格式化器自动折行。实测（--line-length 100）生产面 213 行超限（yiban 119／
    # web 81／scripts 11／docker 2；另有 tests 553）。
    "E501",
    "RUF001",  # 中文文档字符串的全角标点是项目惯例（误报率高）
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
# `known-first-party` 必须显式给 `yiban`（2026-10-16 批 A1/A4 加）。
# 为什么：ruff 按**文件是否存在**判定 first-party。批 A1/A4 把 `yiban/` 下的子模块
# 搬进 `yiban/adapters/`、`yiban/app/`、`yiban/core/`、`yiban/entry/` 等子包，
# 而当时给旧坐标留了转发壳（`145-E` 已删净）。
# 于是 `from yiban.adapters.notifier.mail.layout import …` 被判成 third-party，与同文件的
# `from yiban.engine import …`（first-party）排进不同段，I001 假红。
# 覆盖面：`yiban`（命名空间包）与 `tools`（B1 起的开发工具目录，无 `__init__.py`，
# 按存在性判定在原位不稳）。`web/` 与 `scripts/` 的模块文件都在原位，按存在性
# 判定已经正确。
known-first-party = ["yiban", "tools"]

[tool.ruff.lint.per-file-ignores]
# tests/ 整体豁免 DTZ：测试大量用 naive datetime 构造业务本地时间做断言与打桩，
# 按定义不带时区。生产面的每一处 DTZ 命中一律逐处 noqa 处置，不用文件级豁免。
"tests/**" = ["DTZ"]
