<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 · 易班自动签到管理</title>
<script>
  // 暗色主题：尽早应用（防闪烁），localStorage 记忆（受限环境降级为不记忆）
  try { if (localStorage.getItem('yiban-theme') === 'dark') { document.documentElement.classList.add('dark'); } } catch (e) {}
</script>
<script>
  // 版本失效兜底：页面版本与上次不同 → 强制刷新（?v= 参数绕过浏览器缓存）
  // 防止部署更新后缓存旧页面导致登录/功能异常
  (function () {
    try {
      var v = '{{ web_version }}';
      var prev = localStorage.getItem('web_version');
      localStorage.setItem('web_version', v);
      if (prev && prev !== v && !location.search.includes('v=' + v)) {
        location.replace('/?v=' + v);
      }
    } catch (e) {}
  })();
</script>
<link rel="stylesheet" href="/static/vendor/fonts/misans/misans.css" media="(min-resolution: 1.5dppx) and (pointer: fine)">
<script src="/static/vendor/tailwind.js"></script>
<script src="/static/vendor/md-render.js"></script>
<script>
  // ===== 主题色板：Tailwind 默认（原版配色，经 CSS 变量重映射生效）=====
  // 类名不变，JS 动态拼接的类自动继承；RGB 三元组交由 <alpha-value> 支持透明度修饰符（如 /20）
  // 换主题时：改下方 borderRadius 可调圆角；改 <style> 内 :root/.dark 变量可整体换色
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        colors: {
          zinc: {50:'rgb(var(--c-zinc-50)/<alpha-value>)',100:'rgb(var(--c-zinc-100)/<alpha-value>)',200:'rgb(var(--c-zinc-200)/<alpha-value>)',300:'rgb(var(--c-zinc-300)/<alpha-value>)',400:'rgb(var(--c-zinc-400)/<alpha-value>)',500:'rgb(var(--c-zinc-500)/<alpha-value>)',600:'rgb(var(--c-zinc-600)/<alpha-value>)',700:'rgb(var(--c-zinc-700)/<alpha-value>)',800:'rgb(var(--c-zinc-800)/<alpha-value>)',900:'rgb(var(--c-zinc-900)/<alpha-value>)'},
          blue: {200:'rgb(var(--c-blue-200)/<alpha-value>)',300:'rgb(var(--c-blue-300)/<alpha-value>)',400:'rgb(var(--c-blue-400)/<alpha-value>)',500:'rgb(var(--c-blue-500)/<alpha-value>)',600:'rgb(var(--c-blue-600)/<alpha-value>)',700:'rgb(var(--c-blue-700)/<alpha-value>)',800:'rgb(var(--c-blue-800)/<alpha-value>)',900:'rgb(var(--c-blue-900)/<alpha-value>)'},
          amber: {50:'rgb(var(--c-amber-50)/<alpha-value>)',100:'rgb(var(--c-amber-100)/<alpha-value>)',200:'rgb(var(--c-amber-200)/<alpha-value>)',300:'rgb(var(--c-amber-300)/<alpha-value>)',400:'rgb(var(--c-amber-400)/<alpha-value>)',500:'rgb(var(--c-amber-500)/<alpha-value>)',600:'rgb(var(--c-amber-600)/<alpha-value>)',700:'rgb(var(--c-amber-700)/<alpha-value>)',800:'rgb(var(--c-amber-800)/<alpha-value>)',900:'rgb(var(--c-amber-900)/<alpha-value>)'},
          red: {50:'rgb(var(--c-red-50)/<alpha-value>)',200:'rgb(var(--c-red-200)/<alpha-value>)',300:'rgb(var(--c-red-300)/<alpha-value>)',400:'rgb(var(--c-red-400)/<alpha-value>)',500:'rgb(var(--c-red-500)/<alpha-value>)',600:'rgb(var(--c-red-600)/<alpha-value>)',700:'rgb(var(--c-red-700)/<alpha-value>)',800:'rgb(var(--c-red-800)/<alpha-value>)',900:'rgb(var(--c-red-900)/<alpha-value>)'},
          green: {50:'rgb(var(--c-green-50)/<alpha-value>)',200:'rgb(var(--c-green-200)/<alpha-value>)',300:'rgb(var(--c-green-300)/<alpha-value>)',400:'rgb(var(--c-green-400)/<alpha-value>)',500:'rgb(var(--c-green-500)/<alpha-value>)',600:'rgb(var(--c-green-600)/<alpha-value>)',700:'rgb(var(--c-green-700)/<alpha-value>)',800:'rgb(var(--c-green-800)/<alpha-value>)',900:'rgb(var(--c-green-900)/<alpha-value>)'}
        },
        // 圆角体系（中度优化）：控件 10px / 卡片 14px / 模态 18px
        borderRadius: { lg:'10px', xl:'14px', '2xl':'18px' }
      }
    }
  };
</script>

<style>
  /* 正文：原版字体栈（MiSans 仅高分屏「桌面」加载——misans.css 的 media 含 pointer: fine；手机端与低分屏走系统字体保 ClearType） */
  body { font-family: "MiSans", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
  /* 标题不再使用专属字体（2026-08-22 性能回退）：h1~h4 等继承下方正文栈，避免 2.8MB web 字体拖垮窄带宽访问；
     方圆体源文件与转换命令保留在本地，需要时可恢复 */
  /* 低分屏（<1.5x，Windows 桌面等）回退系统字体：woff2 无 hinting 低分屏渲染模糊，系统字体有 ClearType 优化 */
  @media (max-resolution: 1.5dppx) {
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
  }
</style>
<style type="text/tailwindcss">
  /* ===== 组件类（@layer components，由 tailwind 运行时编译）===== */
  @layer components {

    }
    .dark .card { box-shadow: 0 1px 2px rgba(0,0,0,.25), 0 8px 24px -8px rgba(0,0,0,.35); }
    .card-sm {
      @apply bg-white dark:bg-zinc-800 rounded-xl border border-zinc-200 dark:border-zinc-700 p-4;
      box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 6px 20px -6px rgba(0,0,0,.08);

</style>
<script>
  // ===== 图标系统：按功能手绘的统一 SVG 线性图标 =====
  // icon(name) 返回内联 SVG（currentColor 继承文字颜色）；[data-icon] 元素由 hydrateIcons() 填充。
  // 替代原 emoji（🌙⏳✅❌🔄⛔➖⏸️⏹️🗑️⚠️📅✕▸▾←→ 等），双主题一致、读屏友好（aria-hidden 装饰）。
  window.icon = (function () {
    var P = {
      sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
      moon: '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/>',
      clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
      check: '<circle cx="12" cy="12" r="9"/><path d="m8.5 12.2 2.4 2.4 4.8-5"/>',
      close: '<circle cx="12" cy="12" r="9"/><path d="m9 9 6 6m0-6-6 6"/>',
      retry: '<path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v5h-5"/>',
      ban: '<circle cx="12" cy="12" r="9"/><path d="m5.5 5.5 13 13"/>',
      minus: '<circle cx="12" cy="12" r="9"/><path d="M8 12h8"/>',
      pause: '<circle cx="12" cy="12" r="9"/><path d="M10 9v6m4-6v6"/>',
      stop: '<circle cx="12" cy="12" r="9"/><rect x="9" y="9" width="6" height="6" rx="1"/>',
      trash: '<path d="M4 7h16m-2 0-.9 12.1a2 2 0 0 1-2 1.9H8.9a2 2 0 0 1-2-1.9L6 7m3 0V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2m-6 4v6m4-6v6"/>',
      warn: '<path d="M10.3 3.9 1.8 18.6a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4m0 3.5v.1"/>',
      cal: '<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4m8-4v4M3 11h18"/>',
      play: '<path d="M7 5.5v13l11-6.5-11-6.5Z"/>',
      dots: '<circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/>',
      xmark: '<path d="m6 6 12 12M18 6 6 18"/>',
      chevL: '<path d="m15 6-6 6 6 6"/>',
      chevR: '<path d="m9 6 6 6-6 6"/>',
      chevD: '<path d="m6 9 6 6 6-6"/>'
    };
    return function (name, cls) {
      return '<svg class="ic ' + (cls || '') + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (P[name] || P.minus) + '</svg>';
    };
  })();
  // 静态占位填充：<span data-icon="moon"></span> → 插入对应 SVG
  window.hydrateIcons = function (root) {
    (root || document).querySelectorAll('[data-icon]').forEach(function (el) {
      if (!el._iconed) { el.innerHTML = window.icon(el.getAttribute('data-icon')); el._iconed = true; }
    });
  };
</script>
</head>
<body class="bg-zinc-50 dark:bg-zinc-900 min-h-screen flex items-center justify-center px-4 overscroll-y-none">
  <button onclick="toggleTheme()" data-theme-btn title="切换亮/暗主题" aria-label="切换亮/暗主题"
          class="fixed top-4 right-4 z-50 w-11 h-11 flex items-center justify-center rounded-xl bg-white dark:bg-zinc-800 border border-zinc-200 dark:border-zinc-700 text-zinc-500 dark:text-zinc-400 shadow-sm hover:shadow-md transition-shadow"><span data-icon="moon"></span></button>
  <div class="w-full max-w-md">
<!-- 全局公告条 -->
<div id="announcement-bar" class="hidden sticky top-0 z-20 mb-3 bg-amber-50 dark:bg-amber-900/20 border-b border-amber-200 dark:border-amber-800 text-amber-800 dark:text-amber-400 text-sm text-center px-4 py-2">
  <span id="announcement-text"></span>
</div>

    <!-- 登录/注册卡片 -->
    <div class="card">
      <!-- Tab 切换 -->
      <div class="flex bg-zinc-100 dark:bg-zinc-700 rounded-lg p-1 mb-5 text-sm font-medium" role="tablist" aria-label="登录 / 注册切换">
        <button id="tab-login" type="button" role="tab" aria-selected="true" aria-controls="login-form" onclick="switchMode('login')"
                class="flex-1 py-1.5 rounded-lg bg-white dark:bg-zinc-800 text-zinc-900 dark:text-zinc-100 shadow-sm transition-colors duration-150">登录</button>
        <button id="tab-register" type="button" role="tab" aria-selected="false" aria-controls="register-form" onclick="switchMode('register')"
                class="flex-1 py-1.5 rounded-lg text-zinc-500 dark:text-zinc-300 hover:text-zinc-900 dark:text-zinc-100 dark:hover:text-zinc-100 transition-colors duration-150">注册</button>
      </div>

      <!-- 登录表单 -->
      <form id="login-form" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-zinc-700 dark:text-zinc-200 mb-1" for="username">邮箱 / 管理员用户名</label>
          <input id="username" name="username" type="text" required autocomplete="username" inputmode="email"
                 placeholder="邮箱 / 管理员用户名"
                 class="input input-ring">
        </div>
        <div>
          <label class="block text-sm font-medium text-zinc-700 dark:text-zinc-200 mb-1" for="password">密码</label>
          <input id="password" name="password" type="password" required autocomplete="current-password"
                 placeholder="输入密码"
                 class="input input-ring">
        </div>
        <div id="error-box" role="alert" tabindex="-1" class="hidden text-sm text-red-600 dark:text-red-400 bg-red-50 border border-red-200 rounded-lg px-3 py-2"></div>
        <button type="button" id="restore-btn" onclick="restoreAccount()"
                class="hidden w-full mt-2 bg-amber-500 hover:bg-amber-600 text-white font-medium rounded-lg px-3 py-2 text-sm transition-colors duration-200">恢复我的账号（7 天内可撤销）</button>
        <button type="submit" id="login-btn"
                class="w-full bg-blue-500 hover:bg-blue-600 text-white font-medium rounded-lg flex items-center justify-center gap-2 transition-colors duration-200 px-3 py-2 text-sm">
          <span id="login-btn-text">登录</span>
        </button>
      </form>

      <!-- 注册表单 -->
      <form id="register-form" class="space-y-4 hidden">
        <div>
          <label class="block text-sm font-medium text-zinc-700 dark:text-zinc-200 mb-1" for="reg-email">邮箱 <span class="text-red-500 dark:text-red-400">*</span></label>
          <input id="reg-email" type="email" required autocomplete="email" maxlength="64" aria-describedby="reg-email-error"
                 placeholder="输入邮箱地址"
                 class="input input-ring">
          <p id="reg-email-error" class="hidden mt-1 text-xs text-red-500 dark:text-red-400">邮箱格式不正确（示例：name@example.com）</p>
        </div>
        <div>
          <label class="block text-sm font-medium text-zinc-700 dark:text-zinc-200 mb-1" for="reg-password">密码 <span class="text-red-500 dark:text-red-400">*</span></label>
          <input id="reg-password" type="password" required autocomplete="new-password" aria-describedby="reg-password-error"
                 placeholder="至少 10 位，含两类字符"
                 class="input input-ring">
          <p id="reg-password-error" class="hidden mt-1 text-xs text-red-500 dark:text-red-400">密码至少 10 位，且含字母/数字/符号中至少两类</p>

          <span>我已阅读并同意 <button type="button" onclick="showAgreement()" class="text-blue-500 hover:underline">《用户协议》</button> 与 <button type="button" onclick="showPrivacy()" class="text-blue-500 hover:underline">《隐私政策》</button></span>
        </label>
        <div id="reg-error-box" role="alert" tabindex="-1" class="hidden text-sm text-red-600 dark:text-red-400 bg-red-50 border border-red-200 rounded-lg px-3 py-2"></div>
        <button type="submit" id="register-btn"
                class="w-full bg-blue-500 hover:bg-blue-600 text-white font-medium rounded-lg flex items-center justify-center gap-2 transition-colors duration-200 px-3 py-2 text-sm">
          <span id="register-btn-text">注册并登录</span>
        </button>
      </form>
    </div>
    <footer class="text-center text-xs text-zinc-400 dark:text-zinc-400 py-4 mt-4">
      {% if icp_info %}
      <div id="footer-icp" class="mb-1">{{ icp_info }}</div>
      {% endif %}
      <div onclick="openChangelog()" title="点击查看更新日志" class="cursor-pointer hover:text-zinc-600 dark:hover:text-zinc-300 transition-colors duration-150">易班自动签到 v{{ app_version }}</div>
      <div class="mt-1 flex items-center justify-center gap-3 text-blue-500 dark:text-blue-400">
        <a href="/terms" target="_blank" rel="noopener" class="hover:text-blue-600 dark:hover:text-blue-300">用户协议</a>
        <span class="text-zinc-300 dark:text-zinc-600">·</span>
        <a href="/privacy" target="_blank" rel="noopener" class="hover:text-blue-600 dark:hover:text-blue-300">隐私政策</a>
        <span class="text-zinc-300 dark:text-zinc-600">·</span>
        <a href="https://github.com/frostpolaris1/yiban-auto-sign" target="_blank" rel="noopener" class="hover:text-blue-600 dark:hover:text-blue-300">开源（AGPL-3.0）</a>
      </div>
    </footer>
  </div>

<script>
let mode = 'login';
// HTML 转义（changelog 兜底渲染等文本上下文）
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
// 暗色主题切换（localStorage 记忆）
function toggleTheme() {
  const dark = document.documentElement.classList.toggle('dark');
  try { localStorage.setItem('yiban-theme', dark ? 'dark' : 'light'); } catch (e) {}
  updateThemeBtn();
}
function updateThemeBtn() {
  const dark = document.documentElement.classList.contains('dark');
  document.querySelectorAll('[data-theme-btn]').forEach(b => { b.innerHTML = icon(dark ? 'sun' : 'moon'); });
}
document.addEventListener('DOMContentLoaded', () => { updateThemeBtn(); hydrateIcons(); });

function switchMode(m) {
  mode = m;
  document.getElementById('login-form').classList.toggle('hidden', m !== 'login');
  document.getElementById('register-form').classList.toggle('hidden', m !== 'register');
  const lt = document.getElementById('tab-login');
  const rt = document.getElementById('tab-register');
  lt.className = 'flex-1 py-1.5 rounded-lg transition-colors duration-150 ' +
    (m === 'login' ? 'bg-white dark:bg-zinc-800 text-zinc-900 dark:text-zinc-100 shadow-sm' : 'text-zinc-500 dark:text-zinc-400 dark:text-zinc-500 hover:text-zinc-900 dark:text-zinc-100 dark:hover:text-zinc-100');
  rt.className = 'flex-1 py-1.5 rounded-lg transition-colors duration-150 ' +
    (m === 'register' ? 'bg-white dark:bg-zinc-800 text-zinc-900 dark:text-zinc-100 shadow-sm' : 'text-zinc-500 dark:text-zinc-400 dark:text-zinc-500 hover:text-zinc-900 dark:text-zinc-100 dark:hover:text-zinc-100');
  lt.setAttribute('aria-selected', String(m === 'login'));
  rt.setAttribute('aria-selected', String(m === 'register'));
}

function showError(el, msg) {
  el.textContent = msg;
  el.classList.remove('hidden');
  el.focus();  // 提交失败聚焦错误框（配合 tabindex="-1"），读屏即时播报
}

// ---- 注册表单即时校验（输入时实时反馈，字段下方提示）----
const EMAIL_RE = /^[\w.+-]{1,32}@[\w-]+(\.[\w-]+)+$/;  // 用户名部分（@ 前）限 32 字符
const regEmail = document.getElementById('reg-email');
const regEmailErr = document.getElementById('reg-email-error');
const regPw = document.getElementById('reg-password');
const regPwErr = document.getElementById('reg-password-error');

function markField(input, errEl, invalid) {
  input.classList.toggle('border-red-400', invalid);
  input.classList.toggle('focus:border-red-400', invalid);
  errEl.classList.toggle('hidden', !invalid);
}

regEmail.addEventListener('input', () => {
  const v = regEmail.value.trim();
  const invalid = v !== '' && !(EMAIL_RE.test(v) && v.length <= 64);
  if (v.includes('@') && v.split('@')[0].length > 32) {
    regEmailErr.textContent = '邮箱用户名部分过长（最多 32 字符）';
  } else {
    regEmailErr.textContent = '邮箱格式不正确（示例：name@example.com）';
  }
  markField(regEmail, regEmailErr, invalid);
});

regPw.addEventListener('input', () => {
  const v = regPw.value;
  const n = v.length;
  const classes = [ /[a-z]/, /[A-Z]/, /\d/, /[^A-Za-z0-9]/ ].filter(re => re.test(v)).length;
  regPwErr.textContent = `密码至少 10 位且含两类字符（当前 ${n} 位，${classes} 类）`;
  markField(regPw, regPwErr, n < 10 || classes < 2);
});

async function post(path, body) {
  const resp = await fetch(path, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body),
  });
  return [resp.status, await resp.json().catch(() => ({}))];
}

// 登录
document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorBox = document.getElementById('error-box');
  errorBox.classList.add('hidden');
  const btn = document.getElementById('login-btn');
  btn.disabled = true;
  try {
    const [st, data] = await post('/api/login', {
      username: document.getElementById('username').value,
      password: document.getElementById('password').value,
    });
    // 冷静期恢复（2026-08-16 用户裁决）：账号已注销且 7 天内、密码正确 → 引导恢复
    // 必须先于 data.ok 判断——recoverable 响应同时携带 ok:true，先查 ok 会误走
    // 普通登录跳转（/user 未登录被弹回 /login，表现为"刷新无提示"），此分支即为死代码
    if (st === 200 && data.recoverable) {
      showError(errorBox, data.msg || '账号已注销，7 天内可恢复');
      document.getElementById('restore-btn').classList.remove('hidden');
      return;
    }
    if (st === 200 && data.ok) {
      location.href = data.role === 'admin' ? '/' : '/user';
      return;
    }
    showError(errorBox, data.error || '登录失败，请重试');
  } catch (err) {
    showError(errorBox, '网络错误：' + err.message);
  } finally {
    btn.disabled = false;
  }
});

// 冷静期恢复（2026-08-16）：账号注销 7 天内可恢复，密码已在登录步骤验证
async function restoreAccount() {
  const btn = document.getElementById('restore-btn');
  const errorBox = document.getElementById('error-box');
  btn.disabled = true;
  try {
    const [st, data] = await post('/api/me/restore', {
      email: document.getElementById('username').value.trim(),
      password: document.getElementById('password').value,
    });
    if (st === 200 && data.ok) {
      location.href = data.role === 'admin' ? '/' : '/user';
      return;
    }
    showError(errorBox, data.error || '恢复失败，请稍后再试');
    btn.classList.add('hidden');
  } catch (err) {
    showError(errorBox, '网络错误：' + err.message);
  } finally {
    btn.disabled = false;
  }
}

// ---- 弹窗无障碍辅助（协议/隐私/更新日志三个模态共用）----
// 打开：记录触发元素 → 聚焦模态内首个可交互元素；关闭：隐藏并把焦点归还触发元素。
// Esc 关闭与 Tab 焦点圈定由下方全局 keydown 统一处理；遮罩点击关闭保持原逻辑。
const LOGIN_MODAL_IDS = ['agreement-modal', 'privacy-modal', 'changelog-modal'];
const loginModalOpeners = {};  // 模态 id -> 打开前的焦点元素
function modalFocusables(modal) {
  return Array.from(modal.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])'))
    .filter(el => !el.disabled && !el.closest('.hidden'));
}
function openModal(id) {
  const modal = document.getElementById(id);
  if (!modal || !modal.classList.contains('hidden')) return;
  loginModalOpeners[id] = document.activeElement instanceof HTMLElement ? document.activeElement : null;
  modal.classList.remove('hidden');
  const first = modalFocusables(modal)[0];
  if (first) first.focus();
}
function closeModal(id) {
  const modal = document.getElementById(id);
  if (!modal || modal.classList.contains('hidden')) return;
  modal.classList.add('hidden');
  const opener = loginModalOpeners[id];
  delete loginModalOpeners[id];
  if (opener && opener.isConnected) opener.focus();
}
document.addEventListener('keydown', (e) => {
  const modal = LOGIN_MODAL_IDS.map(id => document.getElementById(id)).find(m => m && !m.classList.contains('hidden'));
  if (!modal) return;
  if (e.key === 'Escape') {
    e.preventDefault();
    closeModal(modal.id);
  } else if (e.key === 'Tab') {
    const f = modalFocusables(modal);
    if (!f.length) { e.preventDefault(); return; }
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    else if (!modal.contains(document.activeElement)) { e.preventDefault(); first.focus(); }
  }
});

// 用户协议弹窗
function showAgreement() { openModal('agreement-modal'); }
function closeAgreement() { closeModal('agreement-modal'); }
// 隐私政策弹窗
function showPrivacy() { openModal('privacy-modal'); }
function closePrivacy() { closeModal('privacy-modal'); }

// 注册（注册成功后自动登录）
document.getElementById('register-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorBox = document.getElementById('reg-error-box');
  errorBox.classList.add('hidden');
  const btn = document.getElementById('register-btn');
  btn.disabled = true;
  try {
    const email = regEmail.value.trim();
    const password = regPw.value;
    // 必须勾选同意用户协议与隐私政策
    if (!document.getElementById('reg-agree').checked) {
      showError(errorBox, '请先阅读并同意《用户协议》和《隐私政策》');
      btn.disabled = false;
      return;
    }
    // 提交前兜底：字段级即时校验优先（错误显示在字段下方，不弹顶部错误框）
    // 与后端 _password_policy_error 对齐：至少 10 位 + 大写/小写/数字/符号中至少两类
    const emailInvalid = !(EMAIL_RE.test(email) && email.length <= 64);
    markField(regEmail, regEmailErr, emailInvalid);
    const pwClasses = [ /[a-z]/, /[A-Z]/, /\d/, /[^A-Za-z0-9]/ ].filter(re => re.test(password)).length;
    const pwInvalid = password.length < 10 || pwClasses < 2;
    markField(regPw, regPwErr, pwInvalid);
    if (emailInvalid || pwInvalid) {
      btn.disabled = false;
      return;
    }
    const [st, data] = await post('/api/register', {email, password, agree: document.getElementById('reg-agree').checked});
    if (st !== 200) {
      showError(errorBox, data.error || '注册失败');
      return;
    }
    const [st2, data2] = await post('/api/login', {username: email, password});
    if (st2 === 200 && data2.ok) {
      location.href = '/user';
      return;
    }
    showError(errorBox, '注册成功，但自动登录失败，请手动登录');
  } catch (err) {
    showError(errorBox, '网络错误：' + err.message);
  } finally {
    btn.disabled = false;
  }
});
</script>
<script>
// 全局公告：访问时加载一次（登录页也显示，无需登录）
async function loadAnnouncement() {
  try {
    const resp = await fetch('/api/announcement');
    const data = await resp.json().catch(() => ({}));
    const text = (data && data.text || '').trim();
    const bar = document.getElementById('announcement-bar');
    const el = document.getElementById('announcement-text');
    if (text && bar && el) {
      el.textContent = text;  // textContent 防 XSS
      bar.classList.remove('hidden');
    }
  } catch (e) { /* 静默 */ }
}
// 更新日志弹窗（版本号点击，登录页无需登录；Markdown 渲染）
async function openChangelog() {
  openModal('changelog-modal');
  const content = document.getElementById('changelog-content');
  content.innerHTML = '加载中…';
  try {
    const resp = await fetch('/api/changelog');
    const data = await resp.json().catch(() => ({}));
    content.innerHTML = window.renderMarkdown ? renderMarkdown((data && data.text) || '暂无更新日志') : esc((data && data.text) || '暂无更新日志');
  } catch (e) { content.innerHTML = '加载失败，请稍后重试'; }
}
function closeChangelog() { closeModal('changelog-modal'); }

document.addEventListener('DOMContentLoaded', loadAnnouncement);
</script>
