{# 固定侧边栏 + 移动端遮罩（从 index.html 外提，verbatim）。
   含 {{{{ request.script_root }}}} 引用，include 时请求上下文仍在，故可原样搬迁。 #}

<div id="sidebar-overlay" class="fixed inset-0 bg-black/30 z-20 md:hidden" onclick="toggleSidebar(false)"></div>

<!-- 固定侧边栏 -->
<aside id="sidebar" class="fixed inset-y-0 left-0 w-64 bg-white dark:bg-zinc-800 border-r border-zinc-200 dark:border-zinc-700 z-30 flex flex-col -translate-x-full md:translate-x-0 transition-transform duration-200 ease-[cubic-bezier(0.32,0.72,0,1)]">
  <!-- 品牌：优先显示 web/static/vendor/logo.png（本地/服务器放入即生效；开源仓库不含该文件
       ——版权来源不明，部署者自行放入，见 README「自定义 Web 图标」；文件缺失时回退占位图标） -->
  <div class="px-4 py-4 border-b border-zinc-100 dark:border-zinc-700 flex items-center gap-2.5">
    <img src="{{ request.script_root }}/static/vendor/logo.png?v=2" alt="易班自动签到" class="w-16 h-16 rounded-xl object-cover shrink-0"
         onerror="this.style.display='none';const f=document.getElementById('brand-fallback');f.classList.remove('hidden');f.style.display=''">
    <svg id="brand-fallback" viewBox="0 0 64 64" class="w-16 h-16 rounded-xl shrink-0 hidden" role="img" aria-label="易班自动签到（占位图标）">
      <rect width="64" height="64" rx="14" fill="#3b82f6"/>
      <text x="32" y="42" text-anchor="middle" font-size="30" fill="#ffffff" font-family="sans-serif">签</text>
    </svg>
    <div>
      <div class="font-semibold tracking-tight text-zinc-900 dark:text-zinc-100 text-lg leading-tight">易班自动签到</div>
      <div class="text-sm text-zinc-500 dark:text-zinc-400 leading-tight mt-0.5">管理后台</div>
    </div>
  </div>

  <!-- 导航 -->
  <nav class="flex-1 overflow-y-auto py-3 px-2 space-y-1">
    <button onclick="switchTab('accounts')" data-tab-btn="accounts"
            class="w-full flex items-center gap-2 px-3 py-2 rounded-lg text-sm font-medium text-zinc-600 dark:text-zinc-300 hover:bg-zinc-100 dark:hover:bg-zinc-700 hover:text-zinc-900 dark:hover:text-zinc-100 transition-colors duration-150 border-l-2 border-transparent">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a4 4 0 0 0-3-3.87M9 20H4v-2a4 4 0 0 1 3-3.87m6-1.13a4 4 0 1 0-6 0m5 5.13a4 4 0 1 0-8 0" />
      </svg>
      账号管理
    </button>
    <button onclick="switchTab('logs')" data-tab-btn="logs"
            class="w-full flex items-center gap-2 px-3 py-2 rounded-lg text-sm font-medium text-zinc-600 dark:text-zinc-300 hover:bg-zinc-100 dark:hover:bg-zinc-700 hover:text-zinc-900 dark:hover:text-zinc-100 transition-colors duration-150 border-l-2 border-transparent">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6M9 8h6M5 21h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2z" />
      </svg>
      签到日志
    </button>
    <button onclick="switchTab('settings')" data-tab-btn="settings"
            class="w-full flex items-center gap-2 px-3 py-2 rounded-lg text-sm font-medium text-zinc-600 dark:text-zinc-300 hover:bg-zinc-100 dark:hover:bg-zinc-700 hover:text-zinc-900 dark:hover:text-zinc-100 transition-colors duration-150 border-l-2 border-transparent">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 0 0 2.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 0 0 1.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 0 0-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 0 0-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 0 0-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 0 0-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 0 0 1.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0z" />
      </svg>
      系统设置
    </button>
    <button onclick="switchTab('users')" data-tab-btn="users"
            class="w-full flex items-center gap-2 px-3 py-2 rounded-lg text-sm font-medium text-zinc-600 dark:text-zinc-300 hover:bg-zinc-100 dark:hover:bg-zinc-700 hover:text-zinc-900 dark:hover:text-zinc-100 transition-colors duration-150 border-l-2 border-transparent">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a4 4 0 0 0-3-3.87M9 20H4v-2a4 4 0 0 1 3-3.87m6-1.13a4 4 0 1 0-6 0m5 5.13a4 4 0 1 0-8 0" />
      </svg>
      用户管理
    </button>
    <button onclick="switchTab('mine')" data-tab-btn="mine"
            class="w-full flex items-center gap-2 px-3 py-2 rounded-lg text-sm font-medium text-zinc-600 dark:text-zinc-300 hover:bg-zinc-100 dark:hover:bg-zinc-700 hover:text-zinc-900 dark:hover:text-zinc-100 transition-colors duration-150 border-l-2 border-transparent">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
      </svg>
      我的账号
    </button>
  </nav>

  <!-- 底部：服务器时间 + 退出 -->
  <div class="border-t border-zinc-100 dark:border-zinc-700 px-4 py-3">
    <div class="flex items-center justify-between mb-2">
      <div id="sidebar-clock" class="text-xs text-zinc-500 dark:text-zinc-400">服务器时间：--:--:--</div>
      <button onclick="toggleTheme()" data-theme-btn title="切换亮/暗主题" aria-label="切换亮/暗主题"
              class="text-sm text-zinc-500 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-zinc-100 transition-colors duration-150"><span data-icon="moon"></span></button>
    </div>
    <!-- 当前登录账号（防登录错管理员账号，2026-08-16） -->
    <div class="mb-2 px-3 py-2 rounded-lg bg-zinc-50 dark:bg-zinc-800/60 border border-zinc-100 dark:border-zinc-700">
      <div class="text-[11px] text-zinc-500 dark:text-zinc-400 mb-0.5">当前账号</div>
      <div id="sidebar-account-name" class="text-sm font-medium text-zinc-800 dark:text-zinc-200 truncate" title="">—</div>
    </div>
    <button onclick="doLogout()"
            class="w-full flex items-center gap-2 px-3 py-2 rounded-lg text-sm font-medium text-zinc-600 dark:text-zinc-300 hover:bg-zinc-100 dark:hover:bg-zinc-700 hover:text-zinc-900 dark:hover:text-zinc-100 transition-colors duration-150">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3h4a3 3 0 0 1 3 3v1" />
      </svg>
      退出登录
    </button>
    <!-- 这里原先还有一份「版本号 + 源码链接」，与页面底部 <footer> 里那份完全重复
         （桌面下侧栏常驻可见 → 同页出现两处）。版本/开源入口统一留在页脚。 -->
  </div>
</aside>
