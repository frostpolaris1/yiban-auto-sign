<div id="modal-account" role="dialog" aria-modal="true" aria-labelledby="form-title" tabindex="-1" class="hidden fixed inset-0 z-40 flex items-center justify-center p-4">
  <div class="absolute inset-0 bg-black/30" onclick="closeForm()"></div>
  <div class="relative bg-white dark:bg-zinc-800 rounded-2xl border border-zinc-200 dark:border-zinc-700 shadow-md w-full max-w-md">
    <form id="account-form" class="flex flex-col max-h-[90vh]">
      <div class="overflow-y-auto overscroll-contain p-5 pb-3 space-y-3">
        <div class="text-base font-semibold tracking-tight text-zinc-900 dark:text-zinc-100 mb-4" id="form-title">添加账号</div>
      <div>
        <label for="f-name" class="block text-sm font-semibold text-zinc-700 dark:text-zinc-200 mb-1">名称（可选，不填显示为 账号N）</label>
        <input id="f-name" type="text" maxlength="50" placeholder="如：武陵123庄方宜"
               class="input">
      </div>
      <div id="f-email-wrap">
        <label for="f-email" class="block text-sm font-semibold text-zinc-700 dark:text-zinc-200 mb-1">绑定用户（可选，绑定后进入待审核）</label>
          <select id="f-email"
                  class="w-full bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-700 rounded-lg text-sm text-zinc-900 dark:text-zinc-100 focus:outline-none focus:border-blue-500 px-3 py-2">
            <option value="">不绑定（管理员自有账号，直接生效）</option>
            <option value="__manual__">手填邮箱（未注册用户自动注册）</option>
            <optgroup label="已注册用户（无账号）" id="f-email-users"></optgroup>
          </select>
          <input id="f-email-manual" type="email" maxlength="64" placeholder="输入未注册邮箱（自动注册并进入待审核）"
                 class="hidden mt-2 w-full bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-700 rounded-lg text-sm text-zinc-900 dark:text-zinc-100 placeholder:text-zinc-400 dark:placeholder:text-zinc-500 focus:outline-none focus:border-blue-500 px-3 py-2">
          <input id="f-initial-password" type="password" maxlength="64" autocomplete="new-password"
                 placeholder="初始密码（至少 10 位）"
                 class="hidden mt-2 w-full bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-700 rounded-lg text-sm text-zinc-900 dark:text-zinc-100 placeholder:text-zinc-400 dark:placeholder:text-zinc-500 focus:outline-none focus:border-blue-500 px-3 py-2">
          <p id="f-initial-password-hint" class="hidden mt-2 text-xs text-zinc-500 dark:text-zinc-400">至少 10 位，且包含大小写字母、数字、符号中的至少两类</p>
        </div>
      <div>
        <label for="f-phone" class="block text-sm font-semibold text-zinc-700 dark:text-zinc-200 mb-1">手机号 <span class="text-red-500 dark:text-red-400">*</span></label>
        <input id="f-phone" type="tel" inputmode="numeric" maxlength="20" required placeholder="易班登录手机号"
               class="input">
        <p id="f-phone-mask-tip" class="hidden mt-1 text-xs text-zinc-500 dark:text-zinc-400">为保护隐私，手机号已打码显示；如需修改请填写完整新号码</p>
      </div>
      <div>
        <label for="f-password" class="block text-sm font-semibold text-zinc-700 dark:text-zinc-200 mb-1">密码 <span class="text-red-500 dark:text-red-400">*</span></label>
        <input id="f-password" type="password" autocomplete="new-password" placeholder="编辑时留空表示不修改"
               class="input">
      </div>
      <div>
        <label for="f-model" class="block text-sm font-semibold text-zinc-700 dark:text-zinc-200 mb-1">设备型号（学校开启设备绑定时建议填写）</label>
        <input id="f-model" type="text" maxlength="50" placeholder="按易班 App 设备绑定页填写"
               class="input">
      </div>
      <div>
        <label for="f-code" class="block text-sm font-semibold text-zinc-700 dark:text-zinc-200 mb-1">设备识别码（学校开启设备绑定时建议填写）</label>
        <input id="f-code" type="text" maxlength="100" placeholder="64 位十六进制识别码"
               class="input">
        <button id="clear-code-btn" type="button" onclick="toggleModalClearCode()"
                class="hidden mt-1 text-xs text-blue-600 dark:text-blue-400 hover:text-blue-700 dark:hover:text-blue-300 transition-colors duration-150">清除已配置识别码</button>
      </div>
      </div>
      <div class="flex items-center gap-2 px-5 py-3 border-t border-zinc-200 dark:border-zinc-700 shrink-0 bg-white dark:bg-zinc-800 rounded-b-2xl">
        <button type="submit" class="btn-primary">保存</button>
        <button type="button" onclick="closeForm()" class="bg-zinc-100 dark:bg-zinc-700 hover:bg-zinc-200 dark:hover:bg-zinc-600 text-zinc-700 dark:text-zinc-200 font-medium rounded-lg px-4 py-2 text-sm transition-colors duration-200">取消</button>
      </div>
    </form>
  </div>
</div>
