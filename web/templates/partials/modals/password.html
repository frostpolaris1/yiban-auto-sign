<div id="modal-password" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4" role="dialog" aria-modal="true" aria-labelledby="modal-password-title">
  <div class="absolute inset-0 bg-black/30" onclick="closePasswordModal()" aria-hidden="true"></div>
  <div class="relative bg-white dark:bg-zinc-800 rounded-2xl border border-zinc-200 dark:border-zinc-700 shadow-md w-full max-w-sm p-5">
    <div class="text-base font-semibold tracking-tight text-zinc-900 dark:text-zinc-100 mb-1" id="modal-password-title">重置密码</div>
    <p id="modal-password-desc" class="text-xs text-zinc-500 dark:text-zinc-400 mb-3"></p>
    <form id="modal-password-form">
      <input id="modal-password-input" type="password" autocomplete="new-password" placeholder="设置新密码（至少 10 位）" class="input">
      <div class="flex items-center gap-2 pt-4">
        <button type="submit" id="modal-password-submit" class="btn-primary">确认重置</button>
        <button type="button" onclick="closePasswordModal()" class="bg-zinc-100 dark:bg-zinc-700 hover:bg-zinc-200 dark:hover:bg-zinc-600 text-zinc-700 dark:text-zinc-200 font-medium rounded-lg px-4 py-2 text-sm transition-colors duration-200">取消</button>
      </div>
    </form>
  </div>
</div>
