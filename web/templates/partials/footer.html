{# 页脚：备案信息（可选，YIBAN_ICP_INFO / YIBAN_POLICE_INFO 留空则不显示）
   + 版本（点击看更新日志）+ 开源入口。 #}
<footer class="d-footer">
  <div class="footer-legal">
    {% if icp_info %}
    <a id="footer-icp" href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">{{ icp_info }}</a>
    {% endif %}
    {% if police_info %}
    <a id="footer-police" href="{{ police_link }}" target="_blank" rel="noopener">
      <img src="{{ request.script_root }}/gongan-beian.png" alt="" width="12" height="13">{{ police_info }}
    </a>
    {% endif %}
  </div>
  <div class="footer-meta">
    <button type="button" class="linklike" onclick="openChangelog()"
            title="点击查看更新日志">易班自动签到 v{{ app_version }}</button>
    <span class="sep" aria-hidden="true">·</span>
    <a href="https://github.com/frostpolaris1/yiban-auto-sign" target="_blank" rel="noopener">开源（AGPL-3.0）· 源码</a>
  </div>
</footer>
