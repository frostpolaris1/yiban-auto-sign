<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<title>我的账号 · 易班自动签到</title>
<script>
  // 暗色主题：尽早应用（防闪烁），localStorage 记忆（受限环境降级为不记忆）
  try { if (localStorage.getItem('theme') === 'dark') { document.documentElement.classList.add('dark'); } } catch (e) {}
</script>
<script>
  // 版本失效兜底：页面版本与上次不同 → 强制刷新（?v= 参数绕过浏览器缓存）
  // 防止部署更新后缓存旧页面导致登录/功能异常
  (function () {
    try {
      var v = '{{ web_version }}';
      var prev = localStorage.getItem('web_version');
      localStorage.setItem('web_version', v);
      if (prev && prev !== v && !location.search.includes('v=' + v)) {
        location.replace('/?v=' + v);
      }
    } catch (e) {}
  })();
</script>
<link rel="stylesheet" href="/static/vendor/fonts/misans/misans.css">
<script src="/static/vendor/tailwind.js"></script>
<script>tailwind.config = { darkMode: 'class' }</script>
<style>
  body { font-family: "MiSans", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

<script>
const $ = (id) => document.getElementById(id);
let accounts = [];
let editingIdx = null;

let csrfToken = '';  // 登录后从 /api/me 获取，写请求统一携带（CSRF 防护）

async function api(path, opts = {}, _retried = false) {
  const resp = await fetch(path, {
    headers: {
      'Content-Type': 'application/json',
      ...(csrfToken ? {'X-CSRF-Token': csrfToken} : {}),
    },
    ...opts,
  });
  // 401 未登录才跳转；403（无权限/CSRF 失败）返回错误提示，由页面展示
  if (resp.status === 401) {
    location.href = '/login';
    throw new Error('未登录');
  }
  const data = await resp.json().catch(() => ({}));
  // CSRF token 不同步（如服务重启/会话更新）：自动重新获取 token 并重试一次，用户无感
  if (resp.status === 403 && !_retried && data.error && data.error.includes('校验失败')) {
    try {
      const me = await fetch('/api/me').then(r => r.json());
      csrfToken = me.csrf_token || '';
      return api(path, opts, true);
    } catch (e) { /* 重试失败则走下方错误提示 */ }
  }
  if (!resp.ok || data.ok === false) {
    throw new Error(data.error || `请求失败 (${resp.status})`);
  }
  return data;
}

function toast(msg, isError = false) {
  const el = $('toast');
  el.textContent = msg;
  el.className = `fixed bottom-4 left-1/2 -translate-x-1/2 z-50 rounded-lg px-4 py-2 shadow-md text-sm text-white ${isError ? 'bg-red-600' : 'bg-zinc-900 dark:bg-zinc-700'}`;
  clearTimeout(el._timer);
  el._timer = setTimeout(() => el.classList.add('hidden'), 3000);
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// 审核状态徽章
function statusBadge(status) {
  if (status === 'pending') return '<span class="inline-flex items-center rounded-lg bg-amber-50 dark:bg-amber-900/20 border border-amber-200 dark:border-amber-800 text-amber-700 dark:text-amber-400 text-xs px-2 py-0.5">待审核</span>';
  if (status === 'rejected') return '<span class="inline-flex items-center rounded-lg bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800 text-red-600 dark:text-red-400 text-xs px-2 py-0.5">已拒绝</span>';
  if (status === 'active') return '<span class="inline-flex items-center rounded-lg bg-green-50 dark:bg-green-900/20 border border-green-200 dark:border-green-800 text-green-700 dark:text-green-400 text-xs px-2 py-0.5">已生效</span>';
  return esc(status);
}

// 加载我的账号
async function loadAccounts() {
  try {
    const data = await api('/api/my-accounts');
    accounts = data.accounts;
    renderList();
  } catch (e) { toast(e.message, true); }
}

function renderList() {
  const list = $('account-list');
  $('accounts-empty').classList.toggle('hidden', accounts.length > 0);
  // 已提交账号时隐藏整个提交区（标题/提示/表单）；编辑时再展开
  $('account-form-section').classList.toggle('hidden', accounts.length > 0);
  list.innerHTML = '';
  accounts.forEach((a, i) => {
    const card = document.createElement('div');
    card.className = 'border border-zinc-200 dark:border-zinc-700 rounded-xl p-4';
    card.innerHTML = `
      <div class="flex flex-wrap items-center justify-between gap-3">
        <div class="flex items-center gap-3">
          <span class="text-lg leading-none">${a.deleted ? '🗑️' : a.state_icon}</span>
          <div>
            <div class="font-medium text-zinc-900 dark:text-zinc-100 text-sm">${esc(a.display_name)}</div>
            <div class="font-mono text-xs text-zinc-500 dark:text-zinc-400">${esc(a.phone)}${a.phone_model ? ' · ' + esc(a.phone_model) : ''}</div>
            ${a.deleted ? '<div class="text-xs text-zinc-400 dark:text-zinc-500 mt-0.5">已被管理员删除，可重新提交</div>'
              : (a.status === 'active' ? (a.state_icon === '✅'
                ? '<div class="text-xs text-green-600 dark:text-green-400 mt-0.5">今日已完成签到</div>'
                : '<div class="text-xs text-zinc-400 dark:text-zinc-500 mt-0.5">前方排队 <span class="font-medium text-zinc-600 dark:text-zinc-300">' + a.queue_ahead + '</span> 人</div>') : '')}
          </div>
        </div>
        <div class="flex items-center gap-2">
          ${a.deleted ? '<span class="inline-flex items-center rounded-lg bg-zinc-100 dark:bg-zinc-700 text-zinc-500 dark:text-zinc-400 text-xs px-2 py-0.5">已删除</span>'
            : statusBadge(a.status)}
          ${a.deleted ? ''
            : `<button onclick="openEditInline(${i})" class="text-sm text-zinc-500 dark:text-zinc-400 hover:text-zinc-900 dark:text-zinc-100 transition-colors duration-150">${a.status === 'rejected' ? '修改并重新提交' : '编辑'}</button>
          <button onclick="deleteAccount(${i})" class="text-sm text-red-600 dark:text-red-400 hover:text-red-700 transition-colors duration-150">删除</button>`}
        </div>
      </div>
      ${a.status === 'rejected' ? `
        <div class="mt-2 text-xs text-red-600 dark:text-red-400 bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800 rounded-lg px-3 py-2">账号已被拒绝${a.reject_reason ? '：' + esc(a.reject_reason) : ''}，点击「修改并重新提交」修正后重新进入审核。</div>` : ''}
      ${a.logs && a.logs.length ? `
        <details class="mt-3">
          <summary class="text-xs text-zinc-400 dark:text-zinc-500 cursor-pointer hover:text-zinc-600 dark:text-zinc-300 dark:hover:text-zinc-300 transition-colors duration-150">最近签到记录（${a.logs.length} 条）</summary>
          <pre class="log-text text-zinc-600 dark:text-zinc-300 mt-2 p-3 bg-zinc-50 dark:bg-zinc-800 rounded-lg whitespace-pre-wrap break-all">${esc(a.logs.join('\n'))}</pre>
        </details>` : ''}
      <div class="mt-4 max-w-sm lg:max-w-none" id="cal-wrap-${esc(a.phone)}"></div>
    `;
    list.appendChild(card);
    if (a.status === 'active') renderCalendar(a.phone);  // 未生效账号不显示日历
  });
}

// ================= 签到日历（按日状态文件 + 日志） =================
const calState = {};  // phone -> {year, month}

function calPad(n) { return String(n).padStart(2, '0'); }

function calShift(btn, delta) {
  const phone = btn.dataset.phone;
  const st = calState[phone] || (calState[phone] = (() => { const d = new Date(); return { year: d.getFullYear(), month: d.getMonth() + 1 }; })());
  st.month += delta;
  if (st.month < 1) { st.month = 12; st.year--; }
  if (st.month > 12) { st.month = 1; st.year++; }
  renderCalendar(phone);
}

function renderCalendar(phone) {
  const wrap = $('cal-wrap-' + phone);
  if (!wrap) return;
  const st = calState[phone] || (calState[phone] = (() => { const d = new Date(); return { year: d.getFullYear(), month: d.getMonth() + 1 }; })());
  const { year, month } = st;
  const monthStr = `${year}-${calPad(month)}`;
  const today = new Date();
  const todayStr = `${today.getFullYear()}-${calPad(today.getMonth() + 1)}-${calPad(today.getDate())}`;
  wrap.innerHTML = `
    <div class="grid lg:grid-cols-2 gap-4">
      <div>
        <div class="flex items-center justify-between mb-2">
          <div class="text-sm font-medium text-zinc-700 dark:text-zinc-200">签到日历 · ${year}年${month}月</div>
          <div class="flex items-center gap-1">
            <button onclick="calShift(this, -1)" data-phone="${esc(phone)}" class="px-2 py-1 rounded-lg text-sm text-zinc-500 dark:text-zinc-400 hover:bg-zinc-100 dark:hover:bg-zinc-700 transition-colors duration-150">←</button>
            <button onclick="calShift(this, 1)" data-phone="${esc(phone)}" class="px-2 py-1 rounded-lg text-sm text-zinc-500 dark:text-zinc-400 hover:bg-zinc-100 dark:hover:bg-zinc-700 transition-colors duration-150">→</button>
          </div>
        </div>
        <div id="cal-grid-${phone}" class="grid grid-cols-7 gap-1"></div>
      </div>
      <div id="cal-log-${phone}" class="lg:pt-8"></div>
    </div>`;
  const grid = $('cal-grid-' + phone);
  grid.innerHTML = ['一','二','三','四','五','六','日'].map(w =>
    `<div class="text-center text-xs text-zinc-400 dark:text-zinc-500 py-1">${w}</div>`).join('');
  api(`/api/my-calendar?month=${monthStr}`).then(data => {
    const firstDay = (new Date(year, month - 1, 1).getDay() + 6) % 7;  // 周一起始
    const days = new Date(year, month, 0).getDate();
    for (let i = 0; i < firstDay; i++) {
      grid.insertAdjacentHTML('beforeend', '<div></div>');
    }
    for (let d = 1; d <= days; d++) {
      const date = `${monthStr}-${calPad(d)}`;
      const stt = data.days && data.days[date] ? data.days[date][phone] || '' : '';
      const wd = new Date(year, month - 1, d).getDay();
      // 状态直接体现在日期数字颜色：✅绿 / ❌红 / 周日灰 / 无记录默认
      let numCls = 'text-zinc-600 dark:text-zinc-300';
      if (wd === 0) numCls = 'text-zinc-300 dark:text-zinc-600';
      else if (stt === '✅') numCls = 'text-green-600 dark:text-green-400 font-medium';
      else if (stt === '❌') numCls = 'text-red-600 dark:text-red-400 font-medium';
      const isToday = date === todayStr;
      grid.insertAdjacentHTML('beforeend', `
        <div onclick="calLoadLog(this, '${date}')" data-phone="${esc(phone)}" title="${date}"
             class="relative aspect-square rounded-lg border ${isToday ? 'border-blue-500 dark:border-blue-400' : 'border-transparent'} flex items-center justify-center text-xs ${numCls} cursor-pointer hover:bg-zinc-100 dark:hover:bg-zinc-700 transition-colors duration-150">
          <span>${d}</span>
        </div>`);
    }
  }).catch(() => {});
}

function calLoadLog(btn, date) {
  const phone = btn.dataset.phone;
  const box = $('cal-log-' + phone);
  // 周日无需签到，直接提示（不查询日志）
  if (new Date(date + 'T00:00:00').getDay() === 0) {
    box.innerHTML = '<div class="text-xs text-zinc-400 dark:text-zinc-500">周日无需签到</div>';
    return;
  }
  box.innerHTML = '<div class="text-xs text-zinc-400 dark:text-zinc-500">加载中…</div>';
  api(`/api/my-logs?date=${date}`).then(data => {
    if (!data.logs || !data.logs.length) {
      box.innerHTML = `<div class="text-xs text-zinc-400 dark:text-zinc-500">${date} 暂无签到记录</div>`;
      return;
    }
    box.innerHTML = `<div class="text-xs text-zinc-500 dark:text-zinc-400 mb-1">${date} 签到记录（${data.logs.length} 条）</div>
      <pre class="log-text text-zinc-600 dark:text-zinc-300 p-3 bg-zinc-50 dark:bg-zinc-800 rounded-lg whitespace-pre-wrap break-all">${esc(data.logs.join(String.fromCharCode(10)))}</pre>`;
  }).catch(e => { box.innerHTML = ''; toast(e.message, true); });
}

// 内联编辑：复用提交表单（编辑时预填，保存走 PUT）
function openEditInline(i) {
  editingIdx = i;
  const a = accounts[i];
  $('f-name').value = a.name;
  $('f-phone').value = a.phone;
  $('f-password').value = '';
  $('f-password').placeholder = '留空表示不修改密码';
  $('f-model').value = a.phone_model;
  $('f-code').value = '';
  $('f-code').placeholder = a.has_phone_code ? '留空表示不修改（已配置）' : '64 位十六进制识别码';
  $('account-form-title').textContent = '编辑我的易班账号';
  $('account-submit-btn').textContent = '保存修改';
  $('cancel-edit-btn').classList.remove('hidden');
  $('submit-done').classList.add('hidden');
  $('account-form-section').classList.remove('hidden');
  $('account-form').classList.remove('hidden');
  $('account-form').scrollIntoView({ behavior: 'smooth' });
}

// 取消编辑：恢复提交态并收起表单（renderList 按账号数重新隐藏）
function cancelEdit() {
  resetAccountForm();
  renderList();
  toast('已取消编辑');
}

function resetAccountForm() {
  editingIdx = null;
  $('account-form-title').textContent = '提交我的易班账号';
  $('account-submit-btn').textContent = '提交账号';
  $('cancel-edit-btn').classList.add('hidden');
  $('f-password').placeholder = '用于自动登录签到';
  $('f-code').placeholder = '64 位十六进制识别码';
}

// 修改密码：默认收起，点击标题展开/收起
function togglePassword() {
  const body = $('password-body');
  const hidden = body.classList.toggle('hidden');
  $('password-arrow').textContent = hidden ? '▸' : '▾';
  document.querySelector('[onclick="togglePassword()"]').setAttribute('aria-expanded', String(!hidden));
}

// 提交账号（无账号=新建；编辑模式=更新）
$('account-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const tip = $('form-tip');
  tip.textContent = '提交中…';
  try {
    const body = {
      name: $('f-name').value,
      phone: $('f-phone').value.trim(),
      password: $('f-password').value,
      phone_model: $('f-model').value.trim(),
      phone_code: $('f-code').value.trim(),
    };
    const data = editingIdx !== null
      ? await api(`/api/my-accounts/${editingIdx}`, { method: 'PUT', body: JSON.stringify(body) })
      : await api('/api/my-accounts', { method: 'POST', body: JSON.stringify(body) });
    tip.textContent = '';
    resetAccountForm();
    e.target.reset();
    toast(data.msg || '已保存');
    loadAccounts();
  } catch (err) {
    tip.textContent = '';
    toast(err.message, true);
  }
});

// 编辑
// 删除
async function deleteAccount(i) {
  const a = accounts[i];
  if (!confirm(`确定删除「${a.display_name}」(${a.phone}) 吗？`)) return;
  try {
    await api(`/api/my-accounts/${i}`, { method: 'DELETE' });
    toast('已删除');
    loadAccounts();
  } catch (e) { toast(e.message, true); }
}

// 服务器时间：本地平滑走秒，60 秒校准一次
let clockOffset = 0;
async function calibrateClock() {
  try {
    const data = await api('/api/clock');
    clockOffset = data.server_ts - Math.floor(Date.now() / 1000);
  } catch (e) { /* 静默 */ }
}
function tickClock() {
  const t = new Date((Math.floor(Date.now() / 1000) + clockOffset) * 1000);
  const pad = (n) => String(n).padStart(2, '0');
  $('user-clock').textContent =
    `服务器时间：${t.getFullYear()}-${pad(t.getMonth() + 1)}-${pad(t.getDate())} ${pad(t.getHours())}:${pad(t.getMinutes())}:${pad(t.getSeconds())}`;
}
setInterval(tickClock, 1000);
setInterval(calibrateClock, 60000);

// 退出
async function doLogout() {
  try { await api('/api/logout', { method: 'POST' }); } catch (e) {}
  location.href = '/login';
}

// 初始化
(async function init() {
  try {
    const me = await api('/api/me');
    if (me.role !== 'user') { location.href = '/'; return; }  // 管理员访问用户页 → 后台
    csrfToken = me.csrf_token || '';
    // 顶部显示邮箱前缀（悬停显示完整邮箱）
    const email = me.email || '';
    $('user-email').textContent = email.split('@')[0];
    $('user-email').title = email;
    loadAccounts();  // 排队/状态：访问时加载一次（静态实时，不轮询）
    calibrateClock();
    tickClock();
  } catch (e) {
    location.href = '/login';
  }
})();
// 暗色主题切换（localStorage 记忆）
function toggleTheme() {
  const dark = document.documentElement.classList.toggle('dark');
  try { localStorage.setItem('theme', dark ? 'dark' : 'light'); } catch (e) {}
  updateThemeBtn();
}
function updateThemeBtn() {
  const dark = document.documentElement.classList.contains('dark');
  document.querySelectorAll('[data-theme-btn]').forEach(b => { b.textContent = dark ? '☀️' : '🌙'; });
}
document.addEventListener('DOMContentLoaded', updateThemeBtn);
</script>
<script>
// 全局公告：访问时加载一次（登录页也显示，无需登录）
async function loadAnnouncement() {
  try {
    const resp = await fetch('/api/announcement');
    const data = await resp.json().catch(() => ({}));
    const text = (data && data.text || '').trim();
    const bar = document.getElementById('announcement-bar');
    const el = document.getElementById('announcement-text');
    if (text && bar && el) {
      el.textContent = text;  // textContent 防 XSS
      bar.classList.remove('hidden');
    }
  } catch (e) { /* 静默 */ }
}
// 更新日志弹窗（版本号点击）
async function openChangelog() {
  const modal = $('changelog-modal');
  modal.classList.remove('hidden');
  const content = $('changelog-content');
  content.textContent = '加载中…';
  try {
    const data = await api('/api/changelog');
    content.textContent = data.text || '暂无更新日志';
  } catch (e) { content.textContent = '加载失败，请稍后重试'; }
}
function closeChangelog() { $('changelog-modal').classList.add('hidden'); }

// 修改密码
$('password-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const tip = $('p-tip');
  tip.textContent = '提交中…';
  try {
    const data = await api('/api/me/password', {
      method: 'POST',
      body: JSON.stringify({ old_password: $('p-old').value, new_password: $('p-new').value }),
    });
    tip.textContent = '';
    e.target.reset();
    toast(data.msg || '密码已更新');
  } catch (err) {
    tip.textContent = '';
    toast(err.message, true);
  }
});

document.addEventListener('DOMContentLoaded', loadAnnouncement);
</script>
