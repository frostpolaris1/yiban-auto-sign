# yiban 日志轮转配置（部署到服务器 /etc/logrotate.d/yiban）
#
# 本文件**不再轮转** sign-status-*.txt（工单 yiban-auto-sign-f7va，2026-10-12）。
# 曾用 copytruncate 且 glob 匹配全部日期：次日 03:00 把当日写入的 8 字节 SUCCESS
# 就地截断为 0 字节，notifempty 又让空文件永不再被轮转——历史日期永远只看到 0 字节。
# 唯一保留期 owner 改为 `yiban/adapters/statefiles/state_gc.py`（其 ARTIFACTS 已登记 sign-status-，
# snapshot 档，默认 7 天）：按日文件只该由一个清理者认领。
# 说明：按天签到日志（sign-YYYY-MM-DD.log）不走 logrotate——由 scripts/yiban-cleanup.sh
#       按文件名日期清理（保留 365 天，服务器 cron 每天 03:00）。
#
# 部署：
#   cp web/deploy/logrotate-yiban.conf /etc/logrotate.d/yiban
#   logrotate -d /etc/logrotate.d/yiban   # 试跑检查
